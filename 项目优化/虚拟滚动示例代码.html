<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>虚拟滚动示例</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 20px;
      color: #333;
    }

    .demo-section {
      background: white;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .demo-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #333;
    }

    /* 虚拟滚动容器 */
    .virtual-scroll-container {
      height: 400px;
      overflow-y: auto;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      position: relative;
    }

    /* 总高度占位 */
    .virtual-scroll-content {
      position: relative;
    }

    /* 列表项 */
    .virtual-item {
      position: absolute;
      left: 0;
      right: 0;
      padding: 12px 16px;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      align-items: center;
      background: white;
    }

    .virtual-item:hover {
      background: #f9f9f9;
    }

    .item-index {
      width: 60px;
      color: #999;
      font-size: 14px;
    }

    .item-content {
      flex: 1;
      color: #333;
    }

    /* 性能对比 */
    .performance-info {
      margin-top: 15px;
      padding: 10px;
      background: #f0f0f0;
      border-radius: 4px;
      font-size: 12px;
      color: #666;
    }

    .controls {
      margin-bottom: 15px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    button {
      padding: 8px 16px;
      background: #1890ff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #40a9ff;
    }

    input {
      padding: 6px 12px;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>虚拟滚动示例</h1>

    <!-- 基础虚拟滚动示例 -->
    <div class="demo-section">
      <div class="demo-title">基础虚拟滚动列表</div>
      <div class="controls">
        <label>数据量：</label>
        <input type="number" id="dataCount" value="10000" min="100" max="1000000" step="1000">
        <button onclick="initVirtualScroll()">重新初始化</button>
        <span id="renderInfo" style="margin-left: 20px; color: #666;"></span>
      </div>
      <div id="virtualScrollContainer" class="virtual-scroll-container">
        <div id="virtualScrollContent" class="virtual-scroll-content"></div>
      </div>
      <div class="performance-info">
        <div>总数据量: <span id="totalCount">0</span></div>
        <div>实际渲染: <span id="renderCount">0</span></div>
        <div>可见范围: <span id="visibleRange">-</span></div>
      </div>
    </div>

    <!-- 对比：普通渲染 -->
    <div class="demo-section">
      <div class="demo-title">对比：普通渲染（仅小数据量，大数据量会卡死）</div>
      <div class="controls">
        <label>数据量：</label>
        <input type="number" id="normalDataCount" value="100" min="10" max="1000" step="10">
        <button onclick="initNormalScroll()">重新初始化</button>
      </div>
      <div id="normalScrollContainer" class="virtual-scroll-container">
        <div id="normalScrollContent"></div>
      </div>
    </div>
  </div>

  <script>
    // 虚拟滚动实现
    class VirtualScroll {
      constructor(container, options = {}) {
        this.container = container;
        this.itemHeight = options.itemHeight || 50; // 每个项目高度
        this.buffer = options.buffer || 3; // 缓冲区，上下各多渲染几个
        this.data = [];
        this.visibleStart = 0;
        this.visibleEnd = 0;
        this.contentEl = null;
        this.items = new Map(); // 存储已创建的 DOM 元素

        this.init();
      }

      init() {
        // 创建内容容器
        this.contentEl = this.container.querySelector('.virtual-scroll-content');
        if (!this.contentEl) {
          this.contentEl = document.createElement('div');
          this.contentEl.className = 'virtual-scroll-content';
          this.container.appendChild(this.contentEl);
        }

        // 绑定滚动事件（使用节流）
        let rafId = null;
        this.container.addEventListener('scroll', () => {
          if (rafId) return;
          rafId = requestAnimationFrame(() => {
            this.updateVisibleRange();
            rafId = null;
          });
        });

        // 初始渲染
        this.updateVisibleRange();
      }

      setData(data) {
        this.data = data;
        this.updateTotalHeight();
        this.updateVisibleRange();
      }

      updateTotalHeight() {
        const totalHeight = this.data.length * this.itemHeight;
        this.contentEl.style.height = totalHeight + 'px';
      }

      updateVisibleRange() {
        const scrollTop = this.container.scrollTop;
        const containerHeight = this.container.clientHeight;

        // 计算可见范围
        const start = Math.max(0, Math.floor(scrollTop / this.itemHeight) - this.buffer);
        const end = Math.min(
          this.data.length,
          Math.ceil((scrollTop + containerHeight) / this.itemHeight) + this.buffer
        );

        // 如果范围没变化，不更新
        if (this.visibleStart === start && this.visibleEnd === end) {
          return;
        }

        this.visibleStart = start;
        this.visibleEnd = end;

        this.render();
        this.updateInfo();
      }

      render() {
        // 销毁不在可见范围内的元素
        for (const [index, el] of this.items.entries()) {
          if (index < this.visibleStart || index >= this.visibleEnd) {
            el.remove();
            this.items.delete(index);
          }
        }

        // 创建可见范围内的元素
        for (let i = this.visibleStart; i < this.visibleEnd; i++) {
          if (!this.items.has(i)) {
            const item = this.createItem(i, this.data[i]);
            this.items.set(i, item);
            this.contentEl.appendChild(item);
          }
        }
      }

      createItem(index, data) {
        const item = document.createElement('div');
        item.className = 'virtual-item';
        item.style.top = (index * this.itemHeight) + 'px';
        item.style.height = this.itemHeight + 'px';

        item.innerHTML = `
          <div class="item-index">#${index}</div>
          <div class="item-content">${data}</div>
        `;

        return item;
      }

      updateInfo() {
        const infoEl = document.getElementById('renderInfo');
        if (infoEl) {
          infoEl.textContent = `渲染: ${this.visibleEnd - this.visibleStart} / ${this.data.length}`;
        }

        const totalCountEl = document.getElementById('totalCount');
        const renderCountEl = document.getElementById('renderCount');
        const visibleRangeEl = document.getElementById('visibleRange');

        if (totalCountEl) totalCountEl.textContent = this.data.length;
        if (renderCountEl) renderCountEl.textContent = this.visibleEnd - this.visibleStart;
        if (visibleRangeEl) visibleRangeEl.textContent = `${this.visibleStart} - ${this.visibleEnd - 1}`;
      }
    }

    // 生成测试数据
    function generateData(count) {
      return Array.from({ length: count }, (_, i) => `列表项 ${i + 1} - 这是第 ${i + 1} 条数据`);
    }

    let virtualScroll = null;

    // 初始化虚拟滚动
    function initVirtualScroll() {
      const container = document.getElementById('virtualScrollContainer');
      const count = parseInt(document.getElementById('dataCount').value) || 10000;
      const data = generateData(count);

      if (virtualScroll) {
        virtualScroll.setData(data);
      } else {
        virtualScroll = new VirtualScroll(container, {
          itemHeight: 50,
          buffer: 5
        });
        virtualScroll.setData(data);
      }
    }

    // 初始化普通渲染（对比用）
    function initNormalScroll() {
      const container = document.getElementById('normalScrollContent');
      const count = parseInt(document.getElementById('normalDataCount').value) || 100;
      const data = generateData(count);

      container.innerHTML = '';
      data.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'virtual-item';
        div.style.position = 'relative';
        div.innerHTML = `
          <div class="item-index">#${index}</div>
          <div class="item-content">${item}</div>
        `;
        container.appendChild(div);
      });
    }

    // 页面加载时初始化
    window.addEventListener('DOMContentLoaded', () => {
      initVirtualScroll();
      initNormalScroll();
    });
  </script>
</body>
</html>
