<!doctype html>
<html lang="zh">

<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>规模以上工业增加值 - 月度趋势</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial;
      margin: 0;
      padding: 16px;
      background: #0b0f19;
      color: #dbe0ea;
    }

    #app {
      height: 80vh;
    }

    .legend-note {
      opacity: .7;
      font-size: 12px;
    }

    .title-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .copy-title-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #9aa4b2;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .copy-title-btn:hover {
      background: #334155;
      color: #e2e8f0;
      border-color: #3b82f6;
    }
    .copy-title-btn:active {
      transform: scale(0.95);
    }
    .copy-ok {
      font-size: 12px;
      opacity: 0.7;
      color: #10b981;
      display: none;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 0.7; }
    }
  </style>
</head>

<body>

    📋 复制
  </button>
  <span id="copyTitleOk" class="copy-ok">✓ 已复制</span>
</div>
<div class="legend-note">展示每月绝对值（左轴），以及环比、同比增速（右轴，单位%）。</div>
  <div style="margin:16px 0; display:flex; gap:4px; align-items:center; flex-wrap:wrap;">
    <div style="display:flex; background:#1e293b; border-radius:10px; padding:4px; gap:2px;">
      <button id="tabSingle" style="background:#3b82f6;color:#ffffff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:all 0.2s ease;min-width:80px;">单指标</button>
      <button id="tabDashboard" style="background:transparent;color:#94a3b8;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:all 0.2s ease;min-width:80px;">数值总表</button>

  <script src="../vendor/echarts.min.js"></script>
  <script src="chart_tooltip_helpers.js"></script>
<script>

    // 标题复制功能
    document.addEventListener('DOMContentLoaded', function() {
      const copyTitleBtn = document.getElementById('copyTitleBtn');
      const copyTitleOk = document.getElementById('copyTitleOk');
      const h2 = document.querySelector('h2');

      if (copyTitleBtn && h2) {
        copyTitleBtn.addEventListener('click', function() {
          const title = h2.textContent.trim();

          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(title).then(function() {
              showCopySuccess();
            }).catch(function(err) {
              console.error('复制失败:', err);
            });
          } else {
            // 备用方法
            const ta = document.createElement('textarea');
            ta.value = title;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            try {
              document.execCommand('copy');
              showCopySuccess();
            } catch (err) {
              console.error('复制失败:', err);
            }
            document.body.removeChild(ta);
          }
        });
      }

      function showCopySuccess() {
        if (copyTitleOk) {
          copyTitleOk.style.display = 'inline';
          setTimeout(function() {
            copyTitleOk.style.display = 'none';
          }, 1500);
        }
      }
    });
    document.addEventListener('click', function (e) {
      var t = e.target; if (t && t.id === 'copyMetricBtn') {
        try {
          var sel = document.getElementById('metric'); var text = sel && sel.value ? sel.value : '';
          if (!text) { return; }
          if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(function () { var ok = document.getElementById('copyMetricOk'); ok.style.display = 'inline'; setTimeout(function () { ok.style.display = 'none'; }, 1200); }); }
          else { var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); var ok = document.getElementById('copyMetricOk'); ok.style.display = 'inline'; setTimeout(function () { ok.style.display = 'none'; }, 1200); }
        } catch (err) { }
      }
    });
    // ── 收藏管理（指标面板） ──
    var FAV_KEY = 'industrial_va_favorites';
    var favorites = new Set(JSON.parse(localStorage.getItem(FAV_KEY) || '[]'));
    var showOnlyFavorites = false;
    function saveFavorites() { localStorage.setItem(FAV_KEY, JSON.stringify([...favorites])); }
    function isFavorite(name) { return favorites.has(name); }
    function toggleFavoriteItem(name) { if (favorites.has(name)) { favorites.delete(name); } else { favorites.add(name); } saveFavorites(); }
    // ── 收藏管理（增长面板）──
    var GROWTH_FAV_KEY = 'industrial_va_growth_favorites';
    var growthFavorites = new Set(JSON.parse(localStorage.getItem(GROWTH_FAV_KEY) || '[]'));
    var showOnlyGrowthFavorites = false;
    function saveGrowthFavorites() { localStorage.setItem(GROWTH_FAV_KEY, JSON.stringify([...growthFavorites])); }
    function isGrowthFavorite(name) { return growthFavorites.has(name); }
    function toggleGrowthFavoriteItem(name) { if (growthFavorites.has(name)) { growthFavorites.delete(name); } else { growthFavorites.add(name); } saveGrowthFavorites(); }
    const payload = { "data": [] };
    fetch("../cleaned_data/industrial_value_added_cleaned.json?t=" + Date.now()).then(r => r.json()).then(json => {

      const allMetricNames = Object.keys(json.metrics || {});
      // 只显示有绝对值数据的指标
      const metricNames = allMetricNames.filter(function(n) {
        const metric = json.metrics[n];
        return metric.some(function(item) {
          return item.value != null || item.valueMonthly != null;
        });
      });
      const prefer = metricNames[0]; // 默认选择第一个有数值的指标
      const select = document.getElementById("metric");
      metricNames.forEach(n => { const opt = document.createElement("option"); opt.value = n; opt.textContent = n; if (n === prefer) opt.selected = true; select.appendChild(opt); });
  const el = document.getElementById("app");
  const chart = echarts.init(el, null, { renderer: "canvas" });
      function renderSingle(name) {
        const rows = (json.metrics && json.metrics[name]) || [];
        const x = rows.map(d => d.yearMonth);
        const abs = rows.map(d => d.valueMonthly != null ? d.valueMonthly : d.value);
        const mom = rows.map(d => d.mom);
        const yoy = rows.map(d => d.yoy);

        // Check if this metric has any absolute values
        const hasAbsoluteValues = abs.some(v => v != null);

        const option = {
          backgroundColor: "#0b0f19",
          tooltip: buildConfinedTooltip({ trigger: "axis", valueFormatter: v => v == null ? "-" : v }),
          legend: {
            data: hasAbsoluteValues ?
              [name + "-当月值", name + "-环比%", name + "-同比%"] :
              [name + "-环比%", name + "-同比%"],
            textStyle: { color: "#cbd5e1" }
          },
          grid: { left: 60, right: 60, top: 40, bottom: 40 },
          xAxis: { type: "category", data: x, axisLabel: { color: "#9aa4b2" } },
          yAxis: hasAbsoluteValues ? [
            { type: "value", name: "当月值", position: "left", axisLabel: { color: "#9aa4b2" }, splitLine: { lineStyle: { color: "#1f2937" } } },
            { type: "value", name: "%", position: "right", axisLabel: { color: "#9aa4b2" }, splitLine: { show: false } }
          ] : [
            { type: "value", name: "%", position: "left", axisLabel: { color: "#9aa4b2" }, splitLine: { lineStyle: { color: "#1f2937" } } }
          ],
          series: []
        };

        if (hasAbsoluteValues) {
          option.series.push(
            { name: name + "-当月值", type: "line", yAxisIndex: 0, data: abs, smooth: true, lineStyle: { width: 3, color: '#3b82f6' }, symbol: "circle", symbolSize: 6, itemStyle: { color: '#3b82f6' } },
            { name: name + "-环比%", type: "line", yAxisIndex: 1, data: mom, smooth: true, lineStyle: { width: 2.5, type: 'dashed', color: '#f59e0b' }, symbol: "triangle", symbolSize: 6, itemStyle: { color: '#f59e0b' } },
            { name: name + "-同比%", type: "line", yAxisIndex: 1, data: yoy, smooth: true, lineStyle: { width: 2.5, type: 'solid', color: '#ec4899' }, symbol: "diamond", symbolSize: 6, itemStyle: { color: '#ec4899' } }
          );
        } else {
          option.series.push(
            { name: name + "-环比%", type: "line", yAxisIndex: 0, data: mom, smooth: true, lineStyle: { width: 2.5, type: 'dashed', color: '#f59e0b' }, symbol: "triangle", symbolSize: 6, itemStyle: { color: '#f59e0b' } },
            { name: name + "-同比%", type: "line", yAxisIndex: 0, data: yoy, smooth: true, lineStyle: { width: 2.5, type: 'solid', color: '#ec4899' }, symbol: "diamond", symbolSize: 6, itemStyle: { color: '#ec4899' } }
          );
        }

        chart.setOption(option, true);
      }
      function renderGrid() {
        const grid = document.getElementById('grid');
        const filter = document.getElementById('filter');
        const metricCount = document.getElementById('metricCount');
        const keyword = (filter.value || '').trim();
        grid.innerHTML = '';

        // 只显示有绝对值数据的指标
        const allNames = Object.keys(json.metrics || {});
        const names = allNames.filter(function(n) {
          if (showOnlyFavorites && !favorites.has(n)) return false;
          if (keyword && !n.includes(keyword)) return false;
          const metric = json.metrics[n];
          return metric.some(function(item) {
            return item.value != null || item.valueMonthly != null;
          });
        });
        names.sort(function(a, b) {
          var af = favorites.has(a) ? 0 : 1; var bf = favorites.has(b) ? 0 : 1;
          if (af !== bf) return af - bf; return a.localeCompare(b);
        });

        metricCount.textContent = names.length + ' 个指标（有具体数值）' + (showOnlyFavorites ? '（仅收藏）' : '');
        names.forEach(function (name) {
          const card = document.createElement('div'); card.style.background = '#0f172a'; card.style.border = '1px solid ' + (favorites.has(name) ? '#f43f5e' : '#1f2937'); card.style.borderRadius = '12px'; card.style.padding = '12px'; card.style.transition = 'all 0.3s ease'; card.style.boxShadow = favorites.has(name) ? '0 2px 8px rgba(244,63,94,.25)' : '0 2px 8px rgba(0,0,0,0.3)'; card.style.position = 'relative'; card.dataset.favorited = favorites.has(name) ? '1' : '';
          const titleWrapper = document.createElement('div'); titleWrapper.style.display = 'flex'; titleWrapper.style.justifyContent = 'space-between'; titleWrapper.style.alignItems = 'center'; titleWrapper.style.margin = '0 0 8px 0';
          const title = document.createElement('div'); title.textContent = name; title.style.fontSize = '14px'; title.style.opacity = '0.95'; title.style.fontWeight = 'bold'; title.style.color = '#e2e8f0'; title.style.flex = '1'; title.style.textAlign = 'center';
          const copyBtn = document.createElement('button'); copyBtn.innerHTML = '📋'; copyBtn.style.background = 'none'; copyBtn.style.border = 'none'; copyBtn.style.color = '#9aa4b2'; copyBtn.style.fontSize = '14px'; copyBtn.style.cursor = 'pointer'; copyBtn.style.padding = '4px'; copyBtn.style.borderRadius = '4px'; copyBtn.style.transition = 'all 0.2s'; copyBtn.title = '复制名称';
          copyBtn.onmouseenter = function () { copyBtn.style.background = '#1f2937'; copyBtn.style.color = '#10b981'; };
          copyBtn.onmouseleave = function () { copyBtn.style.background = 'none'; copyBtn.style.color = '#9aa4b2'; };
          copyBtn.onclick = function (e) { e.stopPropagation(); const text = name; if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(function () { copyBtn.innerHTML = '✓'; copyBtn.style.color = '#10b981'; setTimeout(function () { copyBtn.innerHTML = '📋'; copyBtn.style.color = '#9aa4b2'; }, 1000); }); } else { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); copyBtn.innerHTML = '✓'; copyBtn.style.color = '#10b981'; setTimeout(function () { copyBtn.innerHTML = '📋'; copyBtn.style.color = '#9aa4b2'; }, 1000); } catch (err) {} document.body.removeChild(ta); } };
          const zoomBtn = document.createElement('button'); zoomBtn.innerHTML = '🔍'; zoomBtn.style.background = 'none'; zoomBtn.style.border = 'none'; zoomBtn.style.color = '#9aa4b2'; zoomBtn.style.fontSize = '16px'; zoomBtn.style.cursor = 'pointer'; zoomBtn.style.padding = '4px'; zoomBtn.style.borderRadius = '4px'; zoomBtn.style.transition = 'all 0.2s'; zoomBtn.title = '放大查看';
          zoomBtn.onmouseenter = function () { zoomBtn.style.background = '#1f2937'; zoomBtn.style.color = '#3b82f6'; };
          zoomBtn.onmouseleave = function () { zoomBtn.style.background = 'none'; zoomBtn.style.color = '#9aa4b2'; };
          const heartBtn = document.createElement('button'); heartBtn.textContent = favorites.has(name) ? '❤️' : '🤍'; heartBtn.title = favorites.has(name) ? '取消收藏' : '收藏'; heartBtn.style.background = 'none'; heartBtn.style.border = 'none'; heartBtn.style.fontSize = '15px'; heartBtn.style.cursor = 'pointer'; heartBtn.style.padding = '4px'; heartBtn.style.borderRadius = '4px'; heartBtn.style.lineHeight = '1'; heartBtn.style.transition = 'transform 0.15s';
          heartBtn.onmouseenter = function () { heartBtn.style.transform = 'scale(1.3)'; };
          heartBtn.onmouseleave = function () { heartBtn.style.transform = 'scale(1)'; };
          heartBtn.onclick = function (e) { e.stopPropagation(); toggleFavoriteItem(name); setFavStyle(card, this, isFavorite(name)); this.style.transform = 'scale(1.5)'; var self = this; setTimeout(function () { self.style.transform = 'scale(1)'; }, 160); if (showOnlyFavorites) renderGrid(); };
          titleWrapper.appendChild(title); titleWrapper.appendChild(copyBtn); titleWrapper.appendChild(zoomBtn); titleWrapper.appendChild(heartBtn);
          const div = document.createElement('div'); div.style.height = '200px';
          card.appendChild(titleWrapper); card.appendChild(div); grid.appendChild(card);
          const rows = (json.metrics && json.metrics[name]) || [];
          const yearData = {}; const yoyData = {}; const momData = {};
          rows.forEach(function (d) {
            const y = d.yearMonth ? d.yearMonth.slice(0, 4) : '';
            const v = (d.valueMonthly != null ? d.valueMonthly : d.value);
            const yoy = d.yoy;
            const mom = d.mom;
            if (y && v != null) {
              (yearData[y] || (yearData[y] = [])).push({ month: d.yearMonth, value: v });
            }
            if (y && yoy != null) {
              (yoyData[y] || (yoyData[y] = [])).push({ month: d.yearMonth, yoy: yoy });
            }
            if (y && mom != null) {
              (momData[y] || (momData[y] = [])).push({ month: d.yearMonth, mom: mom });
            }
            // For metrics with only growth rate data (like 规模以上工业增加值), ensure year data exists
            if (y && (yoy != null || mom != null) && !yearData[y]) {
              yearData[y] = [];
            }
          });
          const c = echarts.init(div);
          const option = { backgroundColor: '#0f172a', grid: { left: 50, right: 50, top: 35, bottom: 35 }, xAxis: { type: 'category', data: ['1-2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'], axisLabel: { color: '#9aa4b2', fontSize: 11 } }, yAxis: [{ type: 'value', position: 'left', axisLabel: { color: '#9aa4b2', fontSize: 11 }, splitLine: { lineStyle: { color: '#1f2937' } } }, { type: 'value', position: 'right', axisLabel: { color: '#9aa4b2', fontSize: 11, formatter: '{value}%' }, splitLine: { show: false } }], series: [], legend: { show: true, top: 0, textStyle: { color: '#cbd5e1', fontSize: 11 } }, tooltip: buildConfinedTooltip({ trigger: 'axis', axisPointer: { type: 'line', lineStyle: { color: '#64748b', type: 'dashed' } }, backgroundColor: 'rgba(15, 23, 42, 0.95)', borderColor: '#1f2937', textStyle: { color: '#e2e8f0' }, formatter: function (ps) { let s = ps[0].name + '<br/>'; ps.forEach(function (p) { if (p.seriesName.includes('同比') || p.seriesName.includes('环比')) { s += (p.marker || '') + p.seriesName + ': ' + (p.value != null ? p.value + '%' : '-') + '<br/>'; } else { s += (p.marker || '') + p.seriesName + ': ' + (p.value != null ? p.value : '-') + '<br/>'; } }); return s; } }), };
          const colors = ['#ef4444', '#3b82f6', '#10b981', '#8b5cf6', '#06b6d4'];
          const years = Object.keys(yearData).sort();
          const latestYear = years[years.length - 1]; // 获取最新年份

          years.forEach(function (y, idx) {
            const isLatestYear = (y === latestYear);
            const isHistoricalYear = !isLatestYear;

            // 如果是历史年份且用户选择隐藏历史年份，则跳过
            if (isHistoricalYear && !showHistoricalYears) {
              return;
            }

            const data = new Array(11).fill(null);

        var btn = document.getElementById('toggleGrowthFavOnly');
        if (!btn) return;
        btn.style.background = showOnlyGrowthFavorites ? '#f43f5e' : '#0f172a';
        btn.style.color = showOnlyGrowthFavorites ? '#ffffff' : '#e5e7eb';
        btn.style.borderColor = showOnlyGrowthFavorites ? '#f43f5e' : '#334155';
      }

      // 更新按钮样式
      function updateButtonStyles() {
        const momBtn = document.getElementById('toggleMom');
        const yoyBtn = document.getElementById('toggleYoy');
        const historicalBtn = document.getElementById('toggleHistorical');

        if (momBtn) {
          momBtn.style.background = showMomCurve ? '#3b82f6' : '#0f172a';
          momBtn.style.color = showMomCurve ? '#ffffff' : '#e5e7eb';
        }

        if (yoyBtn) {
          yoyBtn.style.background = showYoyCurve ? '#3b82f6' : '#0f172a';
          yoyBtn.style.color = showYoyCurve ? '#ffffff' : '#e5e7eb';
        }

        if (historicalBtn) {
          historicalBtn.style.background = showHistoricalYears ? '#3b82f6' : '#0f172a';
          historicalBtn.style.color = showHistoricalYears ? '#ffffff' : '#e5e7eb';
        }
      }

      // 更新增长率按钮样式
      function updateGrowthButtonStyles() {
        const yoyBtn = document.getElementById('toggleGrowthYoy');
        const historicalBtn = document.getElementById('toggleGrowthHistorical');

        if (yoyBtn) {
          yoyBtn.style.background = showGrowthYoyCurve ? '#3b82f6' : '#64748b';
          yoyBtn.style.color = '#ffffff';
          yoyBtn.textContent = showGrowthYoyCurve ? '显示' : '隐藏';
          yoyBtn.onmouseenter = function() {
            this.style.background = showGrowthYoyCurve ? '#2563eb' : '#475569';
          };
          yoyBtn.onmouseleave = function() {
            this.style.background = showGrowthYoyCurve ? '#3b82f6' : '#64748b';
          };
        }

        if (historicalBtn) {
          historicalBtn.style.background = showGrowthHistoricalYears ? '#3b82f6' : '#64748b';
          historicalBtn.style.color = '#ffffff';
          historicalBtn.textContent = showGrowthHistoricalYears ? '显示' : '隐藏';
          historicalBtn.onmouseenter = function() {
            this.style.background = showGrowthHistoricalYears ? '#2563eb' : '#475569';
          };
          historicalBtn.onmouseleave = function() {
            this.style.background = showGrowthHistoricalYears ? '#3b82f6' : '#64748b';
          };
        }
      }

      // 放大图表功能
      function showZoomChart(name, rows, yearData, yoyData) {
        const modal = document.getElementById('zoomModal');
        const title = document.getElementById('zoomTitle');
        const chartDiv = document.getElementById('zoomChart');

        // 销毁之前的图表实例
        if (currentZoomChart) {
          currentZoomChart.dispose();
          currentZoomChart = null;
        }

        // 移除之前的resize监听器
        if (zoomResizeHandler) {
          window.removeEventListener('resize', zoomResizeHandler);
          zoomResizeHandler = null;
        }

        title.textContent = name + ' - 详细视图';
        modal.style.display = 'block';

        // 等待DOM更新后再初始化图表
        setTimeout(function() {
          // 清空并重新初始化图表
          chartDiv.innerHTML = '';
          currentZoomChart = echarts.init(chartDiv);

        const option = {
          backgroundColor: '#0b0f19',
          grid: { left: 80, right: 80, top: 60, bottom: 60 },
          xAxis: { type: 'category', data: ['1-2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'], axisLabel: { color: '#9aa4b2', fontSize: 14 } },
          yAxis: [
            { type: 'value', position: 'left', axisLabel: { color: '#9aa4b2', fontSize: 14 }, splitLine: { lineStyle: { color: '#1f2937' } } },
            { type: 'value', position: 'right', axisLabel: { color: '#9aa4b2', fontSize: 14, formatter: '{value}%' }, splitLine: { show: false } }
          ],
          series: [],
          legend: { show: true, top: 10, textStyle: { color: '#cbd5e1', fontSize: 14 } },
          tooltip: buildConfinedTooltip({
            trigger: 'axis',
            axisPointer: { type: 'line', lineStyle: { color: '#64748b', type: 'dashed' } },
            backgroundColor: 'rgba(15, 23, 42, 0.95)',
            borderColor: '#1f2937',
            textStyle: { color: '#e2e8f0', fontSize: 14 },
            formatter: function (ps) {
              let s = ps[0].name + '<br/>';
              ps.forEach(function (p) {
                if (p.seriesName.includes('同比')) {
                  s += (p.marker || '') + p.seriesName + ': ' + (p.value != null ? p.value + '%' : '-') + '<br/>';
                } else {
                  s += (p.marker || '') + p.seriesName + ': ' + (p.value != null ? p.value : '-') + '<br/>';
                }
              });
              return s;
            }
          }),
          dataZoom: [
            { type: 'slider', show: true, xAxisIndex: [0], start: 0, end: 100 },
            { type: 'inside', xAxisIndex: [0] }
          ]
        };

        const colors = ['#ef4444', '#3b82f6', '#10b981', '#8b5cf6', '#06b6d4'];
        Object.keys(yearData).sort().forEach(function (y, idx) {
          const data = new Array(11).fill(null);
          const yoyDataArray = new Array(11).fill(null);
          (yearData[y] || []).forEach(function (it) { const m = it.month ? parseInt(it.month.slice(5, 7), 10) : 0; if (m === 1 || m === 2) { data[0] = it.value; } else if (m >= 3 && m <= 12) { data[m - 2] = it.value; } });
          (yoyData[y] || []).forEach(function (it) { const m = it.month ? parseInt(it.month.slice(5, 7), 10) : 0; if (m === 1 || m === 2) { yoyDataArray[0] = it.yoy; } else if (m >= 3 && m <= 12) { yoyDataArray[m - 2] = it.yoy; } });
          option.series.push({ type: 'line', name: y + '年', yAxisIndex: 0, emphasis: { focus: 'series', lineStyle: { width: 3 }, itemStyle: { borderColor: '#fff', borderWidth: 1 } }, blur: { lineStyle: { opacity: 0.12 }, itemStyle: { opacity: 0.12 } }, data: data, smooth: true, symbol: 'circle', symbolSize: 8, lineStyle: { color: colors[idx % colors.length], width: 3.5 }, itemStyle: { color: colors[idx % colors.length] } });
          option.series.push({ type: 'line', name: y + '年同比', yAxisIndex: 1, emphasis: { focus: 'series', lineStyle: { width: 3 }, itemStyle: { borderColor: '#fff', borderWidth: 1 } }, blur: { lineStyle: { opacity: 0.12 }, itemStyle: { opacity: 0.12 } }, data: yoyDataArray, smooth: true, symbol: 'diamond', symbolSize: 6, lineStyle: { color: '#e879f9', width: 2.5, type: 'solid' }, itemStyle: { color: '#e879f9' } });
        });

          currentZoomChart.setOption(option);

          // 创建新的resize监听器
          zoomResizeHandler = function() {
            if (modal.style.display !== 'none' && currentZoomChart) {
              currentZoomChart.resize();
            }
          };
          window.addEventListener('resize', zoomResizeHandler);
        }, 100);
      }

      // 增长率放大图表功能
      function showGrowthZoomChart(name, rows, yoyData, momData) {
        const modal = document.getElementById('zoomModal');
        const title = document.getElementById('zoomTitle');
        const chartDiv = document.getElementById('zoomChart');

        // 销毁之前的图表实例
        if (currentZoomChart) {
          currentZoomChart.dispose();
          currentZoomChart = null;
        }

        // 移除之前的resize监听器
        if (zoomResizeHandler) {
          window.removeEventListener('resize', zoomResizeHandler);
          zoomResizeHandler = null;
        }

        title.textContent = name + ' - 详细视图（增长率）';
        modal.style.display = 'block';

        // 等待DOM更新后再初始化图表
        setTimeout(function() {
          // 清空并重新初始化图表
          chartDiv.innerHTML = '';
          currentZoomChart = echarts.init(chartDiv);

        const option = {
          backgroundColor: '#0b0f19',
          grid: { left: 80, right: 80, top: 60, bottom: 60 },
          xAxis: { type: 'category', data: ['1-2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'], axisLabel: { color: '#9aa4b2', fontSize: 14 } },
          yAxis: [
            { type: 'value', position: 'left', axisLabel: { color: '#9aa4b2', fontSize: 14, formatter: '{value}%' }, splitLine: { lineStyle: { color: '#1f2937' } } }
          ],
          series: [],
          legend: { show: true, top: 10, textStyle: { color: '#cbd5e1', fontSize: 14 } },
          tooltip: buildConfinedTooltip({
            trigger: 'axis',
            axisPointer: { type: 'line', lineStyle: { color: '#64748b', type: 'dashed' } },
            backgroundColor: 'rgba(15, 23, 42, 0.95)',
            borderColor: '#1f2937',
            textStyle: { color: '#e2e8f0', fontSize: 14 },
            formatter: function (ps) {
              let s = ps[0].name + '<br/>';
              ps.forEach(function (p) {
                s += (p.marker || '') + p.seriesName + ': ' + (p.value != null ? p.value + '%' : '-') + '<br/>';
              });
              return s;
            }
          }),
          dataZoom: [
            { type: 'slider', show: true, xAxisIndex: [0], start: 0, end: 100 },
            { type: 'inside', xAxisIndex: [0] }
          ]
        };

        const years = Object.keys(yoyData).sort();
        const latestYear = years[years.length - 1];

        years.forEach(function (y, idx) {
          const isLatestYear = (y === latestYear);
          const yoyDataArray = new Array(11).fill(null);
          const momDataArray = new Array(11).fill(null);
          (yoyData[y] || []).forEach(function (it) { const m = it.month ? parseInt(it.month.slice(5, 7), 10) : 0; if (m === 1 || m === 2) { yoyDataArray[0] = it.yoy; } else if (m >= 3 && m <= 12) { yoyDataArray[m - 2] = it.yoy; } });
          (momData[y] || []).forEach(function (it) { const m = it.month ? parseInt(it.month.slice(5, 7), 10) : 0; if (m === 1 || m === 2) { momDataArray[0] = it.mom; } else if (m >= 3 && m <= 12) { momDataArray[m - 2] = it.mom; } });

          if (isLatestYear) {
            // 最新年份使用突出的颜色
            option.series.push({ type: 'line', name: y + '年同比', yAxisIndex: 0, emphasis: { focus: 'series', lineStyle: { width: 3 }, itemStyle: { borderColor: '#fff', borderWidth: 1 } }, blur: { lineStyle: { opacity: 0.12 }, itemStyle: { opacity: 0.12 } }, data: yoyDataArray, smooth: true, symbol: 'circle', symbolSize: 6, lineStyle: { color: '#e879f9', width: 3.5, type: 'solid' }, itemStyle: { color: '#e879f9' } });
          } else {
            // 历史年份使用区分度高的颜色
            const historicalColors = ['#ef4444', '#c084fc', '#8b5cf6', '#06b6d4', '#84cc16', '#f97316', '#ec4899', '#6366f1'];
            // 计算历史年份的索引，确保每个历史年份使用不同颜色
            const historicalYearIndex = years.slice(0, -1).indexOf(y); // 排除最新年份后的索引
            const colorIndex = historicalYearIndex % historicalColors.length;
            option.series.push({ type: 'line', name: y + '年同比', yAxisIndex: 0, emphasis: { focus: 'series', lineStyle: { width: 3 }, itemStyle: { borderColor: '#fff', borderWidth: 1 } }, blur: { lineStyle: { opacity: 0.12 }, itemStyle: { opacity: 0.12 } }, data: yoyDataArray, smooth: true, symbol: 'circle', symbolSize: 5, lineStyle: { color: historicalColors[colorIndex], width: 2.5 }, itemStyle: { color: historicalColors[colorIndex] } });
          }
        });

          currentZoomChart.setOption(option);

          // 创建新的resize监听器
          zoomResizeHandler = function() {
            if (modal.style.display !== 'none' && currentZoomChart) {
              currentZoomChart.resize();
            }
          };
          window.addEventListener('resize', zoomResizeHandler);
        }, 100);
      }

      // 关闭放大模态框
      function closeZoomModal() {
        const modal = document.getElementById('zoomModal');
        modal.style.display = 'none';

        // 销毁图表实例和事件监听器
        if (currentZoomChart) {
          currentZoomChart.dispose();
          currentZoomChart = null;
        }
        if (zoomResizeHandler) {
          window.removeEventListener('resize', zoomResizeHandler);
          zoomResizeHandler = null;
        }
      }

      renderSingle(prefer);
      select.addEventListener("change", function () { renderSingle(this.value); });
      document.getElementById('tabSingle').addEventListener('click', function () { switchTab('single'); });
      document.getElementById('tabDashboard').addEventListener('click', function () { switchTab('dash'); });
      document.getElementById('tabGrowthDashboard').addEventListener('click', function () { switchTab('growth'); });
      document.getElementById('tabTable').addEventListener('click', function () { switchTab('table'); });

      // 环比同比按钮事件监听器
      document.getElementById('toggleMom').addEventListener('click', function () {
        showMomCurve = !showMomCurve;
        updateButtonStyles();
        renderGrid();
      });
      document.getElementById('toggleYoy').addEventListener('click', function () {
        showYoyCurve = !showYoyCurve;
        updateButtonStyles();
        renderGrid();
      });
      document.getElementById('toggleHistorical').addEventListener('click', function () {
        showHistoricalYears = !showHistoricalYears;
        updateButtonStyles();
        renderGrid();
      });

      // 更新增速参考线按钮样式
      function updateGrowthLinesButtonStyle() {
        const btn = document.getElementById('toggleGrowthLines');
        if (btn) {
          btn.style.background = showGrowthLines ? '#3b82f6' : '#0f172a';
          btn.style.color = showGrowthLines ? '#ffffff' : '#e5e7eb';
          btn.textContent = showGrowthLines ? '开启' : '关闭';
        }
      }

      // 增速参考线按钮事件监听器
      const toggleGrowthLinesBtn = document.getElementById('toggleGrowthLines');
      if (toggleGrowthLinesBtn) {
        toggleGrowthLinesBtn.addEventListener('click', function () {
          showGrowthLines = !showGrowthLines;
          localStorage.setItem('industrial_va_growth_lines', JSON.stringify(showGrowthLines));
          updateGrowthLinesButtonStyle();
          renderGrid();
        });
        updateGrowthLinesButtonStyle();
      }

      /* ── 仅收藏开关（指标面板） ── */
      document.getElementById('toggleFavOnly').addEventListener('click', function () {
        showOnlyFavorites = !showOnlyFavorites;
        updateFavOnlyBtn();
        renderGrid();
      });
      updateFavOnlyBtn();

      /* ── 仅收藏开关（增长面板） ── */
      document.getElementById('toggleGrowthFavOnly').addEventListener('click', function () {
        showOnlyGrowthFavorites = !showOnlyGrowthFavorites;
        updateGrowthFavOnlyBtn();
        renderGrowthGrid();
      });
      updateGrowthFavOnlyBtn();

      // 增长率总表按钮事件监听器
      document.getElementById('toggleGrowthYoy').addEventListener('click', function () {
        showGrowthYoyCurve = !showGrowthYoyCurve;
        updateGrowthButtonStyles();
        renderGrowthGrid();
      });
      document.getElementById('toggleGrowthHistorical').addEventListener('click', function () {
        showGrowthHistoricalYears = !showGrowthHistoricalYears;
        updateGrowthButtonStyles();
        renderGrowthGrid();
      });

      // 模态框关闭事件
      document.getElementById('zoomModal').addEventListener('click', function () {
        closeZoomModal();
      });
      document.getElementById('closeZoom').addEventListener('click', function () {
        closeZoomModal();
      });
});
</script>

  <!-- 放大模态框 -->
  <div id="zoomModal"
    style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; cursor:pointer;">
    <div
      style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:90%; height:80%; max-width:1200px; background:#0b0f19; border-radius:12px; padding:20px; cursor:default;"
      onclick="event.stopPropagation();">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h3 id="zoomTitle" style="color:#e2e8f0; margin:0; font-size:18px;"></h3>
        <button id="closeZoom"
          style="background:none; border:none; color:#9aa4b2; font-size:24px; cursor:pointer; padding:4px 8px;">×</button>
      </div>
      <div id="zoomChart" style="width:100%; height:calc(100% - 60px);"></div>
    </div>
  </div>
</body>
