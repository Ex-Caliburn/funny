<!doctype html>
<html lang="zh">

<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>能源生产数据 - 月度趋势</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial;
      margin: 0;
      padding: 16px;
      background: #0b0f19;
      color: #dbe0ea;
    }

    #app {
      height: 80vh;
    }

    .legend-note {
      opacity: .7;
      font-size: 12px;
    }

    .title-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .copy-title-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #9aa4b2;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .copy-title-btn:hover {
      background: #334155;
      color: #e2e8f0;
      border-color: #3b82f6;
    }
    .copy-title-btn:active {
      transform: scale(0.95);
    }
    .copy-ok {
      font-size: 12px;
      opacity: 0.7;
      color: #10b981;
      display: none;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 0.7; }
    }
  </style>
</head>

<body>
<div class="title-wrapper">
  <h2 style="margin:0;">能源生产数据 - 月度趋势</h2>
  <button id="copyTitleBtn" class="copy-title-btn" title="复制标题">
    📋 复制
  </button>
  <span id="copyTitleOk" class="copy-ok">✓ 已复制</span>
</div>
<div class="legend-note">展示每月绝对值（左轴），以及环比、同比增速（右轴，单位%）。</div>
  <div style="margin:16px 0; display:flex; gap:4px; align-items:center; flex-wrap:wrap;">
    <div style="display:flex; background:#1e293b; border-radius:10px; padding:4px; gap:2px;">
      <button id="tabSingle" style="background:#3b82f6;color:#ffffff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:all 0.2s ease;min-width:80px;">单指标</button>
      <button id="tabPowerGen" style="background:transparent;color:#94a3b8;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:all 0.2s ease;min-width:80px;">发电量</button>
      <button id="tabDashboard" style="background:transparent;color:#94a3b8;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:all 0.2s ease;min-width:80px;">总表</button>
      <button id="tabTable" style="background:transparent;color:#94a3b8;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:all 0.2s ease;min-width:80px;">趋势图</button>
    </div>
    <span style="opacity:.6; font-size:12px; margin-left:12px; color:#64748b;">单指标支持切换指标；发电量为发电子项目增速；总表为所有指标当月值小图；趋势图为多指标合并曲线</span>
  </div>
  <div id="singleWrap">
    <div style="margin:12px 0; display:flex; gap:12px; align-items:center;"><label for="metric"
        style="opacity:.8">指标</label><select id="metric"
        style="background:#0f172a;color:#e5e7eb;border:1px solid #334155;padding:6px 8px;border-radius:6px;"></select><button
        id="copyMetricBtn"
        style="background:#0f172a;color:#e5e7eb;border:1px solid #334155;padding:6px 8px;border-radius:6px;cursor:pointer;">复制选中指标</button><span
        id="copyMetricOk" style="font-size:12px;opacity:.7;display:none;">已复制</span></div>
<div id="app"></div>
  </div>
  <div id="powerGenWrap" style="display:none">
    <div style="margin:12px 0; display:flex; gap:12px; align-items:center;">
      <span style="opacity:.8; font-size:16px; font-weight:bold;">发电量各子项目同比增速对比</span>
    </div>
    <div id="powerGenChart" style="height:70vh;"></div>
  </div>
  <div id="dashboardWrap" style="display:none">
    <div style="margin:12px 0; display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
      <input id="filter" placeholder="过滤关键字" style="min-width:240px" />
      <span id="metricCount" style="opacity:.7"></span>
      <div style="margin-left:auto; display:flex; gap:8px; align-items:center;">
        <span style="opacity:.7; font-size:12px;">显示曲线：</span>
        <button id="toggleMom" style="background:#0f172a;color:#e5e7eb;border:1px solid #334155;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:12px;">环比</button>
        <button id="toggleYoy" style="background:#0f172a;color:#e5e7eb;border:1px solid #334155;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:12px;">同比</button>
        <span style="opacity:.7; font-size:12px; margin-left:12px;">历史年份：</span>
        <button id="toggleHistorical" style="background:#0f172a;color:#e5e7eb;border:1px solid #334155;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:12px;">显示</button>
        <span style="opacity:.7; font-size:12px; margin-left:12px;">增速参考线：</span>
        <button id="toggleGrowthLines" style="background:#0f172a;color:#e5e7eb;border:1px solid #334155;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:12px;">关闭</button>
        <span style="opacity:.7; font-size:12px; margin-left:12px;">收藏：</span>
        <button id="toggleFavOnly" style="background:#0f172a;color:#e5e7eb;border:1px solid #334155;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:12px;">❤️ 仅收藏</button>
      </div>
    </div>
    <div id="grid"
      style="padding:0 16px 24px 16px; display:grid; grid-template-columns:repeat(3,1fr); gap:16px; width:100%; box-sizing:border-box;">
    </div>
  </div>
  <div id="tableWrap" style="display:none;">
    <div style="margin-bottom:12px; display:flex; gap:12px; align-items:center;">
      <input id="tableFilter" placeholder="过滤关键字（指标）" style="min-width:260px" />
      <span style="opacity:.7">当月值多指标合并曲线，支持图例选择和过滤</span>
    </div>
    <div id="overall" style="height:70vh;"></div>
  </div>
  <script src="../vendor/echarts.min.js"></script>
  <script src="chart_tooltip_helpers.js"></script>
<script>

    // 标题复制功能
    document.addEventListener('DOMContentLoaded', function() {
      const copyTitleBtn = document.getElementById('copyTitleBtn');
      const copyTitleOk = document.getElementById('copyTitleOk');
      const h2 = document.querySelector('h2');

      if (copyTitleBtn && h2) {
        copyTitleBtn.addEventListener('click', function() {
          const title = h2.textContent.trim();

          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(title).then(function() {
              showCopySuccess();
            }).catch(function(err) {
              console.error('复制失败:', err);
            });
          } else {
            // 备用方法
            const ta = document.createElement('textarea');
            ta.value = title;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            try {
              document.execCommand('copy');
              showCopySuccess();
            } catch (err) {
              console.error('复制失败:', err);
            }
            document.body.removeChild(ta);
          }
        });
      }

      function showCopySuccess() {
        if (copyTitleOk) {
          copyTitleOk.style.display = 'inline';
          setTimeout(function() {
            copyTitleOk.style.display = 'none';
          }, 1500);
        }
      }
    });
    document.addEventListener('click', function (e) {
      var t = e.target; if (t && t.id === 'copyMetricBtn') {
        try {
          var sel = document.getElementById('metric'); var text = sel && sel.value ? sel.value : '';
          if (!text) { return; }
          if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(function () { var ok = document.getElementById('copyMetricOk'); ok.style.display = 'inline'; setTimeout(function () { ok.style.display = 'none'; }, 1200); }); }
          else { var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); var ok = document.getElementById('copyMetricOk'); ok.style.display = 'inline'; setTimeout(function () { ok.style.display = 'none'; }, 1200); }
        } catch (err) { }
      }
    });
    // ── 收藏管理 ──
    var FAV_KEY = 'energy_favorites';
    var favorites = new Set(JSON.parse(localStorage.getItem(FAV_KEY) || '[]'));
    var showOnlyFavorites = false;
    function saveFavorites() { localStorage.setItem(FAV_KEY, JSON.stringify([...favorites])); }
    function isFavorite(name) { return favorites.has(name); }
    function toggleFavoriteItem(name) { if (favorites.has(name)) { favorites.delete(name); } else { favorites.add(name); } saveFavorites(); }
    const payload = { "data": [] };
    fetch("../cleaned_data/energy_cleaned.json?t=" + Date.now()).then(r => r.json()).then(json => {

      const metricNames = Object.keys(json.metrics || {});
      const prefer = metricNames.find(n => n.includes("发电量")) || metricNames[0];
      const select = document.getElementById("metric");
      metricNames.forEach(n => { const opt = document.createElement("option"); opt.value = n; opt.textContent = n; if (n === prefer) opt.selected = true; select.appendChild(opt); });
  const el = document.getElementById("app");
  const chart = echarts.init(el, null, { renderer: "canvas" });
      function renderSingle(name) {
        const rows = (json.metrics && json.metrics[name]) || [];
        // 1) 过滤掉独立的1月/2月，仅保留1-2月合并
        const filtered = rows.filter(d => {
          const m = d.yearMonth;
          if (!m) return false;
          if (m.endsWith('-1-2')) return true; // 合并1-2
          const parts = m.split('-');
          if (parts.length === 2) {
            const mm = parseInt(parts[1], 10);
            if (mm <= 2) return false; // 去掉独立1、2月
          }
          return true;
        });
        // 2) 排序：每年1-2在最前，其余按月份
        const sorted = filtered.slice().sort((a, b) => {
          const ay = parseInt(a.yearMonth.split('-')[0]);
          const by = parseInt(b.yearMonth.split('-')[0]);
          if (ay !== by) return ay - by;
          if (a.yearMonth.endsWith('-1-2') && !b.yearMonth.endsWith('-1-2')) return -1;
          if (!a.yearMonth.endsWith('-1-2') && b.yearMonth.endsWith('-1-2')) return 1;
          const ap = a.yearMonth.split('-');
          const bp = b.yearMonth.split('-');
          if (ap.length === 2 && bp.length === 2) {
            return parseInt(ap[1], 10) - parseInt(bp[1], 10);
          }
          return a.yearMonth.localeCompare(b.yearMonth);
        });
        // 3) 组装X轴与系列数据
        const x = sorted.map(d => {
          if (d.yearMonth.endsWith('-1-2')) return d.yearMonth.split('-')[0] + '年1-2月';
          const parts = d.yearMonth.split('-');
          return parts[0] + '年' + parseInt(parts[1], 10) + '月';
        });
        // 格式化数据
        sorted.forEach(d => {
          // 格式化同比数据
          if (d.yoy != null && !isNaN(d.yoy)) {
            d.yoy = Number(parseFloat(d.yoy).toFixed(2));
          }
          // 格式化环比数据
          if (d.mom != null && !isNaN(d.mom)) {
            d.mom = Number(parseFloat(d.mom).toFixed(2));
          }
          // 格式化绝对值
          if (d.value != null && !isNaN(d.value)) {
            d.value = parseFloat(d.value);
          }
        });

        // 4) 提取数据序列
        const abs = sorted.map(d => d.value);
        const mom = sorted.map(d => d.mom);
        const yoy = sorted.map(d => d.yoy);
  const option = {
    backgroundColor: "#0b0f19",
    tooltip: buildConfinedTooltip({ trigger: "axis", valueFormatter: v => v == null ? "-" : v }),
          legend: { data: [name + "-当月值", name + "-环比%", name + "-同比%"], textStyle: { color: "#cbd5e1" } },
    grid: { left: 60, right: 60, top: 40, bottom: 40 },
    xAxis: { type: "category", data: x, axisLabel: { color: "#9aa4b2" } },
    yAxis: [
      { type: "value", name: "当月值", position: "left", axisLabel: { color: "#9aa4b2" }, splitLine: { lineStyle: { color: "#1f2937" } } },
      { type: "value", name: "%", position: "right", axisLabel: { color: "#9aa4b2" }, splitLine: { show: false } }
    ],
    series: [
            { name: name + "-当月值", type: "line", yAxisIndex: 0, data: abs, smooth: true, connectNulls: true, lineStyle: { width: 3, color: '#3b82f6' }, symbol: "circle", symbolSize: 6, itemStyle: { color: '#3b82f6' } },
            { name: name + "-环比%", type: "line", yAxisIndex: 1, data: mom, smooth: true, connectNulls: true, lineStyle: { width: 2.5, type: 'dashed', color: '#f59e0b' }, symbol: "triangle", symbolSize: 6, itemStyle: { color: '#f59e0b' } },
            { name: name + "-同比%", type: "line", yAxisIndex: 1, data: yoy, smooth: true, connectNulls: true, lineStyle: { width: 2.5, type: 'solid', color: '#ec4899' }, symbol: "diamond", symbolSize: 6, itemStyle: { color: '#ec4899' } }
          ]
        };
        chart.setOption(option, true);
      }
      function renderPowerGen() {
        const container = document.getElementById('powerGenChart');

        // 获取发电量相关指标
        const powerGenMetrics = ['发电量-火电', '发电量-水电', '发电量-核电', '发电量-风电', '发电量-太阳能发电'];

        // 收集所有时间点
        const keySet = new Set();
        powerGenMetrics.forEach(function(metricName) {
          const records = json.metrics[metricName] || [];
          records.forEach(function(record) {
            if (record.yoy != null) {
              keySet.add(record.yearMonth);
            }
          });
        });

        // 自定义排序，确保1-2月排在年初
        const keys = Array.from(keySet).sort((a, b) => {
          const aYear = parseInt(a.split('-')[0]);
          const bYear = parseInt(b.split('-')[0]);
          if (aYear !== bYear) return aYear - bYear;

          // 同一年内，1-2月排在最前面
          if (a.endsWith('-1-2') && !b.endsWith('-1-2')) return -1;
          if (!a.endsWith('-1-2') && b.endsWith('-1-2')) return 1;

          // 其他情况按月份排序
          const aMonth = parseInt(a.split('-')[1]);
          const bMonth = parseInt(b.split('-')[1]);
          return aMonth - bMonth;
        });

        // 为每个指标创建数据序列
        const series = powerGenMetrics.map(function(metricName, index) {
          const records = json.metrics[metricName] || [];
          const dataMap = {};

          records.forEach(function(record) {
            if (record.yoy != null) {
              dataMap[record.yearMonth] = record.yoy;
            }
          });

          const colors = ['#ef4444', '#3b82f6', '#f59e0b', '#8b5cf6', '#ec4899']; // 橙色替代绿色
          const displayName = metricName.replace('发电量-', '');

          return {
            name: displayName,
            type: 'line',
            smooth: true,
            symbol: 'circle',
            symbolSize: 6,
            lineStyle: {
              width: 3,
              color: colors[index % colors.length]
            },
            itemStyle: {
              color: colors[index % colors.length]
            },
            data: keys.map(function(key) {
              return dataMap[key] != null ? dataMap[key] : null;
            })
          };
        });

        const chart = echarts.init(container);
        const option = {
          backgroundColor: '#0b0f19',
          title: {
            text: '发电量各子项目同比增速趋势',
            left: 'center',
            textStyle: {
              color: '#e2e8f0',
              fontSize: 18,
              fontWeight: 'bold'
            }
          },
          tooltip: buildConfinedTooltip({
            trigger: 'axis',
            axisPointer: { type: 'line', lineStyle: { color: '#64748b', type: 'dashed' } },
            backgroundColor: 'rgba(15, 23, 42, 0.95)',
            borderColor: '#1f2937',
            textStyle: { color: '#e2e8f0', fontSize: 12 },
            formatter: function(params) {
              let s = params[0].name + '<br/>';
              params.forEach(function(p) {
                s += (p.marker || '') + p.seriesName + ': ' + (p.value != null ? p.value + '%' : '-') + '<br/>';
              });
              return s;
            }
          }),
          legend: {
            type: 'scroll',
            top: 40,
            left: 'center',
            textStyle: { color: '#cbd5e1', fontSize: 12 },
            pageButtonItemGap: 5,
            pageIconColor: '#cbd5e1',
            pageIconInactiveColor: '#64748b',
            pageTextStyle: { color: '#cbd5e1' }
          },
          grid: {
            left: 60,
            right: 40,
            top: 80,
            bottom: 80
          },
          xAxis: {
            type: 'category',
            data: keys.map(function(key) {
              // 将YYYY-1-2格式转换为友好显示
              if (key.endsWith('-1-2')) {
                return key.split('-')[0] + '年1-2月';
              }
              // 将YYYY-MM格式转换为友好显示
              const parts = key.split('-');
              return parts[0] + '年' + parseInt(parts[1]) + '月';
            }),
            axisLabel: {
              color: '#9aa4b2',
              fontSize: 11,
              rotate: 45
            },
            axisLine: {
              lineStyle: { color: '#334155' }
            }
          },
          yAxis: {
            type: 'value',
            name: '同比增速 (%)',
            nameTextStyle: {
              color: '#9aa4b2',
              fontSize: 12
            },
            axisLabel: {
              color: '#9aa4b2',
              fontSize: 11,
              formatter: '{value}%'
            },
            splitLine: {
              lineStyle: { color: '#1f2937' }
            },
            axisLine: {
              lineStyle: { color: '#334155' }
            }
          },
          series: series,
          dataZoom: [
            {
              type: 'slider',
              show: true,
              xAxisIndex: [0],
              start: 0,
              end: 100,
              bottom: 20,
              height: 20,
              handleIcon: 'M10.7,11.9v-1.3H9.3v1.3c-4.9,0.3-8.8,4.4-8.8,9.4c0,5,3.9,9.1,8.8,9.4v1.3h1.3v-1.3c4.9-0.3,8.8-4.4,8.8-9.4C19.5,16.3,15.6,12.2,10.7,11.9z M13.3,24.4H6.7V23.1h6.6V24.4z M13.3,19.6H6.7v-1.4h6.6V19.6z',
              handleSize: '80%',
              handleStyle: { color: '#cbd5e1' },
              textStyle: { color: '#9aa4b2', fontSize: 10 }
            },
            {
              type: 'inside',
              xAxisIndex: [0]
            }
          ]
        };

        chart.setOption(option, true);
      }
      function renderGrid() {
        const grid = document.getElementById('grid');
        const filter = document.getElementById('filter');
        const metricCount = document.getElementById('metricCount');
        const keyword = (filter.value || '').trim();
        grid.innerHTML = '';

        // 定义指标分类
        const productionMetrics = ['发电量', '原煤', '原油', '原油加工', '天然气'];
        const importMetrics = ['原煤-进口', '原油-进口', '天然气-进口'];
        const allNames = Object.keys(json.metrics || {});

        let names = [];
        if (!keyword) {
          // 没有关键字时，显示生产指标和进口指标
          names = allNames.filter(n => {
            if (showOnlyFavorites && !favorites.has(n)) return false;
            const isProduction = productionMetrics.includes(n);
            const isImport = importMetrics.includes(n);
            const isNotPowerSubtype = !n.startsWith('发电量-');
            return (isProduction || isImport) && isNotPowerSubtype;
          });
        } else {
          // 有关键字时，在所有指标中搜索（除了发电子项目）
          names = allNames.filter(n => {
            if (showOnlyFavorites && !favorites.has(n)) return false;
            const isNotPowerSubtype = !n.startsWith('发电量-');
            const matchesKeyword = n.includes(keyword);
            return isNotPowerSubtype && matchesKeyword;
          });
        }
        /* 收藏优先，其次按名称排序 */
        names.sort(function(a, b) {
          var af = favorites.has(a) ? 0 : 1;
          var bf = favorites.has(b) ? 0 : 1;
          if (af !== bf) return af - bf;
          return a.localeCompare(b);
        });
        metricCount.textContent = names.length + ' 个指标' + (showOnlyFavorites ? '（仅收藏）' : '');
        names.forEach(function (name) {
          const card = document.createElement('div'); card.style.background = '#0f172a'; card.style.border = '1px solid ' + (favorites.has(name) ? '#f43f5e' : '#1f2937'); card.style.borderRadius = '12px'; card.style.padding = '12px'; card.style.transition = 'all 0.3s ease'; card.style.boxShadow = favorites.has(name) ? '0 2px 8px rgba(244,63,94,.25)' : '0 2px 8px rgba(0,0,0,0.3)'; card.style.position = 'relative'; card.dataset.favorited = favorites.has(name) ? '1' : '';
          const titleWrapper = document.createElement('div'); titleWrapper.style.display = 'flex'; titleWrapper.style.justifyContent = 'space-between'; titleWrapper.style.alignItems = 'center'; titleWrapper.style.margin = '0 0 8px 0';
          const title = document.createElement('div'); title.textContent = name; title.style.fontSize = '14px'; title.style.opacity = '0.95'; title.style.fontWeight = 'bold'; title.style.color = '#e2e8f0'; title.style.flex = '1'; title.style.textAlign = 'center';
          const copyBtn = document.createElement('button'); copyBtn.innerHTML = '📋'; copyBtn.style.background = 'none'; copyBtn.style.border = 'none'; copyBtn.style.color = '#9aa4b2'; copyBtn.style.fontSize = '14px'; copyBtn.style.cursor = 'pointer'; copyBtn.style.padding = '4px'; copyBtn.style.borderRadius = '4px'; copyBtn.style.transition = 'all 0.2s'; copyBtn.title = '复制名称';

          backgroundColor: '#0b0f19',
          grid: { left: 80, right: 80, top: 60, bottom: 60 },
          xAxis: { type: 'category', data: ['1-2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'], axisLabel: { color: '#9aa4b2', fontSize: 14 } },
          yAxis: [
            { type: 'value', position: 'left', axisLabel: { color: '#9aa4b2', fontSize: 14 }, splitLine: { lineStyle: { color: '#1f2937' } } },
            { type: 'value', position: 'right', axisLabel: { color: '#9aa4b2', fontSize: 14, formatter: '{value}%' }, splitLine: { show: false } }
          ],
          series: [],
          legend: { show: true, top: 10, textStyle: { color: '#cbd5e1', fontSize: 14 } },
          tooltip: buildConfinedTooltip({
            trigger: 'axis',
            axisPointer: { type: 'line', lineStyle: { color: '#64748b', type: 'dashed' } },
            backgroundColor: 'rgba(15, 23, 42, 0.95)',
            borderColor: '#1f2937',
            textStyle: { color: '#e2e8f0', fontSize: 14 },
            formatter: function (ps) {
              let s = ps[0].name + '<br/>';
              ps.forEach(function (p) {
                if (p.seriesName.includes('同比') || p.seriesName.includes('环比')) {
                  s += (p.marker || '') + p.seriesName + ': ' + (p.value != null ? p.value + '%' : '-') + '<br/>';
                } else {
                  const unit = name.includes('发电量') ? '亿千瓦时' :
                             name.includes('原煤') ? '亿吨' :
                             name.includes('原油') ? '万吨' :
                             name.includes('天然气') ? '亿立方米' : '';
                  s += (p.marker || '') + p.seriesName + ': ' + (p.value != null ? p.value + unit : '-') + '<br/>';
                }
              });
              return s;
            }
          }),
          dataZoom: [
            { type: 'slider', show: true, xAxisIndex: [0], start: 0, end: 100 },
            { type: 'inside', xAxisIndex: [0] }
          ]
        };

        const colors = ['#ef4444', '#3b82f6', '#f59e0b', '#8b5cf6', '#06b6d4']; // 历史年；最新年单独绿色
        const zoomYearKeys = Object.keys(yearData).sort();
        const zoomLatestYear = zoomYearKeys[zoomYearKeys.length - 1];
        zoomYearKeys.forEach(function (y, idx) {
          const data = new Array(11).fill(null);
          const yoyDataArray = new Array(11).fill(null);
          const momDataArray = new Array(11).fill(null);

          // 填充数据
          (yearData[y] || []).forEach(function (it) {
            const monthStr = it.month;
            if (!monthStr) return;

            // 格式化数据
            const value = it.value !== null ? parseFloat(it.value) : null;
            const yoy = it.yoy != null && !isNaN(it.yoy) ? Number(parseFloat(it.yoy).toFixed(2)) : null;
            const mom = it.mom != null && !isNaN(it.mom) ? Number(parseFloat(it.mom).toFixed(2)) : null;

            if (monthStr.endsWith('-1-2')) {
              data[0] = value;
              yoyDataArray[0] = yoy;
              momDataArray[0] = mom;
            } else {
              const parts = monthStr.split('-');
              if (parts.length === 2) {
                const m = parseInt(parts[1], 10);
                if (m <= 2) return; // 忽略单独的1、2月
                if (m >= 3 && m <= 12) {
                  const idx = m - 2;
                  data[idx] = value;
                  yoyDataArray[idx] = yoy;
                  momDataArray[idx] = mom;
                }
              }
            }
          });

          // 5. 添加曲线
          // 绝对值曲线（最新年翠绿，与总表一致）
          var zoomValueColor = (y === zoomLatestYear) ? '#10b981' : colors[idx % colors.length];
          option.series.push({
            type: 'line',
            name: y + '年',
            yAxisIndex: 0,
            emphasis: { focus: 'series', lineStyle: { width: 3 }, itemStyle: { borderColor: '#fff', borderWidth: 1 } }, blur: { lineStyle: { opacity: 0.12 }, itemStyle: { opacity: 0.12 } }, data: data,
            smooth: true,
            symbol: 'circle',
            symbolSize: 8,
            lineStyle: { color: zoomValueColor, width: 3.5 },
            itemStyle: { color: zoomValueColor }
          });

          // 同比曲线（品红，与年份线区分）
          if (yoyDataArray.some(v => v != null)) {
            option.series.push({
              type: 'line',
              name: y + '年同比',
              yAxisIndex: 1,
              emphasis: { focus: 'series', lineStyle: { width: 3 }, itemStyle: { borderColor: '#fff', borderWidth: 1 } }, blur: { lineStyle: { opacity: 0.12 }, itemStyle: { opacity: 0.12 } }, data: yoyDataArray,
              smooth: true,
              symbol: 'diamond',
              symbolSize: 6,
              lineStyle: { color: '#e879f9', width: 2.5, type: 'solid' },
              itemStyle: { color: '#e879f9' }
            });
          }

          // 环比曲线（橙色）
          if (momDataArray.some(v => v != null)) {
            option.series.push({
              type: 'line',
              name: y + '年环比',
              yAxisIndex: 1,
              emphasis: { focus: 'series', lineStyle: { width: 3 }, itemStyle: { borderColor: '#fff', borderWidth: 1 } }, blur: { lineStyle: { opacity: 0.12 }, itemStyle: { opacity: 0.12 } }, data: momDataArray,
              smooth: true,
              symbol: 'triangle',
              symbolSize: 6,
              lineStyle: { color: '#f59e0b', width: 2.5, type: 'dashed' },
              itemStyle: { color: '#f59e0b' }
            });
          }
        });

          currentZoomChart.setOption(option);

          // 创建新的resize监听器
          zoomResizeHandler = function() {
            if (modal.style.display !== 'none' && currentZoomChart) {
              currentZoomChart.resize();
            }
          };
          window.addEventListener('resize', zoomResizeHandler);
        }, 100);
      }

      // 关闭放大模态框
      function closeZoomModal() {
        const modal = document.getElementById('zoomModal');
        modal.style.display = 'none';

        // 销毁图表实例和事件监听器
        if (currentZoomChart) {
          currentZoomChart.dispose();
          currentZoomChart = null;
        }
        if (zoomResizeHandler) {
          window.removeEventListener('resize', zoomResizeHandler);
          zoomResizeHandler = null;
        }
      }

      renderSingle(prefer);
      select.addEventListener("change", function () { renderSingle(this.value); });
      document.getElementById('tabSingle').addEventListener('click', function () { switchTab('single'); });
      document.getElementById('tabPowerGen').addEventListener('click', function () { switchTab('powergen'); });
      document.getElementById('tabDashboard').addEventListener('click', function () { switchTab('dash'); });
      document.getElementById('tabTable').addEventListener('click', function () { switchTab('table'); });

      // 环比同比按钮事件监听器
      document.getElementById('toggleMom').addEventListener('click', function () {
        showMomCurve = !showMomCurve;
        updateButtonStyles();
        renderGrid();
      });
      document.getElementById('toggleYoy').addEventListener('click', function () {
        showYoyCurve = !showYoyCurve;
        updateButtonStyles();
        renderGrid();
      });
      document.getElementById('toggleHistorical').addEventListener('click', function () {
        showHistoricalYears = !showHistoricalYears;
        updateButtonStyles();
        renderGrid();
      });

      // 更新增速参考线按钮样式
      function updateGrowthLinesButtonStyle() {
        const btn = document.getElementById('toggleGrowthLines');
        if (btn) {
          btn.style.background = showGrowthLines ? '#3b82f6' : '#0f172a';
          btn.style.color = showGrowthLines ? '#ffffff' : '#e5e7eb';
          btn.textContent = showGrowthLines ? '开启' : '关闭';
        }
      }

      // 增速参考线按钮事件监听器
      const toggleGrowthLinesBtn = document.getElementById('toggleGrowthLines');
      if (toggleGrowthLinesBtn) {
        toggleGrowthLinesBtn.addEventListener('click', function () {
          showGrowthLines = !showGrowthLines;
          localStorage.setItem('energy_growth_lines', JSON.stringify(showGrowthLines));
          updateGrowthLinesButtonStyle();
          renderGrid();
        });
        updateGrowthLinesButtonStyle();
      }

      /* ── 仅收藏开关 ── */
      document.getElementById('toggleFavOnly').addEventListener('click', function () {
        showOnlyFavorites = !showOnlyFavorites;
        updateFavOnlyBtn();
        renderGrid();
      });
      updateFavOnlyBtn();

      // 模态框关闭事件
      document.getElementById('zoomModal').addEventListener('click', function () {
        closeZoomModal();
      });
      document.getElementById('closeZoom').addEventListener('click', function () {
        closeZoomModal();
      });
});
</script>

  <!-- 放大模态框 -->
  <div id="zoomModal"
    style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; cursor:pointer;">
    <div
      style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:90%; height:80%; max-width:1200px; background:#0b0f19; border-radius:12px; padding:20px; cursor:default;"
      onclick="event.stopPropagation();">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h3 id="zoomTitle" style="color:#e2e8f0; margin:0; font-size:18px;"></h3>
        <button id="closeZoom"
          style="background:none; border:none; color:#9aa4b2; font-size:24px; cursor:pointer; padding:4px 8px;">×</button>
      </div>
      <div id="zoomChart" style="width:100%; height:calc(100% - 60px);"></div>
    </div>
  </div>
</body>

</html>
