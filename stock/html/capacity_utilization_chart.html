<!doctype html>
<html lang="zh">

<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>全国规模以上工业产能利用率 - 季度趋势</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial;
      margin: 0;
      padding: 16px;
      background: #0b0f19;
      color: #dbe0ea;
    }

    #app {
      height: 80vh;
    }

    .legend-note {
      opacity: .7;
      font-size: 12px;
    }

    .title-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .copy-title-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #9aa4b2;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .copy-title-btn:hover {
      background: #334155;
      color: #e2e8f0;
      border-color: #3b82f6;
    }
    .copy-title-btn:active {
      transform: scale(0.95);
    }
    .copy-ok {
      font-size: 12px;
      opacity: 0.7;
      color: #10b981;
      display: none;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 0.7; }
    }
  </style>
</head>

<body>
<div class="title-wrapper">
  <h2 style="margin:0;">全国规模以上工业产能利用率 - 季度趋势</h2>
  <button id="copyTitleBtn" class="copy-title-btn" title="复制标题">
    📋 复制
  </button>
  <span id="copyTitleOk" class="copy-ok">✓ 已复制</span>
</div>
<div class="legend-note">展示各行业产能利用率（左轴，单位%），以及同比变化（右轴，单位百分点）。</div>
  <div style="margin:16px 0; display:flex; gap:4px; align-items:center; flex-wrap:wrap;">
    <div style="display:flex; background:#1e293b; border-radius:10px; padding:4px; gap:2px;">
      <button id="tabSingle" style="background:#3b82f6;color:#ffffff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:all 0.2s ease;min-width:80px;">单指标</button>
      <button id="tabDashboard" style="background:transparent;color:#94a3b8;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:all 0.2s ease;min-width:80px;">总表</button>
      <button id="tabTable" style="background:transparent;color:#94a3b8;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:all 0.2s ease;min-width:80px;">趋势图</button>
    </div>
    <span style="opacity:.6; font-size:12px; margin-left:12px; color:#64748b;">单指标支持切换行业；总表为所有行业小图；趋势图为多行业合并曲线</span>
  </div>
  <div id="singleWrap">
    <div style="margin:12px 0; display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
      <label for="industry" style="opacity:.8">行业</label>
      <select id="industry" style="background:#0f172a;color:#e5e7eb;border:1px solid #334155;padding:6px 8px;border-radius:6px;min-width:200px;"></select>
      <button id="copyIndustryBtn" style="background:#0f172a;color:#e5e7eb;border:1px solid #334155;padding:6px 8px;border-radius:6px;cursor:pointer;">复制选中行业</button>
      <span id="copyIndustryOk" style="font-size:12px;opacity:.7;display:none;">已复制</span>
    </div>
<div id="app"></div>
  </div>
  <div id="dashboardWrap" style="display:none">
    <div style="margin:12px 0; display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
      <input id="filter" placeholder="过滤关键字（行业）" style="min-width:260px;background:#0f172a;color:#e5e7eb;border:1px solid #334155;padding:6px 8px;border-radius:6px;" />
      <span id="metricCount" style="opacity:.7"></span>
      <div style="margin-left:auto; display:flex; gap:8px; align-items:center;">
        <span style="opacity:.7; font-size:12px;">显示曲线：</span>
        <button id="toggleYoy" style="background:#3b82f6;color:#ffffff;border:1px solid #334155;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:12px;">同比</button>
        <span style="opacity:.7; font-size:12px; margin-left:12px;">历史年份：</span>
        <button id="toggleHistorical" style="background:#3b82f6;color:#ffffff;border:1px solid #334155;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:12px;">显示</button>
      </div>
    </div>
    <div id="grid"
      style="padding:0 16px 24px 16px; display:grid; grid-template-columns:repeat(3,1fr); gap:16px; width:100%; box-sizing:border-box;">
    </div>
  </div>
  <div id="tableWrap" style="display:none;">
    <div style="margin-bottom:12px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
      <input id="tableFilter" placeholder="过滤关键字（行业）" style="min-width:200px;background:#0f172a;color:#e5e7eb;border:1px solid #334155;padding:6px 8px;border-radius:6px;" />
      <span style="opacity:.7">所有行业产能利用率对比，支持图例选择和过滤</span>
    </div>
    <div id="overall" style="height:70vh;"></div>
  </div>
  <script src="../vendor/echarts.min.js"></script>
<script>

    // 标题复制功能
    document.addEventListener('DOMContentLoaded', function() {
      const copyTitleBtn = document.getElementById('copyTitleBtn');
      const copyTitleOk = document.getElementById('copyTitleOk');
      const h2 = document.querySelector('h2');
      
      if (copyTitleBtn && h2) {
        copyTitleBtn.addEventListener('click', function() {
          const title = h2.textContent.trim();
          
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(title).then(function() {
              showCopySuccess();
            }).catch(function(err) {
              console.error('复制失败:', err);
            });
          } else {
            // 备用方法
            const ta = document.createElement('textarea');
            ta.value = title;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            try {
              document.execCommand('copy');
              showCopySuccess();
            } catch (err) {
              console.error('复制失败:', err);
            }
            document.body.removeChild(ta);
          }
        });
      }
      
      function showCopySuccess() {
        if (copyTitleOk) {
          copyTitleOk.style.display = 'inline';
          setTimeout(function() {
            copyTitleOk.style.display = 'none';
          }, 1500);
        }
      }
    });
    document.addEventListener('click', function (e) {
      var t = e.target; 
      if (t && t.id === 'copyIndustryBtn') {
        try {
          var sel = document.getElementById('industry'); 
          var text = sel && sel.value ? sel.value : '';
          if (!text) { return; }
          if (navigator.clipboard && navigator.clipboard.writeText) { 
            navigator.clipboard.writeText(text).then(function () { 
              var ok = document.getElementById('copyIndustryOk'); 
              ok.style.display = 'inline'; 
              setTimeout(function () { ok.style.display = 'none'; }, 1200); 
            }); 
          } else { 
            var ta = document.createElement('textarea'); 
            ta.value = text; 
            document.body.appendChild(ta); 
            ta.select(); 
            document.execCommand('copy'); 
            document.body.removeChild(ta); 
            var ok = document.getElementById('copyIndustryOk'); 
            ok.style.display = 'inline'; 
            setTimeout(function () { ok.style.display = 'none'; }, 1200); 
          }
        } catch (err) { }
      }
    });

    fetch("../cleaned_data/capacity_utilization_cleaned.json?t=" + Date.now()).then(r => r.json()).then(json => {
      
      // 提取行业列表（排除累计数据）
      const industries = new Set();
      Object.keys(json.metrics || {}).forEach(key => {
        if (!key.includes('-累计')) {
          industries.add(key);
        }
      });
      
      const industryList = Array.from(industries).sort();
      console.log('可用行业:', industryList);
      
      // 初始化行业选择器
      const industrySelect = document.getElementById("industry");
      if (industrySelect) {
        industrySelect.innerHTML = '';
        industryList.forEach(industry => {
          const opt = document.createElement("option");
          opt.value = industry;
          opt.textContent = industry;
          if (industry === '工业') opt.selected = true;
          industrySelect.appendChild(opt);
        });
      }
      
      const el = document.getElementById("app");
      const chart = echarts.init(el, null, { renderer: "canvas" });
      
      function renderSingle() {
        const industry = industrySelect.value;
        const rows = (json.metrics && json.metrics[industry]) || [];
        
        // 按时间排序
        const sorted = rows.slice().sort((a, b) => a.yearMonth.localeCompare(b.yearMonth));
        
        const x = sorted.map(d => d.yearMonth);
        const values = sorted.map(d => d.value);
        const yoy = sorted.map(d => d.yoy);
        
        const option = {
          backgroundColor: "#0b0f19",
          tooltip: { 
            trigger: "axis",
            valueFormatter: v => v == null ? "-" : (typeof v === 'number' ? v.toFixed(2) : v)
          },
          legend: { 
            data: [industry + "-产能利用率", industry + "-同比变化"], 
            textStyle: { color: "#cbd5e1" } 
          },
          grid: { left: 60, right: 60, top: 40, bottom: 40 },
          xAxis: { 
            type: "category", 
            data: x, 
            axisLabel: { color: "#9aa4b2" } 
          },
          yAxis: [
            { 
              type: "value", 
              name: "产能利用率（%）", 
              position: "left", 
              axisLabel: { color: "#9aa4b2" }, 
              splitLine: { lineStyle: { color: "#1f2937" } } 
            },
            { 
              type: "value", 
              name: "同比变化（百分点）", 
              position: "right", 
              axisLabel: { color: "#9aa4b2" }, 
              splitLine: { show: false } 
            }
          ],
          series: [
            { 
              name: industry + "-产能利用率", 
              type: "line", 
              yAxisIndex: 0, 
              data: values, 
              smooth: true, 
              lineStyle: { width: 3, color: '#3b82f6' }, 
              symbol: "circle", 
              symbolSize: 6, 
              itemStyle: { color: '#3b82f6' } 
            },
            { 
              name: industry + "-同比变化", 
              type: "line", 
              yAxisIndex: 1, 
              data: yoy, 
              smooth: true, 
              lineStyle: { width: 2.5, type: 'solid', color: '#ec4899' }, 
              symbol: "diamond", 
              symbolSize: 6, 
              itemStyle: { color: '#ec4899' } 
            }
          ]
        };
        chart.setOption(option, true);
      }

      function renderGrid() {
        const grid = document.getElementById('grid');
        const filter = document.getElementById('filter');
        const metricCount = document.getElementById('metricCount');
        const keyword = (filter.value || '').trim().toLowerCase();
        grid.innerHTML = '';
        
        // 过滤行业（排除累计数据）
        let filteredIndustries = industryList;
        if (keyword) {
          filteredIndustries = industryList.filter(ind => ind.toLowerCase().includes(keyword));
        }
        
        metricCount.textContent = filteredIndustries.length + ' 个行业';
        
        filteredIndustries.forEach(function (industry) {
          const card = document.createElement('div');
          card.style.background = '#0f172a';
          card.style.border = '1px solid #1f2937';
          card.style.borderRadius = '12px';
          card.style.padding = '12px';
          card.style.transition = 'all 0.3s ease';
          card.style.boxShadow = '0 2px 8px rgba(0,0,0,0.3)';
          card.style.position = 'relative';
          
          const titleWrapper = document.createElement('div');
          titleWrapper.style.display = 'flex';
          titleWrapper.style.justifyContent = 'space-between';
          titleWrapper.style.alignItems = 'center';
          titleWrapper.style.margin = '0 0 8px 0';
          
          const title = document.createElement('div');
          title.textContent = industry;
          title.style.fontSize = '14px';
          title.style.opacity = '0.95';
          title.style.fontWeight = 'bold';
          title.style.color = '#e2e8f0';
          title.style.flex = '1';
          title.style.textAlign = 'center';
          
          const copyBtn = document.createElement('button');
          copyBtn.innerHTML = '📋';
          copyBtn.style.background = 'none';
          copyBtn.style.border = 'none';
          copyBtn.style.color = '#9aa4b2';
          copyBtn.style.fontSize = '14px';
          copyBtn.style.cursor = 'pointer';
          copyBtn.style.padding = '4px';
          copyBtn.style.borderRadius = '4px';
          copyBtn.style.transition = 'all 0.2s';
          copyBtn.title = '复制行业名称';
          
          copyBtn.onmouseenter = function () {
            copyBtn.style.background = '#1f2937';
            copyBtn.style.color = '#10b981';
          };
          copyBtn.onmouseleave = function () {
            copyBtn.style.background = 'none';
            copyBtn.style.color = '#9aa4b2';
          };
          copyBtn.onclick = function (e) {
            e.stopPropagation();
            const text = industry;
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(text).then(function () {
                copyBtn.innerHTML = '✓';
                copyBtn.style.color = '#10b981';
                setTimeout(function () {
                  copyBtn.innerHTML = '📋';
                  copyBtn.style.color = '#9aa4b2';
                }, 1000);
              });
            } else {
              const ta = document.createElement('textarea');
              ta.value = text;
              ta.style.position = 'fixed';
              ta.style.left = '-9999px';
              document.body.appendChild(ta);
              ta.select();
              try {
                document.execCommand('copy');
                copyBtn.innerHTML = '✓';
                copyBtn.style.color = '#10b981';
                setTimeout(function () {
                  copyBtn.innerHTML = '📋';
                  copyBtn.style.color = '#9aa4b2';
                }, 1000);
              } catch (err) {}
              document.body.removeChild(ta);
            }
          };
          
          const zoomBtn = document.createElement('button');
          zoomBtn.innerHTML = '🔍';
          zoomBtn.style.background = 'none';
          zoomBtn.style.border = 'none';
          zoomBtn.style.color = '#9aa4b2';
          zoomBtn.style.fontSize = '16px';
          zoomBtn.style.cursor = 'pointer';
          zoomBtn.style.padding = '4px';
          zoomBtn.style.borderRadius = '4px';
          zoomBtn.style.transition = 'all 0.2s';
          zoomBtn.title = '放大查看';
          
          zoomBtn.onmouseenter = function () {
            zoomBtn.style.background = '#1f2937';
            zoomBtn.style.color = '#3b82f6';
          };
          zoomBtn.onmouseleave = function () {
            zoomBtn.style.background = 'none';
            zoomBtn.style.color = '#9aa4b2';
          };
          
          titleWrapper.appendChild(title);
          titleWrapper.appendChild(copyBtn);
          titleWrapper.appendChild(zoomBtn);
          
          const div = document.createElement('div');
          div.style.height = '200px';
          
          card.appendChild(titleWrapper);
          card.appendChild(div);
          grid.appendChild(card);
          
          const rows = (json.metrics && json.metrics[industry]) || [];
          const yearData = {};
          const yoyData = {};
          
          rows.forEach(function (d) {
            const y = d.yearMonth ? d.yearMonth.split('-')[0] : '';
            const v = d.value;
            if (y && v != null) {
              (yearData[y] || (yearData[y] = [])).push({ quarter: d.yearMonth, value: v });
            }
            
            const yoy = d.yoy;
            if (y && yoy != null) {
              (yoyData[y] || (yoyData[y] = [])).push({ quarter: d.yearMonth, yoy: yoy });
            }
          });
          
          const c = echarts.init(div);
          const option = {
            backgroundColor: '#0f172a',
            grid: { left: 50, right: 50, top: 35, bottom: 35 },
            xAxis: {
              type: 'category',
              data: ['Q1', 'Q2', 'Q3', 'Q4'],
              axisLabel: { color: '#9aa4b2', fontSize: 11 }
            },
            yAxis: [
              {
                type: 'value',
                position: 'left',
                axisLabel: { color: '#9aa4b2', fontSize: 11 },
                splitLine: { lineStyle: { color: '#1f2937' } }
              },
              {
                type: 'value',
                position: 'right',
                axisLabel: { color: '#9aa4b2', fontSize: 11, formatter: '{value}pp' },
                splitLine: { show: false }
              }
            ],
            series: [],
            legend: { show: true, top: 0, textStyle: { color: '#cbd5e1', fontSize: 11 } },
            tooltip: {
              trigger: 'axis',
              backgroundColor: 'rgba(15, 23, 42, 0.95)',
              borderColor: '#1f2937',
              textStyle: { color: '#e2e8f0' },
              formatter: function (ps) {
                let s = ps[0].name + '<br/>';
                ps.forEach(function (p) {
                  if (p.seriesName.includes('同比')) {
                    s += p.seriesName + ': ' + (p.value != null ? p.value.toFixed(2) + 'pp' : '-') + '<br/>';
                  } else {
                    s += p.seriesName + ': ' + (p.value != null ? p.value.toFixed(2) + '%' : '-') + '<br/>';
                  }
                });
                return s;
              }
            }
          };
          
          // 使用更有区分度的颜色：红、橙、绿、紫、粉、青绿、深橙
          const colors = ['#ef4444', '#f59e0b', '#10b981', '#8b5cf6', '#ec4899', '#14b8a6', '#f97316'];
          const years = Object.keys(yearData).sort();
          const latestYear = years[years.length - 1];
          
          years.forEach(function (y, idx) {
            const isLatestYear = (y === latestYear);
            const isHistoricalYear = !isLatestYear;
            
            if (isHistoricalYear && !showHistoricalYears) {
              return;
            }
            
            const data = new Array(4).fill(null);
            const yoyDataArray = new Array(4).fill(null);
            
            (yearData[y] || []).forEach(function (it) {
              const quarter = it.quarter;
              let idx = -1;
              if (quarter.includes('Q1')) { idx = 0; }
              else if (quarter.includes('Q2')) { idx = 1; }
              else if (quarter.includes('Q3')) { idx = 2; }
              else if (quarter.includes('Q4')) { idx = 3; }
              
              if (idx >= 0) { data[idx] = it.value; }
            });
            
            (yoyData[y] || []).forEach(function (it) {
              const quarter = it.quarter;
              let idx = -1;
              if (quarter.includes('Q1')) { idx = 0; }
              else if (quarter.includes('Q2')) { idx = 1; }
              else if (quarter.includes('Q3')) { idx = 2; }
              else if (quarter.includes('Q4')) { idx = 3; }
              
              if (idx >= 0) { yoyDataArray[idx] = it.yoy; }
            });
            
            option.series.push({
              type: 'line',
              name: y + '年',
              yAxisIndex: 0,
              data: data,
              smooth: true,
              symbol: 'circle',
              symbolSize: 4,
              lineStyle: { color: colors[idx % colors.length], width: 2 },
              itemStyle: { color: colors[idx % colors.length] }
            });
            
            if (isLatestYear && showYoyCurve) {
              option.series.push({
                type: 'line',
                name: y + '年同比',
                yAxisIndex: 1,
                data: yoyDataArray,
                smooth: true,
                symbol: 'diamond',
                symbolSize: 3,
                lineStyle: { color: '#4ade80', width: 2, type: 'solid' },
                itemStyle: { color: '#4ade80' }
              });
            }
          });
          
          c.setOption(option);
          
          zoomBtn.onclick = function (e) {
            e.stopPropagation();
            showZoomChart(industry, rows, yearData, yoyData);
          };
          
          card.onmouseenter = function () {
            card.style.borderColor = '#3b82f6';
            card.style.transform = 'translateY(-4px)';
            card.style.boxShadow = '0 8px 24px rgba(59, 130, 246, 0.15)';
          };
          card.onmouseleave = function () {
            card.style.borderColor = '#1f2937';
            card.style.transform = 'translateY(0)';
            card.style.boxShadow = '0 2px 8px rgba(0,0,0,0.3)';
          };
        });
      }

      function renderTable() {
        const container = document.getElementById('overall');
        const filterInput = document.getElementById('tableFilter');
        const keyword = (filterInput.value || '').trim();
        
        let filteredIndustries = industryList;
        if (keyword) {
          filteredIndustries = industryList.filter(ind => ind.includes(keyword));
        }
        
        const keySet = new Set();
        filteredIndustries.forEach(function (industry) {
          (json.metrics[industry] || []).forEach(function (d) {
            keySet.add(d.yearMonth);
          });
        });
        
        const keys = Array.from(keySet).sort();
        
        const series = filteredIndustries.map(function (industry) {
          const arr = json.metrics[industry] || [];
          const map = {};
          arr.forEach(function (d) {
            map[d.yearMonth] = d.value;
          });
          
          return {
            name: industry,
            type: 'line',
            yAxisIndex: 0,
            smooth: true,
            symbol: 'circle',
            symbolSize: 4,
            lineStyle: { width: 2 },
            data: keys.map(function (k) { return (map[k] == null ? null : map[k]); })
          };
        });
        
        const chart2 = echarts.init(container);
        const option = {
          backgroundColor: '#0b0f19',
          tooltip: {
            trigger: 'axis',
            backgroundColor: 'rgba(15, 23, 42, 0.95)',
            borderColor: '#1f2937',
            textStyle: { color: '#e2e8f0', fontSize: 12 },
            formatter: function (params) {
              let s = params[0].name + '<br/>';
              params.forEach(function (p) {
                s += p.seriesName + ': ' + (p.value != null ? p.value.toFixed(2) + '%' : '-') + '<br/>';
              });
              return s;
            }
          },
          legend: {
            type: 'scroll',
            top: 0,
            left: 'center',
            textStyle: { color: '#cbd5e1', fontSize: 11 },
            pageButtonItemGap: 5,
            pageIconColor: '#cbd5e1',
            pageIconInactiveColor: '#64748b',
            pageTextStyle: { color: '#cbd5e1' },
            selector: [
              { type: 'all', title: '全选' },
              { type: 'inverse', title: '反选' }
            ],
            selectorLabel: { color: '#cbd5e1', fontSize: 11 },
            selectorItemGap: 7,
            selectorButtonGap: 10
          },
          grid: { left: 70, right: 20, top: 60, bottom: 40 },
          xAxis: {
            type: 'category',
            data: keys,
            axisLabel: { color: '#9aa4b2', fontSize: 11 }
          },
          yAxis: [{
            type: 'value',
            name: '产能利用率（%）',
            axisLabel: { color: '#9aa4b2', fontSize: 11 },
            splitLine: { lineStyle: { color: '#1f2937' } },
            nameTextStyle: { color: '#9aa4b2', fontSize: 11 }
          }],
          series: series,
          dataZoom: [
            {
              type: 'slider',
              show: true,
              xAxisIndex: [0],
              start: 0,
              end: 100,
              bottom: 10,
              height: 20,
              handleIcon: 'M10.7,11.9v-1.3H9.3v1.3c-4.9,0.3-8.8,4.4-8.8,9.4c0,5,3.9,9.1,8.8,9.4v1.3h1.3v-1.3c4.9-0.3,8.8-4.4,8.8-9.4C19.5,16.3,15.6,12.2,10.7,11.9z M13.3,24.4H6.7V23.1h6.6V24.4z M13.3,19.6H6.7v-1.4h6.6V19.6z',
              handleSize: '80%',
              handleStyle: { color: '#cbd5e1' },
              textStyle: { color: '#9aa4b2', fontSize: 10 }
            },
            {
              type: 'inside',
              xAxisIndex: [0]
            }
          ]
        };
        
        chart2.setOption(option, true);
      }

      function switchTab(mode) {
        const singleWrap = document.getElementById('singleWrap');
        const dashWrap = document.getElementById('dashboardWrap');
        const tableWrap = document.getElementById('tableWrap');
        const btnSingle = document.getElementById('tabSingle');
        const btnDash = document.getElementById('tabDashboard');
        const btnTable = document.getElementById('tabTable');
        const filter = document.getElementById('filter');
        const metricCount = document.getElementById('metricCount');
        
        singleWrap.style.display = (mode === 'single') ? 'block' : 'none';
        dashWrap.style.display = (mode === 'dash') ? 'block' : 'none';
        tableWrap.style.display = (mode === 'table') ? 'block' : 'none';
        
        btnSingle.style.background = (mode === 'single') ? '#3b82f6' : 'transparent';
        btnSingle.style.color = (mode === 'single') ? '#ffffff' : '#94a3b8';
        btnDash.style.background = (mode === 'dash') ? '#3b82f6' : 'transparent';
        btnDash.style.color = (mode === 'dash') ? '#ffffff' : '#94a3b8';
        btnTable.style.background = (mode === 'table') ? '#3b82f6' : 'transparent';
        btnTable.style.color = (mode === 'table') ? '#ffffff' : '#94a3b8';
        
        [btnSingle, btnDash, btnTable].forEach(btn => {
          btn.onmouseenter = function() {
            if (this.style.background === 'transparent') {
              this.style.background = '#334155';
              this.style.color = '#e2e8f0';
            }
          };
          btn.onmouseleave = function() {
            const isActive = (this === btnSingle && mode === 'single') ||
                           (this === btnDash && mode === 'dash') ||
                           (this === btnTable && mode === 'table');
            if (!isActive) {
              this.style.background = 'transparent';
              this.style.color = '#94a3b8';
            }
          };
        });
        
        if (mode === 'dash') {
          renderGrid();
          updateButtonStyles();
          filter && filter.addEventListener('input', renderGrid);
        } else {
          filter && filter.removeEventListener('input', renderGrid);
          metricCount && (metricCount.textContent = '');
        }
        
        if (mode === 'single') { renderSingle(); }
        if (mode === 'table') { renderTable(); }
      }
      
      var currentZoomChart = null;
      var zoomResizeHandler = null;
      var showYoyCurve = true;
      var showHistoricalYears = true;
      
      function updateButtonStyles() {
        const yoyBtn = document.getElementById('toggleYoy');
        const historicalBtn = document.getElementById('toggleHistorical');
        
        yoyBtn.style.background = showYoyCurve ? '#3b82f6' : '#0f172a';
        yoyBtn.style.color = showYoyCurve ? '#ffffff' : '#e5e7eb';
        
        historicalBtn.style.background = showHistoricalYears ? '#3b82f6' : '#0f172a';
        historicalBtn.style.color = showHistoricalYears ? '#ffffff' : '#e5e7eb';
      }
      
      function showZoomChart(industry, rows, yearData, yoyData) {
        const modal = document.getElementById('zoomModal');
        const title = document.getElementById('zoomTitle');
        const chartDiv = document.getElementById('zoomChart');

        if (currentZoomChart) {
          currentZoomChart.dispose();
          currentZoomChart = null;
        }

        if (zoomResizeHandler) {
          window.removeEventListener('resize', zoomResizeHandler);
          zoomResizeHandler = null;
        }

        title.textContent = industry + ' - 产能利用率详细视图';
        modal.style.display = 'block';

        setTimeout(function() {
          chartDiv.innerHTML = '';
          currentZoomChart = echarts.init(chartDiv);

          const option = {
            backgroundColor: '#0b0f19',
            grid: { left: 80, right: 80, top: 60, bottom: 60 },
            xAxis: {
              type: 'category',
              data: ['Q1', 'Q2', 'Q3', 'Q4'],
              axisLabel: { color: '#9aa4b2', fontSize: 14 }
            },
            yAxis: [
              {
                type: 'value',
                position: 'left',
                axisLabel: { color: '#9aa4b2', fontSize: 14 },
                splitLine: { lineStyle: { color: '#1f2937' } }
              },
              {
                type: 'value',
                position: 'right',
                axisLabel: { color: '#9aa4b2', fontSize: 14, formatter: '{value}pp' },
                splitLine: { show: false }
              }
            ],
            series: [],
            legend: { show: true, top: 10, textStyle: { color: '#cbd5e1', fontSize: 14 } },
            tooltip: {
              trigger: 'axis',
              backgroundColor: 'rgba(15, 23, 42, 0.95)',
              borderColor: '#1f2937',
              textStyle: { color: '#e2e8f0', fontSize: 14 },
              formatter: function (ps) {
                let s = ps[0].name + '<br/>';
                ps.forEach(function (p) {
                  if (p.seriesName.includes('同比')) {
                    s += p.seriesName + ': ' + (p.value != null ? p.value.toFixed(2) + 'pp' : '-') + '<br/>';
                  } else {
                    s += p.seriesName + ': ' + (p.value != null ? p.value.toFixed(2) + '%' : '-') + '<br/>';
                  }
                });
                return s;
              }
            },
            dataZoom: [
              { type: 'slider', show: true, xAxisIndex: [0], start: 0, end: 100 },
              { type: 'inside', xAxisIndex: [0] }
            ]
          };

          // 使用更有区分度的颜色：红、橙、绿、紫、粉、青绿、深橙
          const colors = ['#ef4444', '#f59e0b', '#10b981', '#8b5cf6', '#ec4899', '#14b8a6', '#f97316'];
          Object.keys(yearData).sort().forEach(function (y, idx) {
            const data = new Array(4).fill(null);
            const yoyDataArray = new Array(4).fill(null);
            
            (yearData[y] || []).forEach(function (it) {
              const quarter = it.quarter;
              let idx = -1;
              if (quarter.includes('Q1')) { idx = 0; }
              else if (quarter.includes('Q2')) { idx = 1; }
              else if (quarter.includes('Q3')) { idx = 2; }
              else if (quarter.includes('Q4')) { idx = 3; }
              
              if (idx >= 0) { data[idx] = it.value; }
            });
            
            (yoyData[y] || []).forEach(function (it) {
              const quarter = it.quarter;
              let idx = -1;
              if (quarter.includes('Q1')) { idx = 0; }
              else if (quarter.includes('Q2')) { idx = 1; }
              else if (quarter.includes('Q3')) { idx = 2; }
              else if (quarter.includes('Q4')) { idx = 3; }
              
              if (idx >= 0) { yoyDataArray[idx] = it.yoy; }
            });
            
            option.series.push({
              type: 'line',
              name: y + '年',
              yAxisIndex: 0,
              data: data,
              smooth: true,
              symbol: 'circle',
              symbolSize: 8,
              lineStyle: { color: colors[idx % colors.length], width: 3.5 },
              itemStyle: { color: colors[idx % colors.length] }
            });
            
            option.series.push({
              type: 'line',
              name: y + '年同比',
              yAxisIndex: 1,
              data: yoyDataArray,
              smooth: true,
              symbol: 'diamond',
              symbolSize: 6,
              lineStyle: { color: '#4ade80', width: 2.5, type: 'solid' },
              itemStyle: { color: '#4ade80' }
            });
          });

          currentZoomChart.setOption(option);

          zoomResizeHandler = function() {
            if (modal.style.display !== 'none' && currentZoomChart) {
              currentZoomChart.resize();
            }
          };
          window.addEventListener('resize', zoomResizeHandler);
        }, 100);
      }
      
      function closeZoomModal() {
        const modal = document.getElementById('zoomModal');
        modal.style.display = 'none';
        
        if (currentZoomChart) {
          currentZoomChart.dispose();
          currentZoomChart = null;
        }
        if (zoomResizeHandler) {
          window.removeEventListener('resize', zoomResizeHandler);
          zoomResizeHandler = null;
        }
      }

      renderSingle();
      industrySelect.addEventListener("change", function () { renderSingle(); });
      
      document.getElementById('tableFilter').addEventListener('input', function () { renderTable(); });
      document.getElementById('tabSingle').addEventListener('click', function () { switchTab('single'); });
      document.getElementById('tabDashboard').addEventListener('click', function () { switchTab('dash'); });
      document.getElementById('tabTable').addEventListener('click', function () { switchTab('table'); });
      
      document.getElementById('toggleYoy').addEventListener('click', function () {
        showYoyCurve = !showYoyCurve;
        updateButtonStyles();
        renderGrid();
      });
      document.getElementById('toggleHistorical').addEventListener('click', function () {
        showHistoricalYears = !showHistoricalYears;
        updateButtonStyles();
        renderGrid();
      });

      document.getElementById('zoomModal').addEventListener('click', function () {
        closeZoomModal();
      });
      document.getElementById('closeZoom').addEventListener('click', function () {
        closeZoomModal();
      });
    });
</script>

  <!-- 放大模态框 -->
  <div id="zoomModal"
    style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; cursor:pointer;">
    <div
      style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:90%; height:80%; max-width:1200px; background:#0b0f19; border-radius:12px; padding:20px; cursor:default;"
      onclick="event.stopPropagation();">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h3 id="zoomTitle" style="color:#e2e8f0; margin:0; font-size:18px;"></h3>
        <button id="closeZoom"
          style="background:none; border:none; color:#9aa4b2; font-size:24px; cursor:pointer; padding:4px 8px;">×</button>
      </div>
      <div id="zoomChart" style="width:100%; height:calc(100% - 60px);"></div>
    </div>
  </div>
</body>
