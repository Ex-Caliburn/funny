<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>铝价 — 趋势看板</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #0b0f19;
      color: #dbe0ea;
      padding: 16px 20px;
    }
    .top-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; flex-wrap: wrap; }
    h2 { font-size: 18px; font-weight: 600; color: #e8edff; }
    .subtitle { font-size: 11px; color: #475569; margin-left: auto; }
    .tab-bar {
      display: inline-flex; background: #1e293b;
      border-radius: 10px; padding: 4px; gap: 2px;
      margin-bottom: 14px;
    }
    .tab-btn {
      padding: 6px 22px; border: none; border-radius: 7px;
      background: transparent; color: #94a3b8;
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: all 0.18s; white-space: nowrap;
    }
    .tab-btn.active { background: #3b82f6; color: #fff; box-shadow: 0 2px 8px rgba(59,130,246,0.4); }
    .tab-btn:hover:not(.active) { background: #334155; color: #e2e8f0; }
    /* 一级：产品（铝锭 / 氧化铝） */
    .product-bar .tab-btn { padding: 8px 28px; font-size: 14px; }
    /* 二级：地区 */
    .sub-tab-bar {
      display: none;
      flex-wrap: wrap;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 4px;
      gap: 4px;
      margin-bottom: 14px;
    }
    .sub-tab-bar.visible { display: inline-flex; }
    .sub-tab-bar .tab-btn { padding: 5px 14px; font-size: 12px; font-weight: 600; }
    .sub-tab-bar .tab-btn.active { background: #334155; color: #f1f5f9; box-shadow: none; }
    /* 全区对比按钮特殊高亮 */
    .sub-tab-bar .tab-btn[data-key$="-compare"].active { background: #1e3a5f; color: #93c5fd; }
    .panel { display: none; }
    .panel.active { display: block; }
    /* 统计卡片 */
    .stat-bar { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .stat-card {
      background: #0f172a; border: 1px solid #1f2937;
      border-radius: 10px; padding: 10px 18px; min-width: 120px;
    }
    .stat-label { font-size: 11px; color: #64748b; margin-bottom: 2px; }
    .stat-sub { font-size: 10px; color: #334155; margin-bottom: 2px; }
    .stat-val { font-size: 22px; font-weight: 700; color: #e2e8f0; line-height: 1.2; }
    .stat-val.sm { font-size: 15px; }
    .stat-val.up { color: #ef4444; }
    .stat-val.dn { color: #22c55e; }
    /* 图表 */
    .chart-wrap { height: 66vh; }
    .loading { display: flex; align-items: center; justify-content: center; height: 66vh; color: #334155; font-size: 14px; }
  </style>
</head>
<body>
  <div class="top-bar">
    <h2>铝价 — 趋势看板</h2>
    <span class="subtitle">日度数据 · 数据来源：中国铝业（Chalco）· 单位：元/吨</span>
  </div>

  <!-- 一级：产品 -->
  <div class="tab-bar product-bar" id="product-bar" role="tablist" aria-label="产品">
    <button type="button" class="tab-btn active" data-product="ingot">铝锭</button>
    <button type="button" class="tab-btn" data-product="alumina">氧化铝</button>
  </div>

  <!-- 二级：铝锭地区 -->
  <div class="sub-tab-bar visible" id="sub-bar-ingot" role="tablist" aria-label="铝锭地区">
    <button type="button" class="tab-btn sub-tab-btn active" data-key="ingot-east">华东</button>
    <button type="button" class="tab-btn sub-tab-btn" data-key="ingot-south">华南</button>
    <button type="button" class="tab-btn sub-tab-btn" data-key="ingot-southwest">西南</button>
    <button type="button" class="tab-btn sub-tab-btn" data-key="ingot-central">中原</button>
    <button type="button" class="tab-btn sub-tab-btn" data-key="ingot-compare">全区对比</button>
  </div>

  <!-- 二级：氧化铝地区 -->
  <div class="sub-tab-bar" id="sub-bar-alumina" role="tablist" aria-label="氧化铝地区">
    <button type="button" class="tab-btn sub-tab-btn" data-key="alumina-shandong">山东</button>
    <button type="button" class="tab-btn sub-tab-btn" data-key="alumina-henan">河南</button>
    <button type="button" class="tab-btn sub-tab-btn" data-key="alumina-shanxi">山西</button>
    <button type="button" class="tab-btn sub-tab-btn" data-key="alumina-guizhou">贵州</button>
    <button type="button" class="tab-btn sub-tab-btn" data-key="alumina-guangxi">广西</button>
    <button type="button" class="tab-btn sub-tab-btn" data-key="alumina-compare">全区对比</button>
  </div>

  <!-- ── 铝锭面板 ── -->
  <div id="panel-ingot-east" class="panel active">
    <div class="stat-bar" id="stats-ingot-east"></div>
    <div id="chart-ingot-east" class="chart-wrap"></div>
  </div>
  <div id="panel-ingot-south" class="panel">
    <div class="stat-bar" id="stats-ingot-south"></div>
    <div id="chart-ingot-south" class="chart-wrap"></div>
  </div>
  <div id="panel-ingot-southwest" class="panel">
    <div class="stat-bar" id="stats-ingot-southwest"></div>
    <div id="chart-ingot-southwest" class="chart-wrap"></div>
  </div>
  <div id="panel-ingot-central" class="panel">
    <div class="stat-bar" id="stats-ingot-central"></div>
    <div id="chart-ingot-central" class="chart-wrap"></div>
  </div>
  <div id="panel-ingot-compare" class="panel">
    <div class="stat-bar" id="stats-ingot-compare"></div>
    <div id="chart-ingot-compare" class="chart-wrap"></div>
  </div>

  <!-- ── 氧化铝面板 ── -->
  <div id="panel-alumina-shandong" class="panel">
    <div class="stat-bar" id="stats-alumina-shandong"></div>
    <div id="chart-alumina-shandong" class="chart-wrap"></div>
  </div>
  <div id="panel-alumina-henan" class="panel">
    <div class="stat-bar" id="stats-alumina-henan"></div>
    <div id="chart-alumina-henan" class="chart-wrap"></div>
  </div>
  <div id="panel-alumina-shanxi" class="panel">
    <div class="stat-bar" id="stats-alumina-shanxi"></div>
    <div id="chart-alumina-shanxi" class="chart-wrap"></div>
  </div>
  <div id="panel-alumina-guizhou" class="panel">
    <div class="stat-bar" id="stats-alumina-guizhou"></div>
    <div id="chart-alumina-guizhou" class="chart-wrap"></div>
  </div>
  <div id="panel-alumina-guangxi" class="panel">
    <div class="stat-bar" id="stats-alumina-guangxi"></div>
    <div id="chart-alumina-guangxi" class="chart-wrap"></div>
  </div>
  <div id="panel-alumina-compare" class="panel">
    <div class="stat-bar" id="stats-alumina-compare"></div>
    <div id="chart-alumina-compare" class="chart-wrap"></div>
  </div>

  <script src="../vendor/echarts.min.js"></script>
  <script>
  // ── 产品配置 ─────────────────────────────────────────────────
  var PRODUCTS = {
    ingot: {
      label: '铝锭（AL99.70）',
      file: '../aluminum/aluminum_ingot.json',
      defaultKey: 'ingot-east',
      regions: [
        { key: 'east',      name: '华东市场', color: '#38bdf8' },
        { key: 'south',     name: '华南市场', color: '#fb923c' },
        { key: 'southwest', name: '西南市场', color: '#4ade80' },
        { key: 'central',   name: '中原市场', color: '#c084fc' }
      ]
    },
    alumina: {
      label: '氧化铝',
      file: '../aluminum/alumina.json',
      defaultKey: 'alumina-shandong',
      regions: [
        { key: 'shandong', name: '山东地区', color: '#38bdf8' },
        { key: 'henan',    name: '河南地区', color: '#fb923c' },
        { key: 'shanxi',   name: '山西地区', color: '#4ade80' },
        { key: 'guizhou',  name: '贵州地区', color: '#c084fc' },
        { key: 'guangxi',  name: '广西地区', color: '#fbbf24' }
      ]
    }
  };

  var PRODUCT_DEFAULT = { ingot: 'ingot-east', alumina: 'alumina-shandong' };

  // 年份颜色：早年灰 → 2024蓝 → 2025绿 → 2026橙
  var YEAR_COLORS = {
    '2023': '#475569',
    '2024': '#3b82f6',
    '2025': '#10b981',
    '2026': '#f97316'
  };
  var MOM_COLOR = '#f59e0b';
  var YOY_COLOR = '#a78bfa';

  var productDataCache = {};  // { ingot: rawJson, alumina: rawJson }
  var charts = {};
  var loaded = {};

  // ── 从 tab key 解析 productKey / regionKey ──────────────────
  function getProductKey(tabKey) {
    return tabKey.startsWith('alumina') ? 'alumina' : 'ingot';
  }
  function getRegionKey(tabKey) {
    return tabKey.slice(tabKey.indexOf('-') + 1);  // 'east', 'compare', 'shandong' ...
  }

  // ── 日期 → x 轴值（月 + 日内位置），用于年度叠加对比 ─────────
  function dateToX(dateStr) {
    var p = dateStr.split('-');
    return parseFloat((+p[1] + (+p[2] - 1) / 31).toFixed(4));
  }

  // ── 按年分组 ─────────────────────────────────────────────────
  function groupByYear(arr) {
    var map = {};
    arr.forEach(function(item) {
      var y = item.date.slice(0, 4);
      if (!map[y]) map[y] = [];
      map[y].push(item);
    });
    return map;
  }

  // ── 月度聚合（月末最后一条记录）────────────────────────────
  function aggregateMonthly(yearMap) {
    var res = {};
    Object.keys(yearMap).forEach(function(year) {
      res[year] = {};
      yearMap[year].forEach(function(item) {
        var m = +item.date.slice(5, 7);
        res[year][m] = { price: item.price, x: dateToX(item.date) };
      });
    });
    return res;
  }

  // ── 计算月度环比 / 同比 ──────────────────────────────────────
  function calcRates(monthlyMap) {
    var years = Object.keys(monthlyMap).sort();
    var latestYear = years[years.length - 1];
    var prevYear   = years.length >= 2 ? years[years.length - 2] : null;
    var momPts = [], yoyPts = [];

    for (var m = 1; m <= 12; m++) {
      var cur = monthlyMap[latestYear][m];
      if (!cur) continue;
      var prevM = monthlyMap[latestYear][m - 1];
      if (prevM) momPts.push([cur.x, +((cur.price - prevM.price) / prevM.price * 100).toFixed(2)]);
      if (prevYear && monthlyMap[prevYear] && monthlyMap[prevYear][m]) {
        var base = monthlyMap[prevYear][m].price;
        yoyPts.push([cur.x, +((cur.price - base) / base * 100).toFixed(2)]);
      }
    }
    return { momPts: momPts, yoyPts: yoyPts, latestYear: latestYear, prevYear: prevYear };
  }

  // ── 统计卡片 HTML ────────────────────────────────────────────
  function makeCard(label, sub, valStr, numVal, extraStyle) {
    var cls = numVal !== null ? (numVal > 0 ? ' up' : numVal < 0 ? ' dn' : '') : '';
    return '<div class="stat-card"' + (extraStyle ? ' style="' + extraStyle + '"' : '') + '>'
      + '<div class="stat-label">' + label + '</div>'
      + '<div class="stat-sub">' + sub + '</div>'
      + '<div class="stat-val' + cls + '">' + valStr + '</div></div>';
  }

  // ── 渲染单地区统计卡片 ───────────────────────────────────────
  function renderRegionStats(statsId, yearMap) {
    var monthly = aggregateMonthly(yearMap);
    var rates   = calcRates(monthly);
    var ly = rates.latestYear;
    var months = Object.keys(monthly[ly]).map(Number).sort(function(a, b) { return a - b; });
    var lm = months[months.length - 1];
    var latestPrice = monthly[ly][lm].price;

    var momVal = null, momStr = '-';
    if (monthly[ly][lm - 1]) {
      momVal = +((latestPrice - monthly[ly][lm - 1].price) / monthly[ly][lm - 1].price * 100).toFixed(2);
      momStr = (momVal > 0 ? '+' : '') + momVal + '%';
    }

    var yoyVal = null, yoyStr = '-';
    if (rates.prevYear && monthly[rates.prevYear] && monthly[rates.prevYear][lm]) {
      var base = monthly[rates.prevYear][lm].price;
      yoyVal = +((latestPrice - base) / base * 100).toFixed(2);
      yoyStr = (yoyVal > 0 ? '+' : '') + yoyVal + '%';
    }

    document.getElementById(statsId).innerHTML =
      makeCard('最新报价', ly + '年 ' + lm + '月末', latestPrice + ' 元/吨', null) +
      makeCard('环比', '较上月末', momStr, momVal) +
      makeCard('同比', '较去年同期', yoyStr, yoyVal);
  }

  // ── 构建单地区年度叠加对比 ECharts option ────────────────────
  // X 轴：月份位置（不同年份叠加），右轴：最新年环比/同比%
  function buildRegionOption(yearMap) {
    var monthly = aggregateMonthly(yearMap);
    var rates   = calcRates(monthly);
    var years   = Object.keys(yearMap).sort();
    var ly      = rates.latestYear;
    var series  = [];

    years.forEach(function(year, idx) {
      var color = YEAR_COLORS[year] || '#94a3b8';
      var isLatest = (year === ly);
      var data = yearMap[year].map(function(item) {
        return { value: [dateToX(item.date), item.price], date: item.date };
      });
      series.push({
        name: year + '年',
        type: 'line',
        yAxisIndex: 0,
        data: data,
        smooth: false,
        symbol: 'circle',
        symbolSize: isLatest ? 4 : 2,
        lineStyle: { color: color, width: isLatest ? 2.5 : 1.5 },
        itemStyle: { color: color },
        z: isLatest ? 10 : idx + 1
      });
    });

    series.push({
      name: ly + '年环比%',
      type: 'line',
      yAxisIndex: 1,
      data: rates.momPts,
      smooth: true,
      symbol: 'triangle',
      symbolSize: 6,
      lineStyle: { color: MOM_COLOR, width: 2, type: 'dashed' },
      itemStyle: { color: MOM_COLOR }
    });
    series.push({
      name: ly + '年同比%',
      type: 'line',
      yAxisIndex: 1,
      data: rates.yoyPts,
      smooth: true,
      symbol: 'diamond',
      symbolSize: 6,
      lineStyle: { color: YOY_COLOR, width: 2 },
      itemStyle: { color: YOY_COLOR }
    });

    return {
      backgroundColor: '#0b0f19',
      animation: true,
      tooltip: {
        trigger: 'item',
        backgroundColor: 'rgba(15,23,42,0.95)',
        borderColor: '#1f2937',
        textStyle: { color: '#e2e8f0', fontSize: 13 },
        formatter: function(p) {
          var isRate = p.seriesName.indexOf('%') > -1;
          var v = Array.isArray(p.value) ? p.value[1] : p.value;
          if (v == null) return '';
          var dateStr = p.data && p.data.date ? p.data.date : '';
          return '<b>' + p.seriesName + '</b>'
            + (dateStr ? '<br/>' + dateStr : '')
            + '<br/><span style="color:' + p.color + '">●</span> '
            + v + (isRate ? '%' : ' 元/吨');
        }
      },
      legend: {
        top: 4,
        textStyle: { color: '#cbd5e1', fontSize: 12 },
        itemGap: 16
      },
      grid: { left: 72, right: 72, top: 50, bottom: 38 },
      xAxis: {
        type: 'value',
        min: 0.9, max: 13.1, interval: 1,
        axisLabel: {
          color: '#9aa4b2', fontSize: 12,
          formatter: function(val) {
            var m = Math.round(val);
            return (Math.abs(val - m) < 0.05 && m >= 1 && m <= 12) ? m + '月' : '';
          }
        },
        splitLine: { show: true, lineStyle: { color: '#1a2236' } },
        axisTick: { show: false },
        axisLine: { lineStyle: { color: '#334155' } }
      },
      yAxis: [
        {
          type: 'value', name: '元/吨', position: 'left',
          nameTextStyle: { color: '#64748b', fontSize: 11 },
          axisLabel: { color: '#9aa4b2', fontSize: 11 },
          splitLine: { lineStyle: { color: '#1a2236' } }
        },
        {
          type: 'value', name: '%', position: 'right',
          nameTextStyle: { color: '#64748b', fontSize: 11 },
          axisLabel: { color: '#9aa4b2', fontSize: 11, formatter: '{value}%' },
          splitLine: { show: false }
        }
      ],
      dataZoom: [
        { type: 'slider', bottom: 4, height: 18, start: 0, end: 100,
          textStyle: { color: '#9aa4b2', fontSize: 10 },
          handleStyle: { color: '#334155' },
          fillerColor: 'rgba(59,130,246,0.1)',
          borderColor: '#1f2937' },
        { type: 'inside' }
      ],
      series: series
    };
  }

  // ── 渲染全区对比统计卡片 ─────────────────────────────────────
  function renderCompareStats(statsId, rawData, product) {
    // rawData.data 按日期倒序，第一条为最新
    var latest = rawData.data[0];
    if (!latest) return;

    var prices = product.regions
      .map(function(r) { return { name: r.name, price: latest[r.key], color: r.color }; })
      .filter(function(r) { return r.price != null; });

    var maxR = prices.reduce(function(a, b) { return a.price > b.price ? a : b; });
    var minR = prices.reduce(function(a, b) { return a.price < b.price ? a : b; });
    var spread = maxR.price - minR.price;

    var html = makeCard('数据日期', '最新报价', latest.date, null);

    prices.forEach(function(r) {
      html += makeCard(r.name, '现货', r.price + '', null, 'border-color:' + r.color + '44');
    });

    html += makeCard('价差', maxR.name + ' ↑  ' + minR.name + ' ↓', spread + ' 元/吨', null);

    document.getElementById(statsId).innerHTML = html;
  }

  // ── 构建全区对比 ECharts option（时间轴，所有地区同屏）────────
  function buildCompareOption(rawData, product) {
    var series = product.regions.map(function(r) {
      var data = rawData.data
        .filter(function(item) { return item[r.key] != null; })
        .sort(function(a, b) { return a.date.localeCompare(b.date); })
        .map(function(item) { return [item.date, item[r.key]]; });
      return {
        name: r.name,
        type: 'line',
        data: data,
        smooth: false,
        symbol: 'none',
        lineStyle: { color: r.color, width: 2 },
        itemStyle: { color: r.color }
      };
    });

    return {
      backgroundColor: '#0b0f19',
      animation: false,
      tooltip: {
        trigger: 'axis',
        backgroundColor: 'rgba(15,23,42,0.95)',
        borderColor: '#1f2937',
        textStyle: { color: '#e2e8f0', fontSize: 13 },
        axisPointer: { lineStyle: { color: '#334155', type: 'dashed' } },
        formatter: function(params) {
          if (!params || !params.length) return '';
          var date = params[0].value[0];
          var html = '<b>' + date + '</b>';
          params.forEach(function(p) {
            var v = Array.isArray(p.value) ? p.value[1] : p.value;
            if (v != null) {
              html += '<br/><span style="color:' + p.color + '">●</span> '
                + p.seriesName + ': <b>' + v + '</b> 元/吨';
            }
          });
          return html;
        }
      },
      legend: {
        top: 4,
        textStyle: { color: '#cbd5e1', fontSize: 12 },
        itemGap: 16
      },
      grid: { left: 72, right: 24, top: 50, bottom: 38 },
      xAxis: {
        type: 'time',
        axisLabel: { color: '#9aa4b2', fontSize: 11 },
        splitLine: { lineStyle: { color: '#1a2236' } },
        axisLine: { lineStyle: { color: '#334155' } }
      },
      yAxis: {
        type: 'value',
        name: '元/吨',
        nameTextStyle: { color: '#64748b', fontSize: 11 },
        axisLabel: { color: '#9aa4b2', fontSize: 11 },
        splitLine: { lineStyle: { color: '#1a2236' } }
      },
      dataZoom: [
        { type: 'slider', bottom: 4, height: 18, start: 55, end: 100,
          textStyle: { color: '#9aa4b2', fontSize: 10 },
          handleStyle: { color: '#334155' },
          fillerColor: 'rgba(59,130,246,0.1)',
          borderColor: '#1f2937' },
        { type: 'inside' }
      ],
      series: series
    };
  }

  // ── 初始化单个 tab（懒加载）──────────────────────────────────
  function initTab(tabKey) {
    var productKey = getProductKey(tabKey);
    var regionKey  = getRegionKey(tabKey);
    var product    = PRODUCTS[productKey];
    var chartEl    = document.getElementById('chart-' + tabKey);
    var statsId    = 'stats-' + tabKey;

    chartEl.innerHTML = '<div class="loading">数据加载中…</div>';

    function render(rawData) {
      if (regionKey === 'compare') {
        renderCompareStats(statsId, rawData, product);
        chartEl.innerHTML = '';
        var chart = echarts.init(chartEl, null, { renderer: 'canvas' });
        chart.setOption(buildCompareOption(rawData, product));
        charts[tabKey] = chart;
        window.addEventListener('resize', function() { chart.resize(); });
      } else {
        // 提取单一地区数据，升序排列
        var regionData = rawData.data
          .map(function(item) { return { date: item.date, price: item[regionKey] }; })
          .filter(function(item) { return item.price != null; })
          .sort(function(a, b) { return a.date.localeCompare(b.date); });

        var yearMap = groupByYear(regionData);
        renderRegionStats(statsId, yearMap);
        chartEl.innerHTML = '';
        var chart = echarts.init(chartEl, null, { renderer: 'canvas' });
        chart.setOption(buildRegionOption(yearMap));
        charts[tabKey] = chart;
        window.addEventListener('resize', function() { chart.resize(); });
      }
    }

    if (productDataCache[productKey]) {
      render(productDataCache[productKey]);
    } else {
      fetch(product.file + '?t=' + Date.now())
        .then(function(r) { return r.json(); })
        .then(function(raw) {
          productDataCache[productKey] = raw;
          render(raw);
        })
        .catch(function(err) {
          chartEl.innerHTML = '<div class="loading" style="color:#ef4444;">加载失败：' + err.message + '</div>';
        });
    }
  }

  // ── 激活 tab（切换面板 + 懒加载图表）────────────────────────
  function activateTab(tabKey) {
    document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });
    var panel = document.getElementById('panel-' + tabKey);
    if (panel) panel.classList.add('active');

    if (!loaded[tabKey]) {
      loaded[tabKey] = true;
      initTab(tabKey);
    } else if (charts[tabKey]) {
      charts[tabKey].resize();
    }
  }

  // ── 一级：产品切换 ───────────────────────────────────────────
  document.querySelectorAll('#product-bar [data-product]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var product = btn.dataset.product;
      var defaultKey, barActive;
      var barIngot   = document.getElementById('sub-bar-ingot');
      var barAlumina = document.getElementById('sub-bar-alumina');

      document.querySelectorAll('#product-bar [data-product]').forEach(function(b) {
        b.classList.remove('active');
      });
      btn.classList.add('active');

      if (product === 'ingot') {
        barIngot.classList.add('visible');
        barAlumina.classList.remove('visible');
        barActive  = barIngot;
        defaultKey = PRODUCT_DEFAULT.ingot;
      } else {
        barAlumina.classList.add('visible');
        barIngot.classList.remove('visible');
        barActive  = barAlumina;
        defaultKey = PRODUCT_DEFAULT.alumina;
      }

      document.querySelectorAll('.sub-tab-btn').forEach(function(b) { b.classList.remove('active'); });
      var defaultBtn = barActive.querySelector('[data-key="' + defaultKey + '"]');
      if (defaultBtn) defaultBtn.classList.add('active');
      activateTab(defaultKey);
    });
  });

  // ── 二级：地区切换 ───────────────────────────────────────────
  document.querySelectorAll('.sub-tab-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var key = btn.dataset.key;
      var bar = btn.closest('.sub-tab-bar');
      if (!bar) return;
      bar.querySelectorAll('.sub-tab-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      activateTab(key);
    });
  });

  // ── 初始：铝锭华东 ───────────────────────────────────────────
  activateTab('ingot-east');
  </script>
</body>
</html>
