<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>有色金属价格 - SMM 趋势看板</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #0b0f19;
      color: #dbe0ea;
      padding: 16px 20px;
    }
    .top-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; flex-wrap: wrap; }
    h2 { font-size: 18px; font-weight: 600; color: #e8edff; }
    .subtitle { font-size: 11px; color: #475569; margin-left: auto; }
    .tab-bar {
      display: inline-flex; background: #1e293b;
      border-radius: 10px; padding: 4px; gap: 2px;
      margin-bottom: 14px;
    }
    .tab-btn {
      padding: 6px 22px; border: none; border-radius: 7px;
      background: transparent; color: #94a3b8;
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: all 0.18s; white-space: nowrap;
    }
    .tab-btn.active { background: #3b82f6; color: #fff; box-shadow: 0 2px 8px rgba(59,130,246,0.4); }
    .tab-btn:hover:not(.active) { background: #334155; color: #e2e8f0; }
    /* 一级：品种大类 */
    .region-bar { margin-bottom: 8px; }
    .region-bar .tab-btn { padding: 8px 28px; font-size: 14px; }
    /* 二级：具体品种 */
    .sub-tab-bar {
      display: none;
      flex-wrap: wrap;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 4px;
      gap: 4px;
      margin-bottom: 14px;
    }
    .sub-tab-bar.visible { display: inline-flex; }
    .sub-tab-bar .tab-btn {
      padding: 5px 14px;
      font-size: 12px;
      font-weight: 600;
    }
    .sub-tab-bar .tab-btn.active {
      background: #334155;
      color: #f1f5f9;
      box-shadow: none;
    }
    .panel { display: none; }
    .panel.active { display: block; }
    /* 统计栏 */
    .stat-bar { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
    .stat-card {
      background: #0f172a; border: 1px solid #1f2937;
      border-radius: 10px; padding: 10px 18px; min-width: 130px;
    }
    .stat-label { font-size: 11px; color: #64748b; margin-bottom: 3px; }
    .stat-sub { font-size: 10px; color: #334155; }
    .stat-val { font-size: 22px; font-weight: 700; color: #e2e8f0; line-height: 1.2; }
    .stat-val.up { color: #ef4444; }
    .stat-val.dn { color: #22c55e; }
    /* 图表 */
    .chart-wrap { height: 68vh; }
    /* 加载态 */
    .loading { display: flex; align-items: center; justify-content: center; height: 68vh; color: #334155; font-size: 14px; }
  </style>
</head>
<body>
  <div class="top-bar">
    <h2>有色金属价格 — SMM 趋势看板</h2>
    <span class="subtitle">日频数据（月度指标除外）；左轴绝对价格；右轴最新年份月度环比/同比（%）</span>
  </div>

  <!-- 一级 Tab：品种大类 -->
  <div class="tab-bar region-bar" id="cat-bar" role="tablist" aria-label="品种大类">
    <button type="button" class="tab-btn active" data-cat="copper">铜</button>
    <button type="button" class="tab-btn" data-cat="aluminum">铝</button>
    <button type="button" class="tab-btn" data-cat="lead">铅</button>
    <button type="button" class="tab-btn" data-cat="zinc">锌</button>
    <button type="button" class="tab-btn" data-cat="nickel">镍</button>
    <button type="button" class="tab-btn" data-cat="tin">锡</button>
    <button type="button" class="tab-btn" data-cat="others">其他</button>
  </div>

  <!-- 二级 Tab：铜 -->
  <div class="sub-tab-bar visible" id="sub-bar-copper" role="tablist" aria-label="铜品种">
    <button type="button" class="tab-btn sub-tab-btn active" data-key="copper">SMM 1#电解铜</button>
    <button type="button" class="tab-btn sub-tab-btn" data-key="yangshan_premium_warrant">洋山铜溢价·仓单</button>
    <button type="button" class="tab-btn sub-tab-btn" data-key="yangshan_premium_bl">洋山铜溢价·提单</button>
    <button type="button" class="tab-btn sub-tab-btn" data-key="copper_concentrate_index">进口铜精矿指数（月）</button>
    <button type="button" class="tab-btn sub-tab-btn" data-key="copper_rod_fee">鹰潭铜杆加工费（月）</button>
  </div>

  <!-- 二级 Tab：铝 -->
  <div class="sub-tab-bar" id="sub-bar-aluminum" role="tablist" aria-label="铝品种">
    <button type="button" class="tab-btn sub-tab-btn active" data-key="aluminum">SMM A00铝</button>
  </div>

  <!-- 二级 Tab：铅 -->
  <div class="sub-tab-bar" id="sub-bar-lead" role="tablist" aria-label="铅品种">
    <button type="button" class="tab-btn sub-tab-btn active" data-key="lead">SMM 1#铅锭</button>
  </div>

  <!-- 二级 Tab：锌 -->
  <div class="sub-tab-bar" id="sub-bar-zinc" role="tablist" aria-label="锌品种">
    <button type="button" class="tab-btn sub-tab-btn active" data-key="zinc">SMM 0#锌锭</button>
  </div>

  <!-- 二级 Tab：镍 -->
  <div class="sub-tab-bar" id="sub-bar-nickel" role="tablist" aria-label="镍品种">
    <button type="button" class="tab-btn sub-tab-btn active" data-key="nickel">SMM 1#电解镍</button>
    <button type="button" class="tab-btn sub-tab-btn" data-key="nickel_sulfate">电池级硫酸镍指数</button>
  </div>

  <!-- 二级 Tab：锡 -->
  <div class="sub-tab-bar" id="sub-bar-tin" role="tablist" aria-label="锡品种">
    <button type="button" class="tab-btn sub-tab-btn active" data-key="tin">SMM 1#锡</button>
  </div>

  <!-- 二级 Tab：其他 -->
  <div class="sub-tab-bar" id="sub-bar-others" role="tablist" aria-label="其他品种">
    <button type="button" class="tab-btn sub-tab-btn active" data-key="cobalt">电解钴</button>
    <button type="button" class="tab-btn sub-tab-btn" data-key="cobalt_sulfate">硫酸钴</button>
    <button type="button" class="tab-btn sub-tab-btn" data-key="lithium_carbonate">电池级碳酸锂</button>
    <button type="button" class="tab-btn sub-tab-btn" data-key="antimony">2#低铋锑锭</button>
    <button type="button" class="tab-btn sub-tab-btn" data-key="manganese_sulfate">电池级硫酸锰指数</button>
    <button type="button" class="tab-btn sub-tab-btn" data-key="indium">精铟</button>
  </div>

  <!-- 面板：每个品种一个 -->
  <div id="panel-copper"                   class="panel active"><div class="stat-bar" id="stats-copper"></div><div id="chart-copper" class="chart-wrap"></div></div>
  <div id="panel-yangshan_premium_warrant" class="panel"><div class="stat-bar" id="stats-yangshan_premium_warrant"></div><div id="chart-yangshan_premium_warrant" class="chart-wrap"></div></div>
  <div id="panel-yangshan_premium_bl"      class="panel"><div class="stat-bar" id="stats-yangshan_premium_bl"></div><div id="chart-yangshan_premium_bl" class="chart-wrap"></div></div>
  <div id="panel-copper_concentrate_index" class="panel"><div class="stat-bar" id="stats-copper_concentrate_index"></div><div id="chart-copper_concentrate_index" class="chart-wrap"></div></div>
  <div id="panel-copper_rod_fee"           class="panel"><div class="stat-bar" id="stats-copper_rod_fee"></div><div id="chart-copper_rod_fee" class="chart-wrap"></div></div>
  <div id="panel-aluminum"                 class="panel"><div class="stat-bar" id="stats-aluminum"></div><div id="chart-aluminum" class="chart-wrap"></div></div>
  <div id="panel-lead"                     class="panel"><div class="stat-bar" id="stats-lead"></div><div id="chart-lead" class="chart-wrap"></div></div>
  <div id="panel-zinc"                     class="panel"><div class="stat-bar" id="stats-zinc"></div><div id="chart-zinc" class="chart-wrap"></div></div>
  <div id="panel-nickel"                   class="panel"><div class="stat-bar" id="stats-nickel"></div><div id="chart-nickel" class="chart-wrap"></div></div>
  <div id="panel-nickel_sulfate"           class="panel"><div class="stat-bar" id="stats-nickel_sulfate"></div><div id="chart-nickel_sulfate" class="chart-wrap"></div></div>
  <div id="panel-tin"                      class="panel"><div class="stat-bar" id="stats-tin"></div><div id="chart-tin" class="chart-wrap"></div></div>
  <div id="panel-cobalt"                   class="panel"><div class="stat-bar" id="stats-cobalt"></div><div id="chart-cobalt" class="chart-wrap"></div></div>
  <div id="panel-cobalt_sulfate"           class="panel"><div class="stat-bar" id="stats-cobalt_sulfate"></div><div id="chart-cobalt_sulfate" class="chart-wrap"></div></div>
  <div id="panel-lithium_carbonate"        class="panel"><div class="stat-bar" id="stats-lithium_carbonate"></div><div id="chart-lithium_carbonate" class="chart-wrap"></div></div>
  <div id="panel-antimony"                 class="panel"><div class="stat-bar" id="stats-antimony"></div><div id="chart-antimony" class="chart-wrap"></div></div>
  <div id="panel-manganese_sulfate"        class="panel"><div class="stat-bar" id="stats-manganese_sulfate"></div><div id="chart-manganese_sulfate" class="chart-wrap"></div></div>
  <div id="panel-indium"                   class="panel"><div class="stat-bar" id="stats-indium"></div><div id="chart-indium" class="chart-wrap"></div></div>

  <script src="../vendor/echarts.min.js"></script>
  <script>
  // 品种大类 → 二级 Tab 配置
  var CATEGORIES = [
    {
      cat: 'copper', label: '铜',
      defaultKey: 'copper',
      metals: [
        { key: 'copper',                   label: 'SMM 1#电解铜',        field: 'copper',                   unit: '元/吨' },
        { key: 'yangshan_premium_warrant', label: '洋山铜溢价·仓单',     field: 'yangshan_premium_warrant', unit: '美元/吨' },
        { key: 'yangshan_premium_bl',      label: '洋山铜溢价·提单',     field: 'yangshan_premium_bl',      unit: '美元/吨' },
        { key: 'copper_concentrate_index', label: '进口铜精矿指数（月）', field: 'copper_concentrate_index', unit: '美元/干吨' },
        { key: 'copper_rod_fee',           label: '鹰潭铜杆加工费（月）', field: 'copper_rod_fee',           unit: '元/吨' }
      ]
    },
    {
      cat: 'aluminum', label: '铝',
      defaultKey: 'aluminum',
      metals: [
        { key: 'aluminum', label: 'SMM A00铝', field: 'aluminum', unit: '元/吨' }
      ]
    },
    {
      cat: 'lead', label: '铅',
      defaultKey: 'lead',
      metals: [
        { key: 'lead', label: 'SMM 1#铅锭', field: 'lead', unit: '元/吨' }
      ]
    },
    {
      cat: 'zinc', label: '锌',
      defaultKey: 'zinc',
      metals: [
        { key: 'zinc', label: 'SMM 0#锌锭', field: 'zinc', unit: '元/吨' }
      ]
    },
    {
      cat: 'nickel', label: '镍',
      defaultKey: 'nickel',
      metals: [
        { key: 'nickel',        label: 'SMM 1#电解镍',    field: 'nickel',        unit: '元/吨' },
        { key: 'nickel_sulfate', label: '电池级硫酸镍指数', field: 'nickel_sulfate', unit: '元/吨' }
      ]
    },
    {
      cat: 'tin', label: '锡',
      defaultKey: 'tin',
      metals: [
        { key: 'tin', label: 'SMM 1#锡', field: 'tin', unit: '元/吨' }
      ]
    },
    {
      cat: 'others', label: '其他',
      defaultKey: 'cobalt',
      metals: [
        { key: 'cobalt',             label: '电解钴',         field: 'cobalt',             unit: '元/吨' },
        { key: 'cobalt_sulfate',     label: '硫酸钴',         field: 'cobalt_sulfate',     unit: '元/吨' },
        { key: 'lithium_carbonate',  label: '电池级碳酸锂',   field: 'lithium_carbonate',  unit: '元/吨' },
        { key: 'antimony',           label: '2#低铋锑锭',     field: 'antimony',           unit: '元/吨' },
        { key: 'manganese_sulfate',  label: '电池级硫酸锰指数', field: 'manganese_sulfate', unit: '元/吨' },
        { key: 'indium',             label: '精铟',           field: 'indium',             unit: '元/千克' }
      ]
    }
  ];

  // key → 品种配置的反查表
  var KEY_MAP = {};
  CATEGORIES.forEach(function(cat) {
    cat.metals.forEach(function(m) { KEY_MAP[m.key] = m; });
  });

  // 年份颜色：2023 灰、2024 蓝、2025 绿、2026 橙
  var YEAR_COLORS = {
    '2023': '#64748b',
    '2024': '#3b82f6',
    '2025': '#10b981',
    '2026': '#f97316'
  };
  var MOM_COLOR = '#f59e0b';
  var YOY_COLOR = '#e879f9';

  var charts = {};
  var loaded  = {};
  var rawDataCache = null; // 全局缓存一份 JSON

  // ── 日期转 x 轴数值（月 + 当月天数/31，让各年同月对齐）──────────────
  function dateToX(dateStr) {
    var p = dateStr.split('-');
    return parseFloat((+p[1] + (+p[2] - 1) / 31).toFixed(4));
  }

  // ── 按年分组 ──────────────────────────────────────────────────────
  function groupByYear(arr) {
    var map = {};
    arr.forEach(function(item) {
      var y = item.date.slice(0, 4);
      if (!map[y]) map[y] = [];
      map[y].push(item);
    });
    return map;
  }

  // ── 月度聚合：取每月最后一条 ──────────────────────────────────────
  function aggregateMonthly(yearMap) {
    var res = {};
    Object.keys(yearMap).forEach(function(year) {
      res[year] = {};
      yearMap[year].forEach(function(item) {
        var m = +item.date.slice(5, 7);
        res[year][m] = { price: item.price, x: dateToX(item.date) };
      });
    });
    return res;
  }

  // ── 计算环比 / 同比 ───────────────────────────────────────────────
  function calcRates(monthlyMap) {
    var years = Object.keys(monthlyMap).sort();
    var ly    = years[years.length - 1];
    var py    = years.length >= 2 ? years[years.length - 2] : null;
    var momPts = [], yoyPts = [];

    for (var m = 1; m <= 12; m++) {
      var cur = monthlyMap[ly][m];
      if (!cur) continue;
      var x = cur.x;
      var prev = monthlyMap[ly][m - 1];
      if (prev) momPts.push([x, +((cur.price - prev.price) / prev.price * 100).toFixed(2)]);
      if (py && monthlyMap[py] && monthlyMap[py][m]) {
        var base = monthlyMap[py][m].price;
        yoyPts.push([x, +((cur.price - base) / base * 100).toFixed(2)]);
      }
    }
    return { momPts: momPts, yoyPts: yoyPts, latestYear: ly, prevYear: py };
  }

  // ── 顶部统计卡片 ───────────────────────────────────────────────────
  function renderStats(key, yearMap, unit) {
    var monthly = aggregateMonthly(yearMap);
    var rates   = calcRates(monthly);
    var ly = rates.latestYear;
    var py = rates.prevYear;

    var months = Object.keys(monthly[ly]).map(Number).sort(function(a, b) { return a - b; });
    var lm = months[months.length - 1];
    var latestPrice = monthly[ly][lm].price;

    // 最新完整日期（原始数组最后一条）
    var latestDate = yearMap[ly][yearMap[ly].length - 1].date;

    var momVal = null, momStr = '-';
    if (monthly[ly][lm - 1]) {
      momVal = +((latestPrice - monthly[ly][lm - 1].price) / monthly[ly][lm - 1].price * 100).toFixed(2);
      momStr = (momVal > 0 ? '+' : '') + momVal + '%';
    }

    var yoyVal = null, yoyStr = '-';
    if (py && monthly[py] && monthly[py][lm]) {
      var base = monthly[py][lm].price;
      yoyVal = +((latestPrice - base) / base * 100).toFixed(2);
      yoyStr = (yoyVal > 0 ? '+' : '') + yoyVal + '%';
    }

    function card(label, sub, valStr, numVal) {
      var cls = numVal !== null ? (numVal > 0 ? ' up' : numVal < 0 ? ' dn' : '') : '';
      return '<div class="stat-card"><div class="stat-label">' + label + '</div>'
        + '<div class="stat-sub">' + sub + '</div>'
        + '<div class="stat-val' + cls + '">' + valStr + '</div></div>';
    }

    document.getElementById('stats-' + key).innerHTML =
      card('最新报价', latestDate, latestPrice + ' ' + unit, null) +
      card('环比', '较上月', momStr, momVal) +
      card('同比', '较去年同期', yoyStr, yoyVal);
  }

  // ── 构建 ECharts option ───────────────────────────────────────────
  function buildOption(yearMap, unit) {
    var monthly = aggregateMonthly(yearMap);
    var rates   = calcRates(monthly);
    var years   = Object.keys(yearMap).sort();
    var ly      = rates.latestYear;
    var series  = [];

    years.forEach(function(year, idx) {
      var color    = YEAR_COLORS[year] || '#94a3b8';
      var isLatest = year === ly;
      var data = yearMap[year].map(function(item) {
        return { value: [dateToX(item.date), item.price], date: item.date };
      });
      series.push({
        name: year + '年',
        type: 'line',
        yAxisIndex: 0,
        data: data,
        smooth: false,
        symbol: 'circle',
        symbolSize: isLatest ? 5 : 3,
        lineStyle: { color: color, width: isLatest ? 2.5 : 1.5 },
        itemStyle: { color: color },
        z: isLatest ? 10 : idx + 1
      });
    });

    series.push({
      name: ly + '年环比%',
      type: 'line',
      yAxisIndex: 1,
      data: rates.momPts,
      smooth: true,
      symbol: 'triangle',
      symbolSize: 6,
      lineStyle: { color: MOM_COLOR, width: 2, type: 'dashed' },
      itemStyle: { color: MOM_COLOR }
    });

    series.push({
      name: ly + '年同比%',
      type: 'line',
      yAxisIndex: 1,
      data: rates.yoyPts,
      smooth: true,
      symbol: 'diamond',
      symbolSize: 6,
      lineStyle: { color: YOY_COLOR, width: 2 },
      itemStyle: { color: YOY_COLOR }
    });

    return {
      backgroundColor: '#0b0f19',
      animation: true,
      tooltip: {
        trigger: 'item',
        backgroundColor: 'rgba(15,23,42,0.95)',
        borderColor: '#1f2937',
        textStyle: { color: '#e2e8f0', fontSize: 13 },
        formatter: function(p) {
          var isRate = p.seriesName.indexOf('%') > -1;
          if (p.value == null) return '';
          var v = Array.isArray(p.value) ? p.value[1] : p.value;
          if (v == null) return '';
          var dateStr = p.data && p.data.date ? p.data.date : '';
          return '<b>' + p.seriesName + '</b>'
            + (dateStr ? '<br/>' + dateStr : '')
            + '<br/><span style="color:' + p.color + '">●</span> '
            + v + (isRate ? '%' : ' ' + unit);
        }
      },
      legend: {
        top: 4,
        textStyle: { color: '#cbd5e1', fontSize: 12 },
        itemGap: 16
      },
      grid: { left: 72, right: 72, top: 50, bottom: 38 },
      xAxis: {
        type: 'value',
        min: 0.9,
        max: 13.1,
        interval: 1,
        axisLabel: {
          color: '#9aa4b2',
          fontSize: 12,
          formatter: function(val) {
            var m = Math.round(val);
            return (Math.abs(val - m) < 0.05 && m >= 1 && m <= 12) ? m + '月' : '';
          }
        },
        splitLine: { show: true, lineStyle: { color: '#1a2236', type: 'solid' } },
        axisTick: { show: false },
        axisLine: { lineStyle: { color: '#334155' } }
      },
      yAxis: [
        {
          type: 'value',
          name: unit,
          position: 'left',
          nameTextStyle: { color: '#64748b', fontSize: 11 },
          axisLabel: { color: '#9aa4b2', fontSize: 11 },
          splitLine: { lineStyle: { color: '#1a2236' } }
        },
        {
          type: 'value',
          name: '%',
          position: 'right',
          nameTextStyle: { color: '#64748b', fontSize: 11 },
          axisLabel: { color: '#9aa4b2', fontSize: 11, formatter: '{value}%' },
          splitLine: { show: false }
        }
      ],
      dataZoom: [
        { type: 'slider', bottom: 4, height: 18, start: 0, end: 100,
          textStyle: { color: '#9aa4b2', fontSize: 10 },
          handleStyle: { color: '#334155' },
          fillerColor: 'rgba(59,130,246,0.1)',
          borderColor: '#1f2937' },
        { type: 'inside' }
      ],
      series: series
    };
  }

  // ── 加载并缓存 JSON，返回 Promise<rawData> ────────────────────────
  function loadJson() {
    if (rawDataCache) return Promise.resolve(rawDataCache);
    return fetch('../smm/smm_metal_prices.json?t=' + Date.now())
      .then(function(r) { return r.json(); })
      .then(function(json) {
        rawDataCache = json;
        return json;
      });
  }

  // ── 初始化单个 tab 的图表 ─────────────────────────────────────────
  function initTab(key) {
    var cfg = KEY_MAP[key];
    if (!cfg) return;
    var el = document.getElementById('chart-' + key);
    el.innerHTML = '<div class="loading">数据加载中…</div>';

    loadJson()
      .then(function(json) {
        // 从单一 JSON 中提取该品种的 [{date, price}] 序列
        var arr = (json.data || [])
          .filter(function(r) { return r[cfg.field] != null; })
          .map(function(r) { return { date: r.date, price: r[cfg.field] }; })
          .sort(function(a, b) { return a.date.localeCompare(b.date); });

        if (arr.length === 0) {
          el.innerHTML = '<div class="loading" style="color:#64748b;">暂无数据</div>';
          return;
        }

        var yearMap = groupByYear(arr);
        renderStats(key, yearMap, cfg.unit);
        el.innerHTML = '';
        var chart = echarts.init(el, null, { renderer: 'canvas' });
        chart.setOption(buildOption(yearMap, cfg.unit));
        charts[key] = chart;
        window.addEventListener('resize', function() { chart.resize(); });
      })
      .catch(function(err) {
        el.innerHTML = '<div class="loading" style="color:#ef4444;">加载失败：' + err.message + '</div>';
      });
  }

  /** 切换面板并懒加载图表 */
  function activateKey(key) {
    document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });
    var panel = document.getElementById('panel-' + key);
    if (panel) panel.classList.add('active');

    if (!loaded[key]) {
      loaded[key] = true;
      initTab(key);
    } else if (charts[key]) {
      charts[key].resize();
    }
  }

  /** 一级：切换大类 */
  document.querySelectorAll('#cat-bar [data-cat]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var cat = btn.dataset.cat;

      // 更新一级激活状态
      document.querySelectorAll('#cat-bar [data-cat]').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');

      // 切换二级 Tab 可见性
      document.querySelectorAll('.sub-tab-bar').forEach(function(bar) { bar.classList.remove('visible'); });
      var subBar = document.getElementById('sub-bar-' + cat);
      if (subBar) subBar.classList.add('visible');

      // 激活该大类的默认品种
      var catCfg = CATEGORIES.find(function(c) { return c.cat === cat; });
      if (!catCfg) return;
      var defaultKey = catCfg.defaultKey;

      // 更新二级激活状态
      if (subBar) {
        subBar.querySelectorAll('.sub-tab-btn').forEach(function(b) { b.classList.remove('active'); });
        var defBtn = subBar.querySelector('.sub-tab-btn[data-key="' + defaultKey + '"]');
        if (defBtn) defBtn.classList.add('active');
      }

      activateKey(defaultKey);
    });
  });

  /** 二级：切换具体品种 */
  document.querySelectorAll('.sub-tab-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var key = btn.dataset.key;
      var bar = btn.closest('.sub-tab-bar');
      if (!bar) return;
      bar.querySelectorAll('.sub-tab-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      activateKey(key);
    });
  });

  // ── 初始：铜 → SMM 1#电解铜 ────────────────────────────────────────
  activateKey('copper');
  </script>
</body>
</html>
