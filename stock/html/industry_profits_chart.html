<!doctype html>
<html lang="zh">

<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>规模以上工业企业财务指标 - 月度趋势</title>
  <style>

      font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial;

</head>

<body>
<div class="title-wrapper">
  <h2 style="margin:0;">规模以上工业企业财务指标 - 月度趋势</h2>

    📋 复制
  </button>
  <span id="copyTitleOk" class="copy-ok">✓ 已复制</span>
</div>
<div class="legend-note">展示营业收入、营业成本、利润总额的绝对值（左轴），以及同比增速（右轴，单位%）。</div>
  <div style="margin:16px 0; display:flex; gap:4px; align-items:center; flex-wrap:wrap;">
    <div style="display:flex; background:#1e293b; border-radius:10px; padding:4px; gap:2px;">
      <button id="tabSingle" style="background:#3b82f6;color:#ffffff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:all 0.2s ease;min-width:80px;">单指标</button>
      <button id="tabDashboard" style="background:transparent;color:#94a3b8;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:all 0.2s ease;min-width:80px;">总表</button>
      <button id="tabTable" style="background:transparent;color:#94a3b8;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:all 0.2s ease;min-width:80px;">趋势图</button>
    </div>
    <span style="opacity:.6; font-size:12px; margin-left:12px; color:#64748b;">单指标支持切换指标；总表为所有指标当月值小图；趋势图为三指标合并曲线</span>

  <div id="singleWrap">
    <div style="margin:12px 0; display:flex; gap:12px; align-items:center; flex-wrap:wrap;">

<div id="app"></div>

  <div id="dashboardWrap" style="display:none">
    <div style="margin:12px 0; display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
      <label for="dashboardIndustry" style="opacity:.8">行业</label>
      <select id="dashboardIndustry" style="background:#0f172a;color:#e5e7eb;border:1px solid #334155;padding:6px 8px;border-radius:6px;min-width:200px;"></select>
      <input id="filter" placeholder="过滤关键字（行业或指标）" style="min-width:260px" />
      <span id="metricCount" style="opacity:.7"></span>

        <button id="toggleMom" style="background:#0f172a;color:#e5e7eb;border:1px solid #334155;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:12px;">环比</button>
        <button id="toggleYoy" style="background:#0f172a;color:#e5e7eb;border:1px solid #334155;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:12px;">同比</button>

  <div id="tableWrap" style="display:none;">
    <div style="margin-bottom:12px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
      <label for="tableMetric" style="opacity:.8">指标</label>
      <select id="tableMetric" style="background:#0f172a;color:#e5e7eb;border:1px solid #334155;padding:6px 8px;border-radius:6px;min-width:150px;"></select>

    </div>
    <div id="overall" style="height:70vh;"></div>
  </div>
  <script src="../vendor/echarts.min.js"></script>
<script>
    // ==================== 颜色配置 ====================
    // 总表/放大图：历史年份用此板；最新年（如 2026）当月值固定翠绿，与其他看板一致
    const YEAR_COLORS = ['#ef4444', '#f59e0b', '#3b82f6', '#8b5cf6', '#ec4899'];
    const LATEST_YEAR_VALUE_COLOR = '#10b981';

    // 增长率曲线颜色
    const YOY_COLOR = '#e879f9';  // 同比：与年份翠绿区分
    const MOM_COLOR = '#fbbf24';  // 环比：亮黄色

    // 单指标视图颜色
    const SINGLE_VALUE_COLOR = '#06b6d4';  // 青色：当月值（避免与年份蓝冲突）
    const SINGLE_MOM_COLOR = '#f59e0b';    // 橙色：环比
    const SINGLE_YOY_COLOR = '#ec4899';    // 粉色：同比
    // ==================================================

    // 标题复制功能
    document.addEventListener('DOMContentLoaded', function() {
      const copyTitleBtn = document.getElementById('copyTitleBtn');
      const copyTitleOk = document.getElementById('copyTitleOk');
      const h2 = document.querySelector('h2');

      if (copyTitleBtn && h2) {
        copyTitleBtn.addEventListener('click', function() {
          const title = h2.textContent.trim();

          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(title).then(function() {
              showCopySuccess();
            }).catch(function(err) {
              console.error('复制失败:', err);
            });
          } else {
            // 备用方法
            const ta = document.createElement('textarea');
            ta.value = title;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            try {
              document.execCommand('copy');
              showCopySuccess();
            } catch (err) {
              console.error('复制失败:', err);
            }
            document.body.removeChild(ta);
          }
        });
      }

      function showCopySuccess() {
        if (copyTitleOk) {
          copyTitleOk.style.display = 'inline';
          setTimeout(function() {
            copyTitleOk.style.display = 'none';
          }, 1500);
        }
      }
    });
    document.addEventListener('click', function (e) {
      var t = e.target; if (t && t.id === 'copyMetricBtn') {
        try {
          var sel = document.getElementById('metric'); var text = sel && sel.value ? sel.value : '';
          if (!text) { return; }
          if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(function () { var ok = document.getElementById('copyMetricOk'); ok.style.display = 'inline'; setTimeout(function () { ok.style.display = 'none'; }, 1200); }); }
          else { var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); var ok = document.getElementById('copyMetricOk'); ok.style.display = 'inline'; setTimeout(function () { ok.style.display = 'none'; }, 1200); }
        } catch (err) { }
      }
    });
    // ── 收藏管理 ──
    var FAV_KEY = 'industry_profits_favorites';
    var favorites = new Set(JSON.parse(localStorage.getItem(FAV_KEY) || '[]'));
    var showOnlyFavorites = false;
    function saveFavorites() { localStorage.setItem(FAV_KEY, JSON.stringify([...favorites])); }
    function isFavorite(name) { return favorites.has(name); }
    function toggleFavoriteItem(name) { if (favorites.has(name)) { favorites.delete(name); } else { favorites.add(name); } saveFavorites(); }
    const payload = { "data": [] };
    fetch("../cleaned_data/industry_profits_cleaned.json?t=" + Date.now()).then(r => r.json()).then(json => {

      // Extract industries and metrics from the data
      const industries = new Set();
      const metricTypes = ['营业收入', '营业成本', '利润总额'];

      Object.keys(json.metrics || {}).forEach(key => {
        if (key.includes('-')) {
          const industry = key.split('-')[0];
          industries.add(industry);
        }
      });

      const industryList = Array.from(industries).sort();
      console.log('Available industries:', industryList);

      // Initialize industry selectors
      const industrySelect = document.getElementById("industry");
      const dashboardIndustrySelect = document.getElementById("dashboardIndustry");

      // Initialize single view selector
      if (industrySelect) {
        industrySelect.innerHTML = '';
        industryList.forEach(industry => {
          const opt = document.createElement("option");
          opt.value = industry;
          opt.textContent = industry;
          if (industry === '总计') opt.selected = true;
          industrySelect.appendChild(opt);
        });
      }

      // Initialize dashboard view selector (with "全部" option)
      if (dashboardIndustrySelect) {
        dashboardIndustrySelect.innerHTML = '';
        // Add "全部" option first
        const allOpt = document.createElement("option");
        allOpt.value = "全部";
        allOpt.textContent = "全部行业";
        allOpt.selected = true;
        dashboardIndustrySelect.appendChild(allOpt);
        // Add other industries
        industryList.forEach(industry => {
          const opt = document.createElement("option");
          opt.value = industry;
          opt.textContent = industry;
          dashboardIndustrySelect.appendChild(opt);
        });
      }

      // Initialize table metric selector
      const tableMetricSelect = document.getElementById("tableMetric");
      tableMetricSelect.innerHTML = '';
      metricTypes.forEach(metric => {
        const opt = document.createElement("option");
        opt.value = metric;
        opt.textContent = metric;
        if (metric === '营业收入') opt.selected = true;
        tableMetricSelect.appendChild(opt);
      });

      // Initialize metric selector
      const metricSelect = document.getElementById("metric");
      metricSelect.innerHTML = '';
      metricTypes.forEach(metric => {
        const opt = document.createElement("option");
        opt.value = metric;
        opt.textContent = metric;
        if (metric === '营业收入') opt.selected = true;
        metricSelect.appendChild(opt);
      });
  const el = document.getElementById("app");
  const chart = echarts.init(el, null, { renderer: "canvas" });

      // 计算当月数据的函数
      function calculateMonthlyData(cumulativeData) {
        if (!cumulativeData || cumulativeData.length === 0) return [];

        const monthlyData = [];
        const sortedData = [...cumulativeData].sort((a, b) => a.yearMonth.localeCompare(b.yearMonth));

        for (let i = 0; i < sortedData.length; i++) {
          const current = sortedData[i];
          const currentYear = current.yearMonth.slice(0, 4);

          if (current.yearMonth.endsWith('-01-02')) {
            // 1-2月的数据就是当月数据
            monthlyData.push({
              ...current,
              value: current.value
            });
          } else if (current.yearMonth.endsWith('-12')) {
            // 年度数据，查找11月数据来计算12月当月值
            const nov = sortedData.find(d => d.yearMonth === currentYear + '-11');
            if (nov && current.value !== null && nov.value !== null) {
              monthlyData.push({
                ...current,
                value: parseFloat((current.value - nov.value).toFixed(2))
              });
            } else {
              monthlyData.push({
                ...current,
                value: current.value
              });
            }
          } else {
            // 其他月份，用当月累积值减去上月累积值
            const currentMonth = parseInt(current.yearMonth.slice(5, 7), 10);
            let prevMonth = currentMonth - 1;
            let prevMonthKey;

            if (prevMonth === 2) {
              prevMonthKey = currentYear + '-01-02'; // 2月的上一个是1-2月
            } else if (prevMonth >= 3) {
              prevMonthKey = currentYear + '-' + String(prevMonth).padStart(2, '0');
            } else {
              prevMonthKey = null;
            }

            const prev = prevMonthKey ? sortedData.find(d => d.yearMonth === prevMonthKey) : null;

            if (prev && current.value !== null && prev.value !== null) {
              monthlyData.push({
                ...current,
                value: parseFloat((current.value - prev.value).toFixed(2))
              });
            } else {
              monthlyData.push({
                ...current,
                value: current.value
              });
            }
          }
        }

        // 计算当月同比
        return calculateMonthlyYoY(monthlyData);
      }

      function calculateMonthlyYoY(monthlyData) {
        const result = [];

        for (let i = 0; i < monthlyData.length; i++) {
          const current = monthlyData[i];
          const currentYear = parseInt(current.yearMonth.slice(0, 4));
          const prevYear = currentYear - 1;
          const prevYearKey = current.yearMonth.replace(String(currentYear), String(prevYear));

          // 查找去年同期的当月数据
          const prevYearData = monthlyData.find(d => d.yearMonth === prevYearKey);

          let monthlyYoY = null;
          if (prevYearData && current.value !== null && prevYearData.value !== null && prevYearData.value !== 0) {
            monthlyYoY = parseFloat(((current.value - prevYearData.value) / Math.abs(prevYearData.value) * 100).toFixed(2));
          }

          result.push({
            ...current,
            yoy: monthlyYoY !== null ? monthlyYoY : current.yoy // 如果计算不出当月同比，使用原始累积同比
          });
        }

        return result;
      }
      function renderSingle() {
        const industry = industrySelect.value;
        const metric = metricSelect.value;
        const metricKey = industry + '-' + metric;

        const rows = (json.metrics && json.metrics[metricKey]) || [];

        // 计算当月数据
        const monthlyRows = calculateMonthlyData(rows);

        const x = monthlyRows.map(d => d.yearMonth);
        const abs = monthlyRows.map(d => d.value);

        // 使用当月数据中已经计算好的环比和同比
        const mom = monthlyRows.map(d => d.mom);
        const yoy = monthlyRows.map(d => d.yoy);

        const displayName = industry + '-' + metric;
  const option = {
    backgroundColor: "#0b0f19",
    // 关闭动画以提升性能
    animation: false,
    tooltip: {
      trigger: "axis",
      valueFormatter: v => v == null ? "-" : (typeof v === 'number' ? v.toFixed(2) : v)
    },
          legend: { data: [displayName + "-当月值", displayName + "-环比%", displayName + "-同比%"], textStyle: { color: "#cbd5e1" } },
    grid: { left: 60, right: 60, top: 40, bottom: 40 },
    xAxis: { type: "category", data: x, axisLabel: { color: "#9aa4b2" } },
    yAxis: [
      { type: "value", name: "当月值（亿元）", position: "left", axisLabel: { color: "#9aa4b2" }, splitLine: { lineStyle: { color: "#1f2937" } } },
      { type: "value", name: "%", position: "right", axisLabel: { color: "#9aa4b2" }, splitLine: { show: false } }
    ],
    series: [
            { name: displayName + "-当月值", type: "line", yAxisIndex: 0, data: abs, smooth: true, lineStyle: { width: 3, color: SINGLE_VALUE_COLOR }, symbol: "circle", symbolSize: 6, itemStyle: { color: SINGLE_VALUE_COLOR } },
            { name: displayName + "-环比%", type: "line", yAxisIndex: 1, data: mom, smooth: true, lineStyle: { width: 2.5, type: 'dashed', color: SINGLE_MOM_COLOR }, symbol: "triangle", symbolSize: 6, itemStyle: { color: SINGLE_MOM_COLOR } },
            { name: displayName + "-同比%", type: "line", yAxisIndex: 1, data: yoy, smooth: true, lineStyle: { width: 2.5, type: 'solid', color: SINGLE_YOY_COLOR }, symbol: "diamond", symbolSize: 6, itemStyle: { color: SINGLE_YOY_COLOR } }
          ]
        };
        chart.setOption(option, true);
      }
      // 图表实例管理：存储每个卡片的图表实例
      const chartInstances = new Map();
      // Intersection Observer 实例
      let intersectionObserver = null;

      /**
       * 创建单个图表的配置
       */
      function createChartOption(name, rows, yearData, yoyData, momData) {
        const option = {
          backgroundColor: '#0f172a',
          // 关闭动画以提升性能
          animation: false,
          grid: { left: 50, right: 50, top: 35, bottom: 35 },
          xAxis: {
            type: 'category',
            data: ['1-2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'],
            axisLabel: { color: '#9aa4b2', fontSize: 11 }
          },
          yAxis: [
            { type: 'value', position: 'left', axisLabel: { color: '#9aa4b2', fontSize: 11 }, splitLine: { lineStyle: { color: '#1f2937' } } },
            { type: 'value', position: 'right', axisLabel: { color: '#9aa4b2', fontSize: 11, formatter: '{value}%' }, splitLine: { show: false } }
          ],
          series: [],
          legend: { show: true, top: 0, textStyle: { color: '#cbd5e1', fontSize: 11 } },
          tooltip: {
            trigger: 'axis',
            backgroundColor: 'rgba(15, 23, 42, 0.95)',
            borderColor: '#1f2937',
            textStyle: { color: '#e2e8f0' },
            formatter: function (ps) {
              let s = ps[0].name + '<br/>';
              ps.forEach(function (p) {
                if (p.seriesName && p.seriesName.includes('增速参考线')) {
                  return; // 跳过参考线系列
                }
                if (p.seriesName.includes('同比') || p.seriesName.includes('环比')) {
                  s += p.seriesName + ': ' + (p.value != null ? p.value.toFixed(2) + '%' : '-') + '<br/>';
                } else {
                  s += p.seriesName + ': ' + (p.value != null ? p.value.toFixed(2) + '亿元（当月）' : '-') + '<br/>';
                }
              });
              return s;
            }
          }
        };

        const years = Object.keys(yearData).sort();
        const latestYear = years[years.length - 1]; // 获取最新年份

        years.forEach(function (y, idx) {
          const isLatestYear = (y === latestYear);
          const isHistoricalYear = !isLatestYear;

          // 如果是历史年份且用户选择隐藏历史年份，则跳过
          if (isHistoricalYear && !showHistoricalYears) {
            return;
          }

          const data = new Array(11).fill(null);
          const yoyDataArray = new Array(11).fill(null);
          const momDataArray = new Array(11).fill(null);

          (yearData[y] || []).forEach(function (it) {
            const month = it.month;
            let idx = -1;
            if (month.endsWith('-01-02')) { idx = 0; } // 1-2月
            else if (month.endsWith('-03')) { idx = 1; }
            else if (month.endsWith('-04')) { idx = 2; }
            else if (month.endsWith('-05')) { idx = 3; }
            else if (month.endsWith('-06')) { idx = 4; }
            else if (month.endsWith('-07')) { idx = 5; }
            else if (month.endsWith('-08')) { idx = 6; }
            else if (month.endsWith('-09')) { idx = 7; }
            else if (month.endsWith('-10')) { idx = 8; }
            else if (month.endsWith('-11')) { idx = 9; }
            else if (month.endsWith('-12')) { idx = 10; }

            if (idx >= 0) { data[idx] = it.value; }
          });

          (yoyData[y] || []).forEach(function (it) {
            const month = it.month;
            let idx = -1;
            if (month.endsWith('-01-02')) { idx = 0; } // 1-2月
            else if (month.endsWith('-03')) { idx = 1; }
            else if (month.endsWith('-04')) { idx = 2; }
            else if (month.endsWith('-05')) { idx = 3; }
            else if (month.endsWith('-06')) { idx = 4; }
            else if (month.endsWith('-07')) { idx = 5; }
            else if (month.endsWith('-08')) { idx = 6; }
            else if (month.endsWith('-09')) { idx = 7; }
            else if (month.endsWith('-10')) { idx = 8; }
            else if (month.endsWith('-11')) { idx = 9; }
            else if (month.endsWith('-12')) { idx = 10; }

            if (idx >= 0) { yoyDataArray[idx] = it.yoy; }
          });

          (momData[y] || []).forEach(function (it) {
            const month = it.month;
            let idx = -1;
            if (month.endsWith('-01-02')) { idx = 0; } // 1-2月
            else if (month.endsWith('-03')) { idx = 1; }
            else if (month.endsWith('-04')) { idx = 2; }
            else if (month.endsWith('-05')) { idx = 3; }
            else if (month.endsWith('-06')) { idx = 4; }
            else if (month.endsWith('-07')) { idx = 5; }
            else if (month.endsWith('-08')) { idx = 6; }
            else if (month.endsWith('-09')) { idx = 7; }
            else if (month.endsWith('-10')) { idx = 8; }
            else if (month.endsWith('-11')) { idx = 9; }
            else if (month.endsWith('-12')) { idx = 10; }

            if (idx >= 0) { momDataArray[idx] = it.mom; }
          });

          // 添加绝对值曲线（最新年用 LATEST_YEAR_VALUE_COLOR）
          var valueLineColor = isLatestYear ? LATEST_YEAR_VALUE_COLOR : YEAR_COLORS[idx % YEAR_COLORS.length];
          option.series.push({ type: 'line', name: y + '年', yAxisIndex: 0, data: data, smooth: true, symbol: 'circle', symbolSize: 4, lineStyle: { color: valueLineColor, width: 2 }, itemStyle: { color: valueLineColor } });

          // 只为最新年份添加同比和环比曲线
          if (isLatestYear) {
            if (showYoyCurve) {
              option.series.push({ type: 'line', name: y + '年同比', yAxisIndex: 1, data: yoyDataArray, smooth: true, symbol: 'diamond', symbolSize: 3, lineStyle: { color: YOY_COLOR, width: 2, type: 'solid' }, itemStyle: { color: YOY_COLOR } });
            }
            if (showMomCurve) {
              option.series.push({ type: 'line', name: y + '年环比', yAxisIndex: 1, data: momDataArray, smooth: true, symbol: 'triangle', symbolSize: 3, lineStyle: { color: MOM_COLOR, width: 2, type: 'dashed' }, itemStyle: { color: MOM_COLOR } });
            }
          }
        });

        // 添加增速参考线（如果启用）
        if (showGrowthLines) {
          const lastRightAxisSeries = option.series.filter(s => s.yAxisIndex === 1).pop();
          if (lastRightAxisSeries) {
            lastRightAxisSeries.markLine = {
              silent: true,
              symbol: 'none',
              data: [
                { yAxis: 10, lineStyle: { color: '#10b981', type: 'dashed', width: 1.5, opacity: 0.7 }, label: { show: true, position: 'end', formatter: '10%', color: '#10b981', fontSize: 10 } },
                { yAxis: 20, lineStyle: { color: '#3b82f6', type: 'dashed', width: 1.5, opacity: 0.7 }, label: { show: true, position: 'end', formatter: '20%', color: '#3b82f6', fontSize: 10 } }
              ]
            };
          }
        }

        return option;
      }

      /**
       * 初始化单个图表（懒加载时调用）
       */
      function initChart(cardElement, name, rows, yearData, yoyData, momData) {
        const chartDiv = cardElement.querySelector('.chart-container');
        if (!chartDiv) return;

        // 如果已经初始化过，先销毁
        if (chartInstances.has(cardElement)) {
          const oldChart = chartInstances.get(cardElement);
          if (oldChart) {
            oldChart.dispose();
          }
        }

        // 初始化新图表
        const chart = echarts.init(chartDiv, null, { renderer: 'canvas' });
        const option = createChartOption(name, rows, yearData, yoyData, momData);
        chart.setOption(option);
        chartInstances.set(cardElement, chart);
      }

      /**
       * 销毁单个图表（离开视口时调用）
       */
      function disposeChart(cardElement) {
        if (chartInstances.has(cardElement)) {
          const chart = chartInstances.get(cardElement);
          if (chart) {
            chart.dispose();
          }
          chartInstances.delete(cardElement);
        }
      }

      /**
       * 设置 Intersection Observer 实现懒加载
       */
      function setupLazyLoading() {
        // 如果已存在 observer，先断开
        if (intersectionObserver) {
          intersectionObserver.disconnect();
        }

        // 创建 Intersection Observer
        // rootMargin: '100px' 表示提前 100px 开始加载，提升用户体验
        intersectionObserver = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            const card = entry.target;
            const name = card.dataset.metricName;
            const chartData = card.dataset.chartData;

            if (entry.isIntersecting) {
              // 进入视口：初始化图表
              if (chartData && !chartInstances.has(card)) {
                try {
                  const data = JSON.parse(chartData);
                  initChart(card, name, data.rows, data.yearData, data.yoyData, data.momData);
                } catch (e) {
                  console.error('解析图表数据失败:', e);
                }
              }
            } else {
              // 离开视口：销毁图表以释放内存（可选，如果希望保留已渲染的图表可以注释掉）
              // disposeChart(card);
            }
          });
        }, {
          root: null,
          rootMargin: '100px', // 提前 100px 开始加载
          threshold: 0.01 // 只要 1% 可见就触发
        });

        // 观察所有卡片
        const grid = document.getElementById('grid');
        const cards = grid.querySelectorAll('.chart-card');
        cards.forEach(function (card) {
          intersectionObserver.observe(card);
        });
      }

        // 断开之前的 observer
        if (intersectionObserver) {

        momBtn.style.background = showMomCurve ? '#3b82f6' : '#0f172a';
        momBtn.style.color = showMomCurve ? '#ffffff' : '#e5e7eb';

        yoyBtn.style.background = showYoyCurve ? '#3b82f6' : '#0f172a';
        yoyBtn.style.color = showYoyCurve ? '#ffffff' : '#e5e7eb';

        historicalBtn.style.background = showHistoricalYears ? '#3b82f6' : '#0f172a';
        historicalBtn.style.color = showHistoricalYears ? '#ffffff' : '#e5e7eb';
      }

      // 放大图表功能
      function showZoomChart(name, rows, yearData, yoyData) {
        const modal = document.getElementById('zoomModal');
        const title = document.getElementById('zoomTitle');
        const chartDiv = document.getElementById('zoomChart');

        // 销毁之前的图表实例
        if (currentZoomChart) {
          currentZoomChart.dispose();
          currentZoomChart = null;
        }

        // 移除之前的resize监听器
        if (zoomResizeHandler) {
          window.removeEventListener('resize', zoomResizeHandler);
          zoomResizeHandler = null;
        }

        title.textContent = name + ' - 详细视图';
        modal.style.display = 'block';

        // 等待DOM更新后再初始化图表
        setTimeout(function() {
          // 清空并重新初始化图表
          chartDiv.innerHTML = '';
          currentZoomChart = echarts.init(chartDiv, null, { renderer: 'canvas' });

        const option = {
          backgroundColor: '#0b0f19',
          // 关闭动画以提升性能
          animation: false,
          grid: { left: 80, right: 80, top: 60, bottom: 60 },
          xAxis: { type: 'category', data: ['1-2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'], axisLabel: { color: '#9aa4b2', fontSize: 14 } },
          yAxis: [
            { type: 'value', position: 'left', axisLabel: { color: '#9aa4b2', fontSize: 14 }, splitLine: { lineStyle: { color: '#1f2937' } } },
            { type: 'value', position: 'right', axisLabel: { color: '#9aa4b2', fontSize: 14, formatter: '{value}%' }, splitLine: { show: false } }
          ],
          series: [],
          legend: { show: true, top: 10, textStyle: { color: '#cbd5e1', fontSize: 14 } },
          tooltip: {
            trigger: 'axis',
            backgroundColor: 'rgba(15, 23, 42, 0.95)',
            borderColor: '#1f2937',
            textStyle: { color: '#e2e8f0', fontSize: 14 },
            formatter: function (ps) {
              let s = ps[0].name + '<br/>';
              ps.forEach(function (p) {
                if (p.seriesName.includes('同比')) {
                  s += p.seriesName + ': ' + (p.value != null ? p.value.toFixed(2) + '%' : '-') + '<br/>';
                } else {
                  s += p.seriesName + ': ' + (p.value != null ? p.value.toFixed(2) + '亿元' : '-') + '<br/>';
                }
              });
              return s;
            }
          },
          dataZoom: [
            { type: 'slider', show: true, xAxisIndex: [0], start: 0, end: 100 },
            { type: 'inside', xAxisIndex: [0] }
          ]
        };

        const zoomYearList = Object.keys(yearData).sort();
        const zoomLatestYear = zoomYearList[zoomYearList.length - 1];
        zoomYearList.forEach(function (y, idx) {
          const data = new Array(11).fill(null);
          const yoyDataArray = new Array(11).fill(null);
          (yearData[y] || []).forEach(function (it) {
            const month = it.month;
            let idx = -1;
            if (month.endsWith('-01-02')) { idx = 0; } // 1-2月
            else if (month.endsWith('-03')) { idx = 1; }
            else if (month.endsWith('-04')) { idx = 2; }
            else if (month.endsWith('-05')) { idx = 3; }
            else if (month.endsWith('-06')) { idx = 4; }
            else if (month.endsWith('-07')) { idx = 5; }
            else if (month.endsWith('-08')) { idx = 6; }
            else if (month.endsWith('-09')) { idx = 7; }
            else if (month.endsWith('-10')) { idx = 8; }
            else if (month.endsWith('-11')) { idx = 9; }
            else if (month.endsWith('-12')) { idx = 10; }

            if (idx >= 0) { data[idx] = it.value; }
          });
          (yoyData[y] || []).forEach(function (it) {
            const month = it.month;
            let idx = -1;
            if (month.endsWith('-01-02')) { idx = 0; } // 1-2月
            else if (month.endsWith('-03')) { idx = 1; }
            else if (month.endsWith('-04')) { idx = 2; }
            else if (month.endsWith('-05')) { idx = 3; }
            else if (month.endsWith('-06')) { idx = 4; }
            else if (month.endsWith('-07')) { idx = 5; }
            else if (month.endsWith('-08')) { idx = 6; }
            else if (month.endsWith('-09')) { idx = 7; }
            else if (month.endsWith('-10')) { idx = 8; }
            else if (month.endsWith('-11')) { idx = 9; }
            else if (month.endsWith('-12')) { idx = 10; }

            if (idx >= 0) { yoyDataArray[idx] = it.yoy; }
          });
          var zoomAbsColor = (y === zoomLatestYear) ? LATEST_YEAR_VALUE_COLOR : YEAR_COLORS[idx % YEAR_COLORS.length];
          option.series.push({ type: 'line', name: y + '年', yAxisIndex: 0, data: data, smooth: true, symbol: 'circle', symbolSize: 8, lineStyle: { color: zoomAbsColor, width: 3.5 }, itemStyle: { color: zoomAbsColor } });
          option.series.push({ type: 'line', name: y + '年同比', yAxisIndex: 1, data: yoyDataArray, smooth: true, symbol: 'diamond', symbolSize: 6, lineStyle: { color: YOY_COLOR, width: 2.5, type: 'solid' }, itemStyle: { color: YOY_COLOR } });
        });

          currentZoomChart.setOption(option);

          // 创建新的resize监听器
          zoomResizeHandler = function() {
            if (modal.style.display !== 'none' && currentZoomChart) {
              currentZoomChart.resize();
            }
          };
          window.addEventListener('resize', zoomResizeHandler);
        }, 100);
      }

      // 关闭放大模态框
      function closeZoomModal() {
        const modal = document.getElementById('zoomModal');
        modal.style.display = 'none';

        // 销毁图表实例和事件监听器
        if (currentZoomChart) {
          currentZoomChart.dispose();
          currentZoomChart = null;
        }
        if (zoomResizeHandler) {
          window.removeEventListener('resize', zoomResizeHandler);
          zoomResizeHandler = null;
        }
      }

      renderSingle();
      industrySelect.addEventListener("change", function () { renderSingle(); });
      metricSelect.addEventListener("change", function () { renderSingle(); });

      // 趋势图事件监听器
      tableMetricSelect.addEventListener("change", function () { renderTable(); });
      document.getElementById('showMonthlyData').addEventListener('change', function () { renderTable(); });
      document.getElementById('tableFilter').addEventListener('input', function () { renderTable(); });
      document.getElementById('tabSingle').addEventListener('click', function () { switchTab('single'); });
      document.getElementById('tabDashboard').addEventListener('click', function () { switchTab('dash'); });
      document.getElementById('tabTable').addEventListener('click', function () { switchTab('table'); });

      // 更新增速参考线按钮样式
      function updateGrowthLinesButtonStyle() {
        const btn = document.getElementById('toggleGrowthLines');
        if (btn) {
          btn.style.background = showGrowthLines ? '#3b82f6' : '#0f172a';
          btn.style.color = showGrowthLines ? '#ffffff' : '#e5e7eb';
          btn.textContent = showGrowthLines ? '开启' : '关闭';
        }
      }

      // 增速参考线按钮事件监听器（只在总表页面）
      const toggleGrowthLinesBtn = document.getElementById('toggleGrowthLines');
      if (toggleGrowthLinesBtn) {
        toggleGrowthLinesBtn.addEventListener('click', function () {
          showGrowthLines = !showGrowthLines;
          localStorage.setItem('industry_profits_growth_lines', JSON.stringify(showGrowthLines));
          updateGrowthLinesButtonStyle();
          renderGrid();  // 只更新总表页面
        });
        // 初始化按钮样式
        updateGrowthLinesButtonStyle();
      }

      /* ── 仅收藏开关 ── */
      document.getElementById('toggleFavOnly').addEventListener('click', function () {
        showOnlyFavorites = !showOnlyFavorites;
        updateFavOnlyBtn();
        renderGrid();
      });
      updateFavOnlyBtn();

      // 环比同比按钮事件监听器
      document.getElementById('toggleMom').addEventListener('click', function () {
        showMomCurve = !showMomCurve;
        updateButtonStyles();
        renderGrid();
      });
      document.getElementById('toggleYoy').addEventListener('click', function () {
        showYoyCurve = !showYoyCurve;
        updateButtonStyles();
        renderGrid();
      });
      document.getElementById('toggleHistorical').addEventListener('click', function () {
        showHistoricalYears = !showHistoricalYears;
        updateButtonStyles();
        renderGrid();
      });

      // 模态框关闭事件
      document.getElementById('zoomModal').addEventListener('click', function () {
        closeZoomModal();
      });
      document.getElementById('closeZoom').addEventListener('click', function () {
        closeZoomModal();
      });
});
</script>

  <!-- 放大模态框 -->
  <div id="zoomModal"
    style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; cursor:pointer;">
    <div
      style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:90%; height:80%; max-width:1200px; background:#0b0f19; border-radius:12px; padding:20px; cursor:default;"
      onclick="event.stopPropagation();">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h3 id="zoomTitle" style="color:#e2e8f0; margin:0; font-size:18px;"></h3>
        <button id="closeZoom"
          style="background:none; border:none; color:#9aa4b2; font-size:24px; cursor:pointer; padding:4px 8px;">×</button>
      </div>
      <div id="zoomChart" style="width:100%; height:calc(100% - 60px);"></div>
    </div>
  </div>
</body>

</html>
