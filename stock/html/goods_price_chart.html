<!doctype html>
<html lang="zh">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>重要生产资料价格 - 趋势看板</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial;
      margin: 0;
      padding: 16px;
      background: #0b0f19;
      color: #dbe0ea;
    }

    #app {
      height: 80vh;
    }

    .legend-note {
      opacity: .7;
      font-size: 12px;
    }

    .title-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .copy-title-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #9aa4b2;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .copy-title-btn:hover {
      background: #334155;
      color: #e2e8f0;
      border-color: #3b82f6;
    }
    .copy-title-btn:active {
      transform: scale(0.95);
    }
    .copy-ok {
      font-size: 12px;
      opacity: 0.7;
      color: #10b981;
      display: none;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 0.7; }
    }
  </style>
</head>

<body>
  <div class="title-wrapper">
  <h2 style="margin:0;">重要生产资料价格 - 趋势看板</h2>
  <button id="copyTitleBtn" class="copy-title-btn" title="复制标题">
    📋 复制
  </button>
  <span id="copyTitleOk" class="copy-ok">✓ 已复制</span>
</div>
  <div class="legend-note">展示本期价格（左轴），以及环比、同比涨跌（右轴，单位%）。</div>
  <div style="margin:16px 0; display:flex; gap:4px; align-items:center; flex-wrap:wrap;">
    <div style="display:flex; background:#1e293b; border-radius:10px; padding:4px; gap:2px;">
      <button id="tabSingle"
        style="background:#3b82f6;color:#ffffff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:all 0.2s ease;min-width:80px;">单指标</button>
      <button id="tabDashboard"
        style="background:transparent;color:#94a3b8;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:all 0.2s ease;min-width:80px;">总表</button>
      <button id="tabTable"
        style="background:transparent;color:#94a3b8;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:all 0.2s ease;min-width:80px;">趋势图</button>
    </div>
    <span style="opacity:.6; font-size:12px; margin-left:12px; color:#64748b;">单指标支持切换；总表为各品类当期值小图；趋势图为多指标合并曲线</span>
  </div>
  <div id="singleWrap">
    <div style="margin:12px 0; display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
      <label for="metric" style="opacity:.8">指标</label>
      <select id="metric" style="background:#0f172a;color:#e5e7eb;border:1px solid #334155;padding:6px 8px;border-radius:6px;"></select>
      <button id="copyMetricBtn" style="background:#0f172a;color:#e5e7eb;border:1px solid #334155;padding:6px 8px;border-radius:6px;cursor:pointer;">复制选中指标</button>
      <span id="copyMetricOk" style="font-size:12px;opacity:.7;display:none;">已复制</span>
    </div>
    <div id="app"></div>
  </div>
  <div id="dashboardWrap" style="display:none">
    <div style="margin:12px 0; display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
      <input id="filter" placeholder="过滤关键字" style="min-width:240px" />
      <span id="metricCount" style="opacity:.7"></span>
      <div style="margin-left:auto; display:flex; gap:8px; align-items:center;">
        <span style="opacity:.7; font-size:12px;">显示曲线：</span>
        <button id="toggleMom"
          style="background:#0f172a;color:#e5e7eb;border:1px solid #334155;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:12px;">环比</button>
        <button id="toggleYoy"
          style="background:#0f172a;color:#e5e7eb;border:1px solid #334155;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:12px;">同比</button>
        <span style="opacity:.7; font-size:12px; margin-left:12px;">历史年份：</span>
        <button id="toggleHistorical"
          style="background:#0f172a;color:#e5e7eb;border:1px solid #334155;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:12px;">显示</button>
        <span style="opacity:.7; font-size:12px; margin-left:12px;">增速参考线：</span>
        <button id="toggleGrowthLines" style="background:#0f172a;color:#e5e7eb;border:1px solid #334155;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:12px;">关闭</button>
        <span style="opacity:.7; font-size:12px; margin-left:12px;">收藏：</span>
        <button id="toggleFavOnly" style="background:#0f172a;color:#e5e7eb;border:1px solid #334155;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:12px;">❤️ 仅收藏</button>
      </div>
    </div>
    <div id="grid"
      style="padding:0 16px 24px 16px; display:grid; grid-template-columns:repeat(3,1fr); gap:16px; width:100%; box-sizing:border-box;">
    </div>
  </div>
  <div id="tableWrap" style="display:none;">
    <div style="margin-bottom:12px; display:flex; gap:12px; align-items:center;">
      <input id="tableFilter" placeholder="过滤关键字（指标）" style="min-width:260px" />
      <span style="opacity:.7">当期值（元或相关单位）多指标合并曲线，支持图例选择和过滤</span>
    </div>
    <div id="overall" style="height:70vh;"></div>
  </div>
  <script src="../vendor/echarts.min.js"></script>
  <script>

    /* ══════════════════════════════════════════════════════
       收藏管理（模块级，保证在 fetch 前就可用）
    ════════════════════════════════════════════════════════ */
    var FAV_KEY = 'goods_price_favorites';
    var favorites = new Set(JSON.parse(localStorage.getItem(FAV_KEY) || '[]'));
    var showOnlyFavorites = false;

    function saveFavorites() {
      localStorage.setItem(FAV_KEY, JSON.stringify([...favorites]));
    }
    function isFavorite(name) { return favorites.has(name); }
    function toggleFavoriteItem(name) {
      if (favorites.has(name)) { favorites.delete(name); } else { favorites.add(name); }
      saveFavorites();
    }

    /* 旧的 document.addEventListener 事件委托已替换为 onclick，保留 copyMetricBtn 那个 */
    document.addEventListener('DOMContentLoaded', function() {
      const copyTitleBtn = document.getElementById('copyTitleBtn');
      const copyTitleOk = document.getElementById('copyTitleOk');
      const h2 = document.querySelector('h2');

      if (copyTitleBtn && h2) {
        copyTitleBtn.addEventListener('click', function() {
          const title = h2.textContent.trim();

          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(title).then(function() {
              showCopySuccess();
            }).catch(function(err) {
              console.error('复制失败:', err);
            });
          } else {
            // 备用方法
            const ta = document.createElement('textarea');
            ta.value = title;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            try {
              document.execCommand('copy');
              showCopySuccess();
            } catch (err) {
              console.error('复制失败:', err);
            }
            document.body.removeChild(ta);
          }
        });
      }

      function showCopySuccess() {
        if (copyTitleOk) {
          copyTitleOk.style.display = 'inline';
          setTimeout(function() {
            copyTitleOk.style.display = 'none';
          }, 1500);
        }
      }
    });
    document.addEventListener('click', function (e) {
      var t = e.target; if (t && t.id === 'copyMetricBtn') {
        try {
          var sel = document.getElementById('metric'); var text = sel && sel.value ? sel.value : '';
          if (!text) { return; }
          if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(function () { var ok = document.getElementById('copyMetricOk'); ok.style.display = 'inline'; setTimeout(function () { ok.style.display = 'none'; }, 1200); }); }
          else { var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); var ok = document.getElementById('copyMetricOk'); ok.style.display = 'inline'; setTimeout(function () { ok.style.display = 'none'; }, 1200); }
        } catch (err) { }
      }
    });
    fetch("../cleaned_data/goods_price_cleaned.json?t=" + Date.now()).then(function (r) { return r.json() }).then(function (json) {
      // 期望结构：{ metrics: { 指标名: [{ yearMonth, value, mom, yoy }...] }, parents: { 指标名: 父类名 } }
      function displayName(name) {
        var p = (json.parents && json.parents[name]) || '';
        return p ? (p + ' - ' + name) : name;
      }
      function unitOf(name) {
        return (json.units && json.units[name]) || '';
      }
      function itemUnitOf(name) {
        return (json.itemUnits && json.itemUnits[name]) || '';
      }

      var metricNames = Object.keys(json.metrics || {});
      metricNames.sort();
      var prefer = metricNames[0] || '';

      /* ── 收藏管理 ── */
      // (favorites/saveFavorites 已在模块顶层定义，此处只定义 UI 辅助函数)
      function setFavStyle(cardEl, heartBtn, isFav) {
        heartBtn.textContent = isFav ? '❤️' : '🤍';
        heartBtn.title = isFav ? '取消收藏' : '收藏';
        cardEl.dataset.favorited = isFav ? '1' : '';
        if (!cardEl.matches(':hover')) {
          cardEl.style.borderColor = isFav ? '#f43f5e' : '#1f2937';
          cardEl.style.boxShadow = isFav ? '0 2px 8px rgba(244,63,94,.25)' : '0 2px 8px rgba(0,0,0,0.3)';
        }
      }

      function updateFavOnlyBtn() {
        var btn = document.getElementById('toggleFavOnly');
        if (!btn) return;
        btn.style.background = showOnlyFavorites ? '#f43f5e' : '#0f172a';
        btn.style.color = showOnlyFavorites ? '#ffffff' : '#e5e7eb';
        btn.style.borderColor = showOnlyFavorites ? '#f43f5e' : '#334155';
      }      var select = document.getElementById("metric");
      metricNames.forEach(function (n) { var opt = document.createElement("option"); opt.value = n; opt.textContent = displayName(n); if (n === prefer) opt.selected = true; select.appendChild(opt); });
      var el = document.getElementById("app");
      var chart = echarts.init(el, null, { renderer: "canvas" });
      function renderSingle(name) {
        var rows = (json.metrics && json.metrics[name]) || [];
        var x = rows.map(function (d) { return d.yearMonth; });
        var abs = rows.map(function (d) { return d.value; });
        var mom = rows.map(function (d) { return d.mom; });
        var yoy = rows.map(function (d) { return d.yoy; });
        var dn = displayName(name);
        var u = unitOf(name);
        var iu = itemUnitOf(name);
        // 把计量单位放入页面内标题（非图例）
        try { document.querySelector('h2').textContent = '重要生产资料价格 - 趋势看板' } catch (e) {}
        var option = {
          backgroundColor: "#0b0f19",
          tooltip: { trigger: "axis", valueFormatter: function (v, s) { return v == null ? "-" : (s && /当期值/.test(s.seriesName) ? (v + (u ? u : '')) : v + '%'); } },
          legend: { data: [dn + "-当期值", dn + "-环比%", dn + "-同比%"], textStyle: { color: "#cbd5e1" } },
          grid: { left: 60, right: 60, top: 40, bottom: 40 },
          xAxis: { type: "category", data: x, axisLabel: { color: "#9aa4b2", formatter: function (val) { return val ? val.replace(/旬$/g, '') : val; } } },
          yAxis: [
            { type: "value", name: "当期值" + (u ? '（' + u + '）' : ''), position: "left", axisLabel: { color: "#9aa4b2" }, splitLine: { lineStyle: { color: "#1f2937" } } },
            { type: "value", name: "%", position: "right", axisLabel: { color: "#9aa4b2" }, splitLine: { show: false } }
          ],
          series: [
            { name: dn + "-当期值", type: "line", yAxisIndex: 0, data: abs, smooth: true, lineStyle: { width: 3, color: '#3b82f6' }, symbol: "circle", symbolSize: 6, itemStyle: { color: '#3b82f6' } },
            { name: dn + "-环比%", type: "line", yAxisIndex: 1, data: mom, smooth: true, lineStyle: { width: 2.5, type: 'dashed', color: '#f59e0b' }, symbol: "triangle", symbolSize: 6, itemStyle: { color: '#f59e0b' } },
            { name: dn + "-同比%", type: "line", yAxisIndex: 1, data: yoy, smooth: true, lineStyle: { width: 2.5, type: 'solid', color: '#ec4899' }, symbol: "diamond", symbolSize: 6, itemStyle: { color: '#ec4899' } }
          ]
        };
        chart.setOption(option, true);
      }

      // 图表实例管理：存储每个卡片的图表实例
      var chartInstances = new Map();
      // Intersection Observer 实例
      var intersectionObserver = null;

      /**
       * 创建单个图表的配置和渲染函数
       */
      function createChartOption(name, rows, yearData, yoyData, momData, unit) {
        var ticks = ['上旬', '中旬', '下旬'];
        var option = {
          backgroundColor: '#0f172a',
          // 关闭动画以提升性能
          animation: false,
          grid: { left: 50, right: 50, top: 35, bottom: 35 },
          xAxis: { type: 'category', data: [], axisLabel: { color: '#9aa4b2', fontSize: 11, interval: 0, formatter: function (val) { return val ? val.replace(/旬$/g, '') : val; } } },
          yAxis: [
            { type: 'value', position: 'left', name: unit ? ('当期值（' + unit + '）') : '当期值', axisLabel: { color: '#9aa4b2', fontSize: 11 }, splitLine: { lineStyle: { color: '#1f2937' } } },
            { type: 'value', position: 'right', axisLabel: { color: '#9aa4b2', fontSize: 11, formatter: '{value}%' }, splitLine: { show: false } }
          ],
          series: [],
          legend: { show: true, top: 0, textStyle: { color: '#cbd5e1', fontSize: 11 } },
          tooltip: {
            trigger: 'axis',
            backgroundColor: 'rgba(15, 23, 42, 0.95)',
            borderColor: '#1f2937',
            textStyle: { color: '#e2e8f0' },
            formatter: function (ps) {
              var s = ps[0].name + '<br/>';
              ps.forEach(function (p) {
                if (p.seriesName.indexOf('同比') > -1 || p.seriesName.indexOf('环比') > -1) {
                  s += p.seriesName + ': ' + (p.value != null ? p.value + '%' : '-') + '<br/>';
                } else {
                  s += p.seriesName + ': ' + (p.value != null ? (p.value + (unit ? unit : '')) : '-') + '<br/>';
                }
              });
              return s;
            }
          }
        };

        var colors = ['#ef4444', '#3b82f6', '#10b981', '#8b5cf6', '#06b6d4'];
        var years = Object.keys(yearData).sort();
        var latestYear = years[years.length - 1];
        // x 轴固定为一年 36 个刻度（不带年份）
        var xKeys = [];
        var monthList = ['01','02','03','04','05','06','07','08','09','10','11','12'];
        monthList.forEach(function (mm) { ticks.forEach(function (t) { xKeys.push(mm + '-' + t); }); });
        option.xAxis.data = xKeys;

        years.forEach(function (y, idx) {
          var isLatestYear = (y === latestYear);
          if (!showHistoricalYears && !isLatestYear) { return; }
          var data = xKeys.map(function () { return null; });
          var yoyDataArray = xKeys.map(function () { return null; });
          var momDataArray = xKeys.map(function () { return null; });
          (yearData[y] || []).forEach(function (it) {
            var m = it.month.match(/\d{4}-(\d{2})-(上旬|中旬|下旬)/);
            var key = m ? (m[1] + '-' + m[2]) : '';
            var idxKey = xKeys.indexOf(key);
            if (idxKey === -1) return;
            data[idxKey] = it.value != null ? it.value : null;
          });
          (yoyData[y] || []).forEach(function (it) {
            var m = it.month.match(/\d{4}-(\d{2})-(上旬|中旬|下旬)/);
            var key = m ? (m[1] + '-' + m[2]) : '';
            var idxKey = xKeys.indexOf(key);
            if (idxKey === -1) return;
            yoyDataArray[idxKey] = it.yoy != null ? it.yoy : null;
          });
          (momData[y] || []).forEach(function (it) {
            var m = it.month.match(/\d{4}-(\d{2})-(上旬|中旬|下旬)/);
            var key = m ? (m[1] + '-' + m[2]) : '';
            var idxKey = xKeys.indexOf(key);
            if (idxKey === -1) return;
            momDataArray[idxKey] = it.mom != null ? it.mom : null;
          });
          option.series.push({ type: 'line', name: y + '年', yAxisIndex: 0, data: data, smooth: true, symbol: 'circle', symbolSize: 4, lineStyle: { color: colors[idx % colors.length], width: 2 }, itemStyle: { color: colors[idx % colors.length] } });
          if (isLatestYear) {
            if (showYoyCurve) { option.series.push({ type: 'line', name: y + '年同比', yAxisIndex: 1, data: yoyDataArray, smooth: true, symbol: 'diamond', symbolSize: 3, lineStyle: { color: '#4ade80', width: 2, type: 'solid' }, itemStyle: { color: '#4ade80' } }); }
            if (showMomCurve) { option.series.push({ type: 'line', name: y + '年环比', yAxisIndex: 1, data: momDataArray, smooth: true, symbol: 'triangle', symbolSize: 3, lineStyle: { color: '#f59e0b', width: 2, type: 'dashed' }, itemStyle: { color: '#f59e0b' } }); }
          }
        });

        // 如果某些横坐标在所有系列中均为 null，则移除这些坐标并同步裁剪每条曲线
        var keepIndex = [];
        for (var i = 0; i < xKeys.length; i++) {
          var hasValue = false;
          for (var si = 0; si < option.series.length; si++) {
            var arr = option.series[si].data || [];
            if (arr[i] != null) { hasValue = true; break; }
          }
          if (hasValue) keepIndex.push(i);
        }
        if (keepIndex.length !== xKeys.length && keepIndex.length > 0) {
          option.xAxis.data = keepIndex.map(function (idx) { return xKeys[idx]; });
          option.series.forEach(function (s) { s.data = keepIndex.map(function (idx) { return (s.data || [])[idx]; }); });
        }

        // 添加增速参考线（如果启用）
        if (showGrowthLines) {
          var lastRightAxisSeries = option.series.filter(function(s) { return s.yAxisIndex === 1; }).pop();
          if (lastRightAxisSeries) {
            lastRightAxisSeries.markLine = {
              silent: true,
              symbol: 'none',
              data: [
                { yAxis: 10, lineStyle: { color: '#10b981', type: 'dashed', width: 1.5, opacity: 0.7 }, label: { show: true, position: 'end', formatter: '10%', color: '#10b981', fontSize: 10 } },
                { yAxis: 20, lineStyle: { color: '#3b82f6', type: 'dashed', width: 1.5, opacity: 0.7 }, label: { show: true, position: 'end', formatter: '20%', color: '#3b82f6', fontSize: 10 } }
              ]
            };
          }
        }

        return option;
      }

      /**
       * 初始化单个图表（懒加载时调用）
       */
      function initChart(cardElement, name, rows, yearData, yoyData, momData, unit) {
        var chartDiv = cardElement.querySelector('.chart-container');
        if (!chartDiv) return;

        // 如果已经初始化过，先销毁
        if (chartInstances.has(cardElement)) {
          var oldChart = chartInstances.get(cardElement);
          if (oldChart) {
            oldChart.dispose();
          }
        }

        // 初始化新图表
        var chart = echarts.init(chartDiv, null, { renderer: 'canvas' });
        var option = createChartOption(name, rows, yearData, yoyData, momData, unit);
        chart.setOption(option);
        chartInstances.set(cardElement, chart);
      }

      /**
       * 销毁单个图表（离开视口时调用）
       */
      function disposeChart(cardElement) {
        if (chartInstances.has(cardElement)) {
          var chart = chartInstances.get(cardElement);
          if (chart) {
            chart.dispose();
          }
          chartInstances.delete(cardElement);
        }
      }

      /**
       * 设置 Intersection Observer 实现懒加载
       */
      function setupLazyLoading() {
        // 如果已存在 observer，先断开
        if (intersectionObserver) {
          intersectionObserver.disconnect();
        }

        // 创建 Intersection Observer
        // rootMargin: '100px' 表示提前 100px 开始加载，提升用户体验
        intersectionObserver = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            var card = entry.target;
            var name = card.dataset.metricName;
            var chartData = card.dataset.chartData;

            if (entry.isIntersecting) {
              // 进入视口：初始化图表
              if (chartData && !chartInstances.has(card)) {
                try {
                  var data = JSON.parse(chartData);
                  initChart(card, name, data.rows, data.yearData, data.yoyData, data.momData, data.unit);
                } catch (e) {
                  console.error('解析图表数据失败:', e);
                }
              }
            } else {
              // 离开视口：销毁图表以释放内存（可选，如果希望保留已渲染的图表可以注释掉）
              // disposeChart(card);
            }
          });
        }, {
          root: null,
          rootMargin: '100px', // 提前 100px 开始加载
          threshold: 0.01 // 只要 1% 可见就触发
        });

        // 观察所有卡片
        var grid = document.getElementById('grid');
        var cards = grid.querySelectorAll('.chart-card');
        cards.forEach(function (card) {
          intersectionObserver.observe(card);
        });
      }

      function renderGrid() {
        var grid = document.getElementById('grid');
        var filter = document.getElementById('filter');
        var metricCount = document.getElementById('metricCount');
        var keyword = (filter.value || '').trim();

        // 先销毁所有现有图表实例
        chartInstances.forEach(function (chart, card) {
          if (chart) {
            chart.dispose();
          }
        });
        chartInstances.clear();

        // 断开之前的 observer
        if (intersectionObserver) {
          intersectionObserver.disconnect();
          intersectionObserver = null;
        }

        grid.innerHTML = '';

        var names = Object.keys(json.metrics || {}).filter(function (n) {
          if (showOnlyFavorites && !favorites.has(n)) return false;
          return !keyword || displayName(n).indexOf(keyword) > -1;
        });
        /* 收藏优先，其次按名称排序 */
        names.sort(function (a, b) {

            var data = xKeys.map(function () { return null; });

          }

          currentZoomChart.setOption(option);
          zoomResizeHandler = function () { if (modal.style.display !== 'none' && currentZoomChart) { currentZoomChart.resize(); } };
          window.addEventListener('resize', zoomResizeHandler);
        }, 100);
      }
      function closeZoomModal() {
        var modal = document.getElementById('zoomModal');
        modal.style.display = 'none';
        if (currentZoomChart) { currentZoomChart.dispose(); currentZoomChart = null; }
        if (zoomResizeHandler) { window.removeEventListener('resize', zoomResizeHandler); zoomResizeHandler = null; }
      }

      renderSingle(prefer);
      select.addEventListener("change", function () { renderSingle(this.value); });
      document.getElementById('tabSingle').addEventListener('click', function () { switchTab('single'); });
      document.getElementById('tabDashboard').addEventListener('click', function () { switchTab('dash'); });
      document.getElementById('tabTable').addEventListener('click', function () { switchTab('table'); });
      document.getElementById('toggleMom').addEventListener('click', function () { showMomCurve = !showMomCurve; updateButtonStyles(); renderGrid(); });
      document.getElementById('toggleYoy').addEventListener('click', function () { showYoyCurve = !showYoyCurve; updateButtonStyles(); renderGrid(); });
      document.getElementById('toggleHistorical').addEventListener('click', function () { showHistoricalYears = !showHistoricalYears; updateButtonStyles(); renderGrid(); });

      // 更新增速参考线按钮样式
      function updateGrowthLinesButtonStyle() {
        const btn = document.getElementById('toggleGrowthLines');
        if (btn) {
          btn.style.background = showGrowthLines ? '#3b82f6' : '#0f172a';
          btn.style.color = showGrowthLines ? '#ffffff' : '#e5e7eb';
          btn.textContent = showGrowthLines ? '开启' : '关闭';
        }
      }

      // 增速参考线按钮事件监听器
      const toggleGrowthLinesBtn = document.getElementById('toggleGrowthLines');
      if (toggleGrowthLinesBtn) {
        toggleGrowthLinesBtn.addEventListener('click', function () {
          showGrowthLines = !showGrowthLines;
          localStorage.setItem('goods_price_growth_lines', JSON.stringify(showGrowthLines));
          updateGrowthLinesButtonStyle();
          renderGrid();
        });
        updateGrowthLinesButtonStyle();
      }

      /* ── 仅收藏开关 ── */
      document.getElementById('toggleFavOnly').addEventListener('click', function () {
        showOnlyFavorites = !showOnlyFavorites;
        updateFavOnlyBtn();
        renderGrid();
      });
      updateFavOnlyBtn();
      document.getElementById('zoomModal').addEventListener('click', function () { closeZoomModal(); });
      document.getElementById('closeZoom').addEventListener('click', function () { closeZoomModal(); });
    });
  </script>

  <!-- 放大模态框 -->
  <div id="zoomModal"
    style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; cursor:pointer;">
    <div
      style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:90%; height:80%; max-width:1200px; background:#0b0f19; border-radius:12px; padding:20px; cursor:default;"
      onclick="event.stopPropagation();">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h3 id="zoomTitle" style="color:#e2e8f0; margin:0; font-size:18px;"></h3>
        <button id="closeZoom"
          style="background:none; border:none; color:#9aa4b2; font-size:24px; cursor:pointer; padding:4px 8px;">×</button>
      </div>
      <div id="zoomChart" style="width:100%; height:calc(100% - 60px);"></div>
    </div>
  </div>
</body>

</html>
