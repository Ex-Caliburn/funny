<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>磷化工产品价格（周度）— 趋势看板</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #0b0f19;
      color: #dbe0ea;
      padding: 16px 20px;
    }
    .top-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
    h2 { font-size: 18px; font-weight: 600; color: #e8edff; }
    .subtitle { font-size: 11px; color: #475569; margin-left: auto; }
    .tab-bar {
      display: flex; flex-wrap: wrap;
      background: #1e293b;
      border-radius: 10px; padding: 4px; gap: 3px;
      margin-bottom: 14px;
    }
    .tab-btn {
      padding: 6px 16px; border: none; border-radius: 7px;
      background: transparent; color: #94a3b8;
      font-size: 12px; font-weight: 600; cursor: pointer;
      transition: all 0.18s; white-space: nowrap;
    }
    .tab-btn.active { background: #3b82f6; color: #fff; box-shadow: 0 2px 8px rgba(59,130,246,0.4); }
    .tab-btn.active.compare { background: #1e3a5f; color: #93c5fd; }
    .tab-btn:hover:not(.active) { background: #334155; color: #e2e8f0; }
    .panel { display: none; }
    .panel.active { display: block; }
    /* 统计卡片 */
    .stat-bar { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .stat-card {
      background: #0f172a; border: 1px solid #1f2937;
      border-radius: 10px; padding: 10px 18px; min-width: 118px;
    }
    .stat-label { font-size: 11px; color: #64748b; margin-bottom: 2px; }
    .stat-sub { font-size: 10px; color: #334155; margin-bottom: 2px; }
    .stat-val { font-size: 21px; font-weight: 700; color: #e2e8f0; line-height: 1.2; }
    .stat-val.up { color: #ef4444; }
    .stat-val.dn { color: #22c55e; }
    /* 图表 */
    .chart-wrap { height: 66vh; }
    .loading { display: flex; align-items: center; justify-content: center; height: 66vh; color: #334155; font-size: 14px; }
  </style>
</head>
<body>
  <div class="top-bar">
    <h2>磷化工产品价格（周度）</h2>
    <span class="subtitle">数据来自 p2o5.com · 周度更新 · 单位：元/吨</span>
  </div>

  <div class="tab-bar" id="tab-bar" role="tablist" aria-label="品种">
    <button type="button" class="tab-btn active" data-key="phosphate_ore">磷矿石（30%P2O5）</button>
    <button type="button" class="tab-btn" data-key="yellow_phosphorus">黄磷（优等品）</button>
    <button type="button" class="tab-btn" data-key="phosphoric_acid_40">磷酸（40%P2O5/定制级）</button>
    <button type="button" class="tab-btn" data-key="phosphoric_acid_52">磷酸（52%P2O5/优等品）</button>
    <button type="button" class="tab-btn" data-key="phosphoric_acid_85i">磷酸（85%H3PO4/工业级/热法）</button>
    <button type="button" class="tab-btn" data-key="phosphoric_acid_85f">磷酸（85%H3PO4/食品级/湿法）</button>
    <button type="button" class="tab-btn" data-key="map_11_44">磷酸一铵（11-44）</button>
    <button type="button" class="tab-btn" data-key="map_11_61">工业磷酸一铵（11-61）</button>
    <button type="button" class="tab-btn" data-key="mcp_feed">磷酸二氢钙（饲料级）</button>
    <button type="button" class="tab-btn compare" data-key="compare">全品种对比</button>
  </div>

  <!-- 品种面板（共 9 个） -->
  <div id="panel-phosphate_ore" class="panel active">
    <div class="stat-bar" id="stats-phosphate_ore"></div>
    <div id="chart-phosphate_ore" class="chart-wrap"></div>
  </div>
  <div id="panel-yellow_phosphorus" class="panel">
    <div class="stat-bar" id="stats-yellow_phosphorus"></div>
    <div id="chart-yellow_phosphorus" class="chart-wrap"></div>
  </div>
  <div id="panel-phosphoric_acid_40" class="panel">
    <div class="stat-bar" id="stats-phosphoric_acid_40"></div>
    <div id="chart-phosphoric_acid_40" class="chart-wrap"></div>
  </div>
  <div id="panel-phosphoric_acid_52" class="panel">
    <div class="stat-bar" id="stats-phosphoric_acid_52"></div>
    <div id="chart-phosphoric_acid_52" class="chart-wrap"></div>
  </div>
  <div id="panel-phosphoric_acid_85i" class="panel">
    <div class="stat-bar" id="stats-phosphoric_acid_85i"></div>
    <div id="chart-phosphoric_acid_85i" class="chart-wrap"></div>
  </div>
  <div id="panel-phosphoric_acid_85f" class="panel">
    <div class="stat-bar" id="stats-phosphoric_acid_85f"></div>
    <div id="chart-phosphoric_acid_85f" class="chart-wrap"></div>
  </div>
  <div id="panel-map_11_44" class="panel">
    <div class="stat-bar" id="stats-map_11_44"></div>
    <div id="chart-map_11_44" class="chart-wrap"></div>
  </div>
  <div id="panel-map_11_61" class="panel">
    <div class="stat-bar" id="stats-map_11_61"></div>
    <div id="chart-map_11_61" class="chart-wrap"></div>
  </div>
  <div id="panel-mcp_feed" class="panel">
    <div class="stat-bar" id="stats-mcp_feed"></div>
    <div id="chart-mcp_feed" class="chart-wrap"></div>
  </div>

  <!-- 全品种对比面板 -->
  <div id="panel-compare" class="panel">
    <div class="stat-bar" id="stats-compare"></div>
    <div id="chart-compare" class="chart-wrap"></div>
  </div>

  <script src="../vendor/echarts.min.js"></script>
  <script>
  // ── 品种配置 ─────────────────────────────────────────────────
  var SERIES = [
    { key: 'phosphate_ore',       name: '磷矿石（30%P2O5）',            color: '#3b82f6' },
    { key: 'yellow_phosphorus',   name: '黄磷（优等品）',               color: '#f59e0b' },
    { key: 'phosphoric_acid_40',  name: '磷酸（40%P2O5/定制级）',       color: '#10b981' },
    { key: 'phosphoric_acid_52',  name: '磷酸（52%P2O5/优等品）',       color: '#06b6d4' },
    { key: 'phosphoric_acid_85i', name: '磷酸（85%H3PO4/工业级）',      color: '#ef4444' },
    { key: 'phosphoric_acid_85f', name: '磷酸（85%H3PO4/食品级）',      color: '#e879f9' },
    { key: 'map_11_44',           name: '磷酸一铵（11-44）',             color: '#8b5cf6' },
    { key: 'map_11_61',           name: '工业磷酸一铵（11-61）',         color: '#f97316' },
    { key: 'mcp_feed',            name: '磷酸二氢钙（饲料级）',          color: '#84cc16' }
  ];

  var DATA_FILE = '../phosphorus_chemical/weekly_prices.json';

  var YEAR_LINE_COLORS = ['#ef4444', '#3b82f6', '#10b981', '#8b5cf6', '#06b6d4'];
  var MOM_COLOR = '#f59e0b';
  var YOY_COLOR = '#e879f9';

  var rawData = null;
  var charts  = {};
  var loaded  = {};

  // ── 日期 → X 轴月份位置 ──────────────────────────────────────
  function dateToX(dateStr) {
    var p = dateStr.split('-');
    return parseFloat((+p[1] + (+p[2] - 1) / 31).toFixed(4));
  }

  // ── 按年分组 ─────────────────────────────────────────────────
  function groupByYear(arr) {
    var map = {};
    arr.forEach(function(item) {
      var y = item.date.slice(0, 4);
      if (!map[y]) map[y] = [];
      map[y].push(item);
    });
    return map;
  }

  // ── 月度采样（每月末最后一条）────────────────────────────────
  function sampleMonthly(yearMap) {
    var res = {};
    Object.keys(yearMap).forEach(function(year) {
      res[year] = {};
      yearMap[year].forEach(function(item) {
        var m = +item.date.slice(5, 7);
        res[year][m] = { price: item.price, x: dateToX(item.date) };
      });
    });
    return res;
  }

  // ── 计算月度环比 / 同比 ──────────────────────────────────────
  function calcRates(monthly) {
    var years     = Object.keys(monthly).sort();
    var latestYear = years[years.length - 1];
    var prevYear   = years.length >= 2 ? years[years.length - 2] : null;
    var momPts = [], yoyPts = [];

    for (var m = 1; m <= 12; m++) {
      var cur = monthly[latestYear][m];
      if (!cur) continue;
      var prevM = monthly[latestYear][m - 1];
      if (prevM) momPts.push([cur.x, +((cur.price - prevM.price) / prevM.price * 100).toFixed(2)]);
      if (prevYear && monthly[prevYear] && monthly[prevYear][m]) {
        var base = monthly[prevYear][m].price;
        yoyPts.push([cur.x, +((cur.price - base) / base * 100).toFixed(2)]);
      }
    }
    return { momPts: momPts, yoyPts: yoyPts, latestYear: latestYear, prevYear: prevYear };
  }

  // ── 统计卡片 HTML ────────────────────────────────────────────
  function makeCard(label, sub, valStr, numVal, extraStyle) {
    var cls = numVal !== null ? (numVal > 0 ? ' up' : numVal < 0 ? ' dn' : '') : '';
    return '<div class="stat-card"' + (extraStyle ? ' style="' + extraStyle + '"' : '') + '>'
      + '<div class="stat-label">' + label + '</div>'
      + '<div class="stat-sub">' + sub + '</div>'
      + '<div class="stat-val' + cls + '">' + valStr + '</div></div>';
  }

  // ── 渲染单品种统计卡片 ───────────────────────────────────────
  function renderStats(statsId, yearMap) {
    var monthly   = sampleMonthly(yearMap);
    var rates     = calcRates(monthly);
    var ly        = rates.latestYear;
    var months    = Object.keys(monthly[ly]).map(Number).sort(function(a, b) { return a - b; });
    var lm        = months[months.length - 1];
    var latestPrice = monthly[ly][lm].price;

    var wowVal = null, wowStr = '-';
    // 周度数据：直接用原始序列末尾两条计算涨跌
    var allPts = Object.keys(yearMap).sort().reduce(function(acc, y) {
      return acc.concat(yearMap[y]);
    }, []).sort(function(a, b) { return a.date.localeCompare(b.date); });
    if (allPts.length >= 2) {
      var cur  = allPts[allPts.length - 1].price;
      var prev = allPts[allPts.length - 2].price;
      wowVal = +((cur - prev) / prev * 100).toFixed(2);
      wowStr = (wowVal > 0 ? '+' : '') + wowVal + '%';
    }

    var yoyVal = null, yoyStr = '-';
    if (rates.prevYear && monthly[rates.prevYear] && monthly[rates.prevYear][lm]) {
      var base = monthly[rates.prevYear][lm].price;
      yoyVal = +((latestPrice - base) / base * 100).toFixed(2);
      yoyStr = (yoyVal > 0 ? '+' : '') + yoyVal + '%';
    }

    // 年内最高 / 最低
    var yearPts = yearMap[ly].map(function(d) { return d.price; });
    var hi = Math.max.apply(null, yearPts);
    var lo = Math.min.apply(null, yearPts);

    document.getElementById(statsId).innerHTML =
      makeCard('最新报价', ly + '年 ' + lm + '月末', latestPrice + ' 元/吨', null) +
      makeCard('周环比', '较上期', wowStr, wowVal) +
      makeCard('年同比', '较去年同期', yoyStr, yoyVal) +
      makeCard(ly + '年最高', '元/吨', hi + '', null) +
      makeCard(ly + '年最低', '元/吨', lo + '', null);
  }

  // ── 构建单品种年度叠加 ECharts option ────────────────────────
  function buildSeriesOption(yearMap, seriesCfg) {
    var monthly = sampleMonthly(yearMap);
    var rates   = calcRates(monthly);
    var years   = Object.keys(yearMap).sort();
    var ly      = rates.latestYear;
    var series  = [];

    years.forEach(function(year, idx) {
      var color    = YEAR_LINE_COLORS[idx % YEAR_LINE_COLORS.length];
      var isLatest = year === ly;
      var data = yearMap[year].map(function(item) {
        return { value: [dateToX(item.date), item.price], date: item.date };
      });
      series.push({
        name: year + '年',
        type: 'line',
        yAxisIndex: 0,
        data: data,
        smooth: false,
        symbol: 'circle',
        symbolSize: isLatest ? 7 : 4,
        lineStyle: { color: color, width: isLatest ? 2.5 : 1.5 },
        itemStyle: { color: color },
        z: isLatest ? 10 : idx + 1
      });
    });

    series.push({
      name: ly + '年环比%',
      type: 'line',
      yAxisIndex: 1,
      data: rates.momPts,
      smooth: true,
      symbol: 'triangle',
      symbolSize: 6,
      lineStyle: { color: MOM_COLOR, width: 2, type: 'dashed' },
      itemStyle: { color: MOM_COLOR }
    });
    series.push({
      name: ly + '年同比%',
      type: 'line',
      yAxisIndex: 1,
      data: rates.yoyPts,
      smooth: true,
      symbol: 'diamond',
      symbolSize: 6,
      lineStyle: { color: YOY_COLOR, width: 2, type: 'solid' },
      itemStyle: { color: YOY_COLOR }
    });

    return {
      backgroundColor: '#0b0f19',
      animation: true,
      tooltip: {
        trigger: 'axis',
        axisPointer: {
          type: 'line',
          snap: true,
          lineStyle: { color: '#475569', type: 'dashed', width: 1 }
        },
        backgroundColor: 'rgba(15,23,42,0.95)',
        borderColor: '#1f2937',
        textStyle: { color: '#e2e8f0', fontSize: 13 },
        formatter: function(params) {
          if (!params || !params.length) return '';
          var header = '';
          var lines = '';
          params.forEach(function(p) {
            var isRate = p.seriesName.indexOf('%') > -1;
            var v = Array.isArray(p.value) ? p.value[1] : p.value;
            if (v == null) return;
            var dateStr = p.data && p.data.date ? p.data.date : '';
            if (!header && dateStr) header = '<b>' + dateStr + '</b><br/>';
            lines += '<span style="color:' + p.color + '">●</span> '
              + p.seriesName + ': <b>' + v + '</b>'
              + (isRate ? '%' : ' 元/吨') + '<br/>';
          });
          return header + lines;
        }
      },
      legend: {
        top: 4,
        textStyle: { color: '#cbd5e1', fontSize: 12 },
        itemGap: 14
      },
      grid: { left: 72, right: 72, top: 50, bottom: 38 },
      xAxis: {
        type: 'value',
        min: 0.9, max: 13.1, interval: 1,
        axisLabel: {
          color: '#9aa4b2', fontSize: 12,
          formatter: function(val) {
            var m = Math.round(val);
            return (Math.abs(val - m) < 0.05 && m >= 1 && m <= 12) ? m + '月' : '';
          }
        },
        splitLine: { show: true, lineStyle: { color: '#1f2937' } },
        axisTick: { show: false },
        axisLine: { lineStyle: { color: '#334155' } }
      },
      yAxis: [
        {
          type: 'value', name: '元/吨', position: 'left',
          nameTextStyle: { color: '#64748b', fontSize: 11 },
          axisLabel: { color: '#9aa4b2', fontSize: 11 },
          splitLine: { lineStyle: { color: '#1f2937' } }
        },
        {
          type: 'value', name: '%', position: 'right',
          nameTextStyle: { color: '#64748b', fontSize: 11 },
          axisLabel: { color: '#9aa4b2', fontSize: 11, formatter: '{value}%' },
          splitLine: { show: false }
        }
      ],
      dataZoom: [
        { type: 'slider', bottom: 4, height: 18, start: 0, end: 100,
          textStyle: { color: '#9aa4b2', fontSize: 10 },
          handleStyle: { color: '#334155' },
          fillerColor: 'rgba(59,130,246,0.1)',
          borderColor: '#1f2937' },
        { type: 'inside' }
      ],
      series: series
    };
  }

  // ── 渲染全品种对比统计卡片 ───────────────────────────────────
  function renderCompareStats(statsId) {
    var latest = rawData.data[0];
    if (!latest) return;

    var html = makeCard('数据日期', '最新一期', latest.date, null);
    SERIES.forEach(function(s) {
      var price = latest[s.key];
      if (price != null) {
        html += makeCard(s.name.replace(/（[^）]+）/, ''), '元/吨', price + '', null,
          'border-color:' + s.color + '55');
      }
    });
    document.getElementById(statsId).innerHTML = html;
  }

  // ── 构建全品种对比 ECharts option（时间轴）──────────────────
  function buildCompareOption() {
    var series = SERIES.map(function(s) {
      var data = rawData.data
        .filter(function(item) { return item[s.key] != null; })
        .sort(function(a, b) { return a.date.localeCompare(b.date); })
        .map(function(item) { return [item.date, item[s.key]]; });
      return {
        name: s.name,
        type: 'line',
        data: data,
        smooth: false,
        symbol: 'none',
        lineStyle: { color: s.color, width: 2 },
        itemStyle: { color: s.color }
      };
    });

    return {
      backgroundColor: '#0b0f19',
      animation: false,
      tooltip: {
        trigger: 'axis',
        backgroundColor: 'rgba(15,23,42,0.95)',
        borderColor: '#1f2937',
        textStyle: { color: '#e2e8f0', fontSize: 12 },
        axisPointer: { type: 'line', snap: true, lineStyle: { color: '#475569', type: 'dashed', width: 1 } },
        formatter: function(params) {
          if (!params || !params.length) return '';
          var date = params[0].value[0];
          var html = '<b>' + date + '</b>';
          params.forEach(function(p) {
            var v = Array.isArray(p.value) ? p.value[1] : p.value;
            if (v != null) {
              html += '<br/><span style="color:' + p.color + '">●</span> '
                + p.seriesName + ': <b>' + v + '</b> 元/吨';
            }
          });
          return html;
        }
      },
      legend: {
        top: 4,
        textStyle: { color: '#cbd5e1', fontSize: 11 },
        itemGap: 12
      },
      grid: { left: 72, right: 24, top: 56, bottom: 38 },
      xAxis: {
        type: 'time',
        axisLabel: { color: '#9aa4b2', fontSize: 11 },
        splitLine: { lineStyle: { color: '#1f2937' } },
        axisLine: { lineStyle: { color: '#334155' } }
      },
      yAxis: {
        type: 'value',
        name: '元/吨',
        nameTextStyle: { color: '#64748b', fontSize: 11 },
        axisLabel: { color: '#9aa4b2', fontSize: 11 },
        splitLine: { lineStyle: { color: '#1f2937' } }
      },
      dataZoom: [
        { type: 'slider', bottom: 4, height: 18, start: 40, end: 100,
          textStyle: { color: '#9aa4b2', fontSize: 10 },
          handleStyle: { color: '#334155' },
          fillerColor: 'rgba(59,130,246,0.1)',
          borderColor: '#1f2937' },
        { type: 'inside' }
      ],
      series: series
    };
  }

  // ── 初始化单品种 tab ─────────────────────────────────────────
  function initSingleTab(key) {
    var chartEl = document.getElementById('chart-' + key);
    var statsId = 'stats-' + key;
    var cfg     = SERIES.find(function(s) { return s.key === key; });
    if (!cfg) return;

    var seriesData = rawData.data
      .map(function(item) { return { date: item.date, price: item[key] }; })
      .filter(function(item) { return item.price != null; })
      .sort(function(a, b) { return a.date.localeCompare(b.date); });

    var yearMap = groupByYear(seriesData);
    renderStats(statsId, yearMap);

    chartEl.innerHTML = '';
    var chart = echarts.init(chartEl, null, { renderer: 'canvas' });
    chart.setOption(buildSeriesOption(yearMap, cfg));
    charts[key] = chart;
    window.addEventListener('resize', function() { chart.resize(); });
  }

  // ── 初始化全品种对比 tab ─────────────────────────────────────
  function initCompareTab() {
    renderCompareStats('stats-compare');
    var chartEl = document.getElementById('chart-compare');
    chartEl.innerHTML = '';
    var chart = echarts.init(chartEl, null, { renderer: 'canvas' });
    chart.setOption(buildCompareOption());
    charts['compare'] = chart;
    window.addEventListener('resize', function() { chart.resize(); });
  }

  // ── 激活 tab ─────────────────────────────────────────────────
  function activateTab(key) {
    document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });
    var panel = document.getElementById('panel-' + key);
    if (panel) panel.classList.add('active');

    if (!rawData) return;

    if (!loaded[key]) {
      loaded[key] = true;
      if (key === 'compare') {
        initCompareTab();
      } else {
        initSingleTab(key);
      }
    } else if (charts[key]) {
      charts[key].resize();
    }
  }

  // ── tab 点击事件 ─────────────────────────────────────────────
  document.querySelectorAll('#tab-bar [data-key]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('#tab-bar [data-key]').forEach(function(b) {
        b.classList.remove('active');
      });
      btn.classList.add('active');
      activateTab(btn.dataset.key);
    });
  });

  // ── 加载数据后初始化首个 tab ─────────────────────────────────
  fetch(DATA_FILE + '?t=' + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(json) {
      rawData = json;
      activateTab('phosphate_ore');
    })
    .catch(function(err) {
      document.getElementById('chart-phosphate_ore').innerHTML =
        '<div class="loading" style="color:#ef4444;">数据加载失败：' + err.message + '</div>';
    });
  </script>
</body>
</html>
