<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;

        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;

        .container {
            /* max-width: 1400px; */

        table {
            width: 100%;

        }

        thead th {
            position: sticky;

        }

        thead tr:first-child th:first-child {
            position: sticky;
            top: 0;

        tbody td.period+td {
            position: sticky;

        tbody tr:hover td.period+td {
            background: #f8f9ff;

        tbody tr.year-group:hover td.period+td {

        thead tr:nth-child(2) th:first-child {

            box-shadow: -2px 0 4px rgba(0, 0, 0, 0.1);
        }

        .value {
            color: #333;
            font-weight: 500;
        }

        .change {
            font-weight: 600;
            font-size: 12px;
        }

        .change.positive {
            color: #10b981;
        }

        .change.negative {
            color: #ef4444;
        }

        .change.neutral {
            color: #6b7280;
        }

        .unit {
            color: #6b7280;
            font-size: 11px;
            margin-left: 2px;
        }

        .no-data {
            color: #9ca3af;
            font-style: italic;
        }

        .legend {
            margin-top: 15px;
            padding: 12px;
            background: #f9fafb;
            border-radius: 6px;
            font-size: 12px;
            color: #6b7280;
        }

        .legend-item {
            display: inline-block;
            margin-right: 20px;
        }

        .legend-color {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 2px;
            margin-right: 5px;
            vertical-align: middle;
        }

        .legend-color.positive {
            background: #10b981;
        }

        .legend-color.negative {
            background: #ef4444;
        }

        .year-group {
            background: #f0f0f0;
        }

        th.selectable {
            cursor: pointer;
            transition: background-color 0.2s;
        }

        th.selectable:hover {
            background: #e5e7eb;
        }

        th.selected {
            background: #d1d5db !important;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);

            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .chart-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 30px;
            width: 80%;
            max-height: 90vh;
            position: relative;
            overflow: auto;
        }

        .chart-close {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 32px;
            height: 32px;
            border: none;
            background: #f0f0f0;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .chart-close:hover {
            background: #e0e0e0;
            color: #333;
        }

        .chart-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
            padding-right: 40px;
        }

        .chart-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            color: #666;
        }

        .chart-loading.hidden {
            display: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .chart-canvas-wrapper {
            display: none;
        }

        .chart-canvas-wrapper.visible {
            display: block;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>中国海洋石油数据对比分析</h1>
        <div class="controls">
            <div class="btn-group">
                <button class="btn active" onclick="switchView('quarterly', event)">单季度数据</button>
                <button class="btn" onclick="switchView('cumulative', event)">累计数据</button>
            </div>
        </div>

        <div id="content">
            <!-- 油气合并表格 -->
            <div class="table-section">
                <h2>油气合并数据</h2>
                <div class="table-wrapper">
                    <table id="oilGasTable">
                        <thead>
                            <!-- 表头由JavaScript动态生成 -->
                        </thead>
                        <tbody id="oilGasTableBody">
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 石油表格 -->
            <div class="table-section">
                <h2>石油数据</h2>
                <div class="table-wrapper">
                    <table id="oilTable">
                        <thead>
                            <!-- 表头由JavaScript动态生成 -->
                        </thead>
                        <tbody id="oilTableBody">
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 天然气表格 -->
            <div class="table-section">
                <h2>天然气数据</h2>
                <div class="table-wrapper">
                    <table id="gasTable">
                        <thead>
                            <!-- 表头由JavaScript动态生成 -->
                        </thead>
                        <tbody id="gasTableBody">
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="legend">
                <div class="legend-item"><span class="legend-color positive"></span>增长</div>
                <div class="legend-item"><span class="legend-color negative"></span>下降</div>
                <div class="legend-item">同比：与上一年同期相比</div>
                <div class="legend-item">环比：与上一个报告期相比</div>
                <div class="legend-item">提示：点击表头列名可查看该数据的曲线图</div>
            </div>
        </div>

        <!-- 图表弹窗 -->
        <div id="chartModal" class="modal-overlay" onclick="closeChartModal(event)">
            <div class="chart-container" onclick="event.stopPropagation()">
                <button class="chart-close" onclick="closeChartModal()" title="关闭">×</button>
                <div class="chart-title" id="chartTitle"></div>
                <div class="chart-loading" id="chartLoading">
                    <div class="spinner"></div>
                    <div>正在加载图表...</div>
                </div>
                <div class="chart-canvas-wrapper" id="chartCanvasWrapper">
                    <canvas id="dataChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 原始累计数据（从JSON文件加载）
        let rawData = {
            oil: [],
            gas: [],
            oilGas: [] // 合并的油气数据
        };

        // 从JSON文件加载数据（优先使用修正数据文件）
        async function loadData() {
            try {
                // 优先尝试加载修正数据文件
                let response = await fetch('cnooc_data_corrected.json');
                let jsonData;
                let isCorrectedData = false;
                
                if (!response.ok) {
                    // 如果修正数据文件不存在，回退到原始数据文件
                    console.warn('修正数据文件不存在，使用原始数据文件');
                    response = await fetch('cnooc_data.json');
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    jsonData = await response.json();
                } else {
                    isCorrectedData = true;
                    jsonData = await response.json();
                }
                
                const summary = jsonData.summary || [];

                // 将summary数据转换为表格数据格式
                rawData.oil = [];
                rawData.gas = [];

                summary.forEach(item => {
                    // 修正数据文件已经有period字段，原始数据文件需要从filename推断
                    let period = item.period || '';
                    let year = parseInt(item.year);
                    
                    // 暂时隐藏2021年数据
                    if (year === 2021) {
                        return; // 跳过2021年的数据
                    }
                    let month = 0;

                    if (!period) {
                        // 从文件名推断报告期（兼容原始数据格式）
                        if (item.filename.includes('第一季度')) {
                            period = `${year}年1-3月`;
                            month = 3;
                        } else if (item.filename.includes('半年度') || item.filename.includes('半年')) {
                            period = `${year}年上半年`;
                            month = 6;
                        } else if (item.filename.includes('第三季度')) {
                            period = `${year}年1-9月`;
                            month = 9;
                        } else if ((item.filename.includes('年度报告') || item.filename.includes('年报')) && !item.filename.includes('半年度')) {
                            period = `${year}年全年`;
                            month = 12;
                        }
                    } else {
                        // 从period字段推断month
                        if (period.includes('1-3月')) month = 3;
                        else if (period.includes('上半年')) month = 6;
                        else if (period.includes('1-9月')) month = 9;
                        else if (period.includes('全年')) month = 12;
                    }

                    if (period) {
                        // 石油数据
                        if (item.oil) {
                            rawData.oil.push({
                                period: period,
                                year: year,
                                month: month,
                                type: 'cumulative',
                                // 修正数据文件已经是亿元单位，原始数据文件需要转换
                                // 如果值为0，也处理为null（表示数据缺失）
                                revenue: (item.oil.revenue && item.oil.revenue !== 0) ? (isCorrectedData ? item.oil.revenue : item.oil.revenue / 100000000) : null,
                                cost: (item.oil.cost && item.oil.cost !== 0) ? (isCorrectedData ? item.oil.cost : item.oil.cost / 100000000) : null,
                                production: (item.oil.production && item.oil.production !== 0) ? item.oil.production : null, // 百万桶
                                sales: (item.oil.sales && item.oil.sales !== 0) ? item.oil.sales : null, // 百万桶
                                price: (item.oil.price && item.oil.price !== 0) ? item.oil.price : null, // 美元/桶
                                unitCost: (item.oil.unitCost && item.oil.unitCost !== 0) ? item.oil.unitCost : null // 美元/桶（从PDF提取）
                            });
                        }

                        // 天然气数据
                        if (item.gas) {
                            rawData.gas.push({
                                period: period,
                                year: year,
                                month: month,
                                type: 'cumulative',
                                // 修正数据文件已经是亿元单位，原始数据文件需要转换
                                // 如果值为0，也处理为null（表示数据缺失）
                                revenue: (item.gas.revenue && item.gas.revenue !== 0) ? (isCorrectedData ? item.gas.revenue : item.gas.revenue / 100000000) : null,
                                cost: (item.gas.cost && item.gas.cost !== 0) ? (isCorrectedData ? item.gas.cost : item.gas.cost / 100000000) : null,
                                production: (item.gas.production && item.gas.production !== 0) ? item.gas.production : null, // 十亿立方英尺
                                sales: (item.gas.sales && item.gas.sales !== 0) ? item.gas.sales : null, // 十亿立方英尺
                                price: (item.gas.price && item.gas.price !== 0) ? item.gas.price : null, // 美元/千立方英尺
                                unitCost: (item.gas.unitCost && item.gas.unitCost !== 0) ? item.gas.unitCost : null // 美元/千立方英尺（从PDF提取）
                            });
                        }
                    }
                });

                // 按时间排序
                rawData.oil.sort((a, b) => {
                    if (a.year !== b.year) return a.year - b.year;
                    return a.month - b.month;
                });

                rawData.gas.sort((a, b) => {
                    if (a.year !== b.year) return a.year - b.year;
                    return a.month - b.month;
                });

                // 创建合并的油气数据
                rawData.oilGas = [];
                const periodMap = new Map();
                
                // 合并石油和天然气数据
                rawData.oil.forEach(oilItem => {
                    const key = `${oilItem.year}-${oilItem.month}`;
                    if (!periodMap.has(key)) {
                        periodMap.set(key, {
                            period: oilItem.period,
                            year: oilItem.year,
                            month: oilItem.month,
                            type: 'cumulative',
                            revenue: null,
                            cost: null,
                            production: null,
                            grossMargin: null,
                            netProfit: null, // 归母净利润，需要从数据中提取
                            totalProduction: null, // 油气总产量（百万桶油当量）
                            totalSales: null // 油气总销量（百万桶油当量）
                        });
                    }
                    const item = periodMap.get(key);
                    // 处理营收和成本：如果值为null或undefined，保持为null；如果为0，也保持为null（表示数据缺失）
                    const oilRevenue = (oilItem.revenue !== null && oilItem.revenue !== undefined && oilItem.revenue !== 0) ? oilItem.revenue : null;
                    const oilCost = (oilItem.cost !== null && oilItem.cost !== undefined && oilItem.cost !== 0) ? oilItem.cost : null;
                    const currentRevenue = (item.revenue !== null && item.revenue !== undefined && item.revenue !== 0) ? item.revenue : null;
                    const currentCost = (item.cost !== null && item.cost !== undefined && item.cost !== 0) ? item.cost : null;
                    
                    if (oilRevenue !== null && currentRevenue !== null) {
                        item.revenue = currentRevenue + oilRevenue;
                    } else if (oilRevenue !== null) {
                        item.revenue = oilRevenue;
                    } else if (currentRevenue !== null) {
                        item.revenue = currentRevenue;
                    } else {
                        item.revenue = null;
                    }
                    
                    if (oilCost !== null && currentCost !== null) {
                        item.cost = currentCost + oilCost;
                    } else if (oilCost !== null) {
                        item.cost = oilCost;
                    } else if (currentCost !== null) {
                        item.cost = currentCost;
                    } else {
                        item.cost = null;
                    }
                    // 产量：石油（百万桶）和天然气（十亿立方英尺）不能直接相加，需要转换为统一单位
                    // 这里先保留石油产量，后续可以添加天然气产量（需要转换单位）
                });
                
                rawData.gas.forEach(gasItem => {
                    const key = `${gasItem.year}-${gasItem.month}`;
                    if (!periodMap.has(key)) {
                        periodMap.set(key, {
                            period: gasItem.period,
                            year: gasItem.year,
                            month: gasItem.month,
                            type: 'cumulative',
                            revenue: null,
                            cost: null,
                            production: null,
                            grossMargin: null,
                            netProfit: null, // 归母净利润
                            operatingRevenue: null, // 营业收入
                            totalProduction: null, // 油气总产量（百万桶油当量）
                            totalSales: null // 油气总销量（百万桶油当量）
                        });
                    }
                    const item = periodMap.get(key);
                    // 处理营收和成本：如果值为null或undefined，保持为null；如果为0，也保持为null（表示数据缺失）
                    const gasRevenue = (gasItem.revenue !== null && gasItem.revenue !== undefined && gasItem.revenue !== 0) ? gasItem.revenue : null;
                    const gasCost = (gasItem.cost !== null && gasItem.cost !== undefined && gasItem.cost !== 0) ? gasItem.cost : null;
                    const currentRevenue = (item.revenue !== null && item.revenue !== undefined && item.revenue !== 0) ? item.revenue : null;
                    const currentCost = (item.cost !== null && item.cost !== undefined && item.cost !== 0) ? item.cost : null;
                    
                    if (gasRevenue !== null && currentRevenue !== null) {
                        item.revenue = currentRevenue + gasRevenue;
                    } else if (gasRevenue !== null) {
                        item.revenue = gasRevenue;
                    } else if (currentRevenue !== null) {
                        item.revenue = currentRevenue;
                    } else {
                        item.revenue = null;
                    }
                    
                    if (gasCost !== null && currentCost !== null) {
                        item.cost = currentCost + gasCost;
                    } else if (gasCost !== null) {
                        item.cost = gasCost;
                    } else if (currentCost !== null) {
                        item.cost = currentCost;
                    } else {
                        item.cost = null;
                    }
                });
                
                // 计算毛利率和产量，提取归母净利润
                periodMap.forEach(item => {
                    // 计算毛利率 = (销售收入 - 成本) / 销售收入 * 100%
                    if (item.revenue && item.revenue > 0 && item.cost !== null && item.cost !== 0) {
                        item.grossMargin = ((item.revenue - item.cost) / item.revenue * 100).toFixed(2);
                    } else {
                        item.grossMargin = null;
                    }
                    
                    // 产量：暂时使用石油产量，后续可以添加合并产量计算
                    const oilItem = rawData.oil.find(o => o.period === item.period);
                    const gasItem = rawData.gas.find(g => g.period === item.period);
                    // 产量单位不同，暂时不合并，可以显示为"石油产量/天然气产量"
                    item.oilProduction = oilItem ? oilItem.production : null;
                    item.gasProduction = gasItem ? gasItem.production : null;
                    
                    // 从summary中提取归母净利润、营业收入、总产量、总销量
                    const summaryItem = summary.find(s => s.period === item.period);
                    if (summaryItem) {
                        if (summaryItem.netProfit !== null && summaryItem.netProfit !== undefined && summaryItem.netProfit !== 0) {
                            // 修正数据文件已经是亿元单位，原始数据文件需要转换
                            item.netProfit = isCorrectedData ? summaryItem.netProfit : (summaryItem.netProfit / 100000000);
                        } else {
                            item.netProfit = null;
                        }
                        if (summaryItem.operatingRevenue !== null && summaryItem.operatingRevenue !== undefined && summaryItem.operatingRevenue !== 0) {
                            // 修正数据文件已经是亿元单位，原始数据文件需要转换
                            item.operatingRevenue = isCorrectedData ? summaryItem.operatingRevenue : (summaryItem.operatingRevenue / 100000000);
                        } else {
                            item.operatingRevenue = null;
                        }
                        if (summaryItem.totalProduction !== null && summaryItem.totalProduction !== undefined && summaryItem.totalProduction !== 0) {
                            item.totalProduction = summaryItem.totalProduction; // 百万桶油当量，单位不变
                        } else {
                            item.totalProduction = null;
                        }
                        if (summaryItem.totalSales !== null && summaryItem.totalSales !== undefined && summaryItem.totalSales !== 0) {
                            item.totalSales = summaryItem.totalSales; // 百万桶油当量，单位不变
                        } else {
                            item.totalSales = null;
                        }
                    }
                    
                    rawData.oilGas.push(item);
                });
                
                // 按时间排序
                rawData.oilGas.sort((a, b) => {
                    if (a.year !== b.year) return a.year - b.year;
                    return a.month - b.month;
                });

                console.log('已加载数据，石油:', rawData.oil.length, '条，天然气:', rawData.gas.length, '条，合并:', rawData.oilGas.length, '条');
            } catch (error) {
                console.error('加载数据失败:', error);
                rawData.oil = [];
                rawData.gas = [];
            }
        }

        // 图表相关变量
        let currentChart = null;
        let currentViewType = 'quarterly';
        let currentSelectedColumn = null;
        let currentProduct = null;

        // 关闭图表弹窗
        function closeChartModal(event) {
            const chartModal = document.getElementById('chartModal');
            const chartLoading = document.getElementById('chartLoading');
            const chartCanvasWrapper = document.getElementById('chartCanvasWrapper');

            if (!event) {
                if (chartModal) chartModal.classList.remove('active');
                if (chartLoading) {
                    chartLoading.classList.remove('hidden');
                    chartLoading.innerHTML = '<div class="spinner"></div><div>正在加载图表...</div>';
                }
                if (chartCanvasWrapper) chartCanvasWrapper.classList.remove('visible');
                return;
            }

            if (event.target.classList && event.target.classList.contains('chart-close')) {
                if (chartModal) chartModal.classList.remove('active');
                if (chartLoading) {
                    chartLoading.classList.remove('hidden');
                    chartLoading.innerHTML = '<div class="spinner"></div><div>正在加载图表...</div>';
                }
                if (chartCanvasWrapper) chartCanvasWrapper.classList.remove('visible');
                return;
            }

            if (event.target === event.currentTarget) {
                if (chartModal) chartModal.classList.remove('active');
                if (chartLoading) {
                    chartLoading.classList.remove('hidden');
                    chartLoading.innerHTML = '<div class="spinner"></div><div>正在加载图表...</div>';
                }
                if (chartCanvasWrapper) chartCanvasWrapper.classList.remove('visible');
            }
        }

        // 选择列并绘制图表
        function selectColumn(columnKey, columnName, unit, product, evt) {
            try {
                console.log('selectColumn被调用:', columnKey, columnName, unit, product, '当前视图:', currentViewType);

                // 移除之前的选中状态
                document.querySelectorAll('th.selectable').forEach(th => {
                    th.classList.remove('selected');
                });

                // 添加选中状态
                if (evt && evt.target) {
                    const th = evt.target.closest('th.selectable');
                    if (th) {
                        th.classList.add('selected');
                    }
                }

                // 立即显示弹窗和loading
                const chartModal = document.getElementById('chartModal');
                const chartLoading = document.getElementById('chartLoading');
                const chartCanvasWrapper = document.getElementById('chartCanvasWrapper');

                if (!chartModal || !chartLoading || !chartCanvasWrapper) {
                    console.error('弹窗元素未找到');
                    alert('弹窗元素未找到，请刷新页面重试');
                    return;
                }

                chartLoading.classList.remove('hidden');
                chartCanvasWrapper.classList.remove('visible');

                const chartTitle = document.getElementById('chartTitle');
                if (chartTitle) {
                    chartTitle.textContent = `${product === 'oil' ? '石油' : '天然气'} - ${columnName}趋势图 (${unit})`;
                }

                chartModal.classList.add('active');
                console.log('弹窗已显示');

                requestAnimationFrame(() => {
                    setTimeout(() => {
                        try {
                            const allData = getAllData(currentViewType, product);

                            if (!allData || allData.length === 0) {
                                throw new Error('没有可用的数据');
                            }

                            const labels = [];
                            const values = [];
                            const yoyChanges = [];
                            const qoqChanges = [];
                            const isCumulative = currentViewType === 'cumulative';

                            allData.forEach((item, index) => {
                                labels.push(item.period);
                                const value = item[columnKey];
                                values.push(value !== null && value !== undefined ? value : null);

                                const baseYoY = findYoYData(item, allData);
                                const baseQoQ = !isCumulative ? findQoQData(item, allData, index) : null;

                                const yoyChange = baseYoY && baseYoY[columnKey] !== null && value !== null
                                    ? calculateChange(value, baseYoY[columnKey])
                                    : null;
                                const qoqChange = !isCumulative && baseQoQ && baseQoQ[columnKey] !== null && value !== null
                                    ? calculateChange(value, baseQoQ[columnKey])
                                    : null;

                                yoyChanges.push(yoyChange !== null ? parseFloat(yoyChange) : null);
                                qoqChanges.push(qoqChange !== null ? parseFloat(qoqChange) : null);
                            });

                            const hasValidData = values.some(v => v !== null && v !== undefined);
                            if (!hasValidData) {
                                throw new Error('该列没有有效数据');
                            }

                            const datasets = [
                                {
                                    label: columnName + ' (数值)',
                                    data: values,
                                    borderColor: 'rgb(102, 126, 234)',
                                    backgroundColor: 'rgba(102, 126, 234, 0.1)',
                                    borderWidth: 2,
                                    fill: true,
                                    tension: 0.4,
                                    yAxisID: 'y'
                                },
                                {
                                    label: '同比变化 (%)',
                                    data: yoyChanges,
                                    borderColor: 'rgb(16, 185, 129)',
                                    backgroundColor: 'rgba(16, 185, 129, 0.1)',
                                    borderWidth: 2,
                                    borderDash: [5, 5],
                                    fill: false,
                                    tension: 0.4,
                                    yAxisID: 'y1'
                                }
                            ];

                            if (!isCumulative) {
                                datasets.push({
                                    label: '环比变化 (%)',
                                    data: qoqChanges,
                                    borderColor: 'rgb(239, 68, 68)',
                                    backgroundColor: 'rgba(239, 68, 68, 0.1)',
                                    borderWidth: 2,
                                    borderDash: [5, 5],
                                    fill: false,
                                    tension: 0.4,
                                    yAxisID: 'y1'
                                });
                            }

                            if (currentChart) {
                                currentChart.destroy();
                            }

                            const ctx = document.getElementById('dataChart').getContext('2d');
                            currentChart = new Chart(ctx, {
                                type: 'line',
                                data: {
                                    labels: labels,
                                    datasets: datasets
                                },
                                options: {
                                    responsive: true,
                                    maintainAspectRatio: true,
                                    interaction: {
                                        mode: 'index',
                                        intersect: false,
                                    },
                                    plugins: {
                                        legend: {
                                            display: true,
                                            position: 'top',
                                        },
                                        tooltip: {
                                            callbacks: {
                                                label: function (context) {
                                                    let label = context.dataset.label || '';
                                                    if (label) {
                                                        const value = context.parsed.y;
                                                        if (value !== null && value !== undefined) {
                                                            if (context.dataset.yAxisID === 'y1') {
                                                                label += ': ' + value.toFixed(2) + '%';
                                                            } else {
                                                                label += ': ' + value.toFixed(2);
                                                            }
                                                        } else {
                                                            label += '-';
                                                        }
                                                        return label;
                                                    }
                                                }
                                            }
                                        }
                                    },
                                    scales: {
                                        y: {
                                            type: 'linear',
                                            display: true,
                                            position: 'left',
                                            title: {
                                                display: true,
                                                text: columnName + ' (' + unit + ')'
                                            }
                                        },
                                        y1: {
                                            type: 'linear',
                                            display: true,
                                            position: 'right',
                                            title: {
                                                display: true,
                                                text: '变化率 (%)'
                                            },
                                            grid: {
                                                drawOnChartArea: false,
                                            },
                                        }
                                    }
                                }
                            });

                            chartLoading.classList.add('hidden');
                            chartCanvasWrapper.classList.add('visible');

                            currentSelectedColumn = columnKey;
                            currentProduct = product;
                        } catch (error) {
                            console.error('渲染图表失败:', error);
                            chartLoading.innerHTML = '<div style="color: #ef4444; text-align: center; padding: 20px;">图表加载失败: ' + (error.message || '未知错误') + '<br><button onclick="closeChartModal()" style="margin-top: 10px; padding: 8px 16px; background: #667eea; color: white; border: none; border-radius: 4px; cursor: pointer;">关闭</button></div>';
                        }
                    }, 50);
                });
            } catch (error) {
                console.error('selectColumn函数执行失败:', error);
                alert('打开图表失败: ' + (error.message || '未知错误'));
            }
        }

        // 计算季度数据
        function calculateQuarterlyData(product) {
            const quarterlyData = [];
            const sourceData = rawData[product] || [];

            const years = [...new Set(sourceData.map(d => d.year).filter(y => Number.isFinite(y)))].sort((a, b) => a - b);
            years.forEach(year => {
                const yearData = sourceData.filter(d => d.year === year).sort((a, b) => a.month - b.month);

                const q1 = yearData.find(d => d.period.includes('1-3月'));
                if (q1) {
                    quarterlyData.push({
                        period: `${year}年Q1`,
                        year: year,
                        month: 3,
                        quarter: 1,
                        type: 'quarterly',
                        revenue: q1.revenue,
                        cost: q1.cost,
                        production: q1.production,
                        sales: q1.sales
                    });
                }

                const h1 = yearData.find(d => d.period.includes('上半年'));
                const q1Data = yearData.find(d => d.period.includes('1-3月'));
                if (h1 && q1Data) {
                    quarterlyData.push({
                        period: `${year}年Q2`,
                        year: year,
                        month: 6,
                        quarter: 2,
                        type: 'quarterly',
                        revenue: (h1.revenue !== null && h1.revenue !== undefined && q1Data.revenue !== null && q1Data.revenue !== undefined) ? (h1.revenue - q1Data.revenue) : null,
                        cost: (h1.cost !== null && h1.cost !== undefined && q1Data.cost !== null && q1Data.cost !== undefined) ? (h1.cost - q1Data.cost) : null,
                        production: (h1.production !== null && h1.production !== undefined && q1Data.production !== null && q1Data.production !== undefined) ? (h1.production - q1Data.production) : null,
                        sales: (h1.sales !== null && h1.sales !== undefined && q1Data.sales !== null && q1Data.sales !== undefined) ? (h1.sales - q1Data.sales) : null
                    });
                }

                const q3Cum = yearData.find(d => d.period.includes('1-9月'));
                if (q3Cum && h1) {
                    quarterlyData.push({
                        period: `${year}年Q3`,
                        year: year,
                        month: 9,
                        quarter: 3,
                        type: 'quarterly',
                        revenue: (q3Cum.revenue !== null && q3Cum.revenue !== undefined && h1.revenue !== null && h1.revenue !== undefined) ? (q3Cum.revenue - h1.revenue) : null,
                        cost: (q3Cum.cost !== null && q3Cum.cost !== undefined && h1.cost !== null && h1.cost !== undefined) ? (q3Cum.cost - h1.cost) : null,
                        production: (q3Cum.production !== null && q3Cum.production !== undefined && h1.production !== null && h1.production !== undefined) ? (q3Cum.production - h1.production) : null,
                        sales: (q3Cum.sales !== null && q3Cum.sales !== undefined && h1.sales !== null && h1.sales !== undefined) ? (q3Cum.sales - h1.sales) : null
                    });
                }

                const fullYear = yearData.find(d => d.period.includes('全年'));
                if (fullYear && q3Cum) {
                    quarterlyData.push({
                        period: `${year}年Q4`,
                        year: year,
                        month: 12,
                        quarter: 4,
                        type: 'quarterly',
                        revenue: (fullYear.revenue !== null && fullYear.revenue !== undefined && q3Cum.revenue !== null && q3Cum.revenue !== undefined) ? (fullYear.revenue - q3Cum.revenue) : null,
                        cost: (fullYear.cost !== null && fullYear.cost !== undefined && q3Cum.cost !== null && q3Cum.cost !== undefined) ? (fullYear.cost - q3Cum.cost) : null,
                        production: (fullYear.production !== null && fullYear.production !== undefined && q3Cum.production !== null && q3Cum.production !== undefined) ? (fullYear.production - q3Cum.production) : null,
                        sales: (fullYear.sales !== null && fullYear.sales !== undefined && q3Cum.sales !== null && q3Cum.sales !== undefined) ? (fullYear.sales - q3Cum.sales) : null
                    });
                }
            });

            // 计算成本(单位)、毛利率
            // 注意：价格和单位成本优先使用从PDF直接提取的数据
            quarterlyData.forEach(item => {
                // 如果没有从PDF提取到unitCost，则通过成本和销量计算
                if (!item.unitCost) {
                    if (product === 'oil') {
                        // 石油：成本(美元/桶) = 成本(亿元) / 销量(百万桶) × 100
                        if (item.cost && item.sales && item.sales > 0) {
                            item.unitCost = (item.cost / item.sales) * 100;
                        } else {
                            item.unitCost = null;
                        }
                    } else {
                        // 天然气：成本(美元/千立方英尺) = 成本(亿元) / 销量(十亿立方英尺) × 1000
                        if (item.cost && item.sales && item.sales > 0) {
                            item.unitCost = (item.cost / item.sales) * 1000;
                        } else {
                            item.unitCost = null;
                        }
                    }
                }

                // 毛利率 = (实现价格 - 成本) / 实现价格 × 100%
                if (item.price !== null && item.unitCost !== null && item.price > 0) {
                    item.grossMargin = ((item.price - item.unitCost) / item.price * 100).toFixed(2);
                } else {
                    item.grossMargin = null;
                }
            });

            return quarterlyData;
        }

        // 合并累计数据和季度数据
        function getAllData(viewType, product) {
            let data = [];

            if (viewType === 'quarterly') {
                data = calculateQuarterlyData(product);
            } else {
                data = rawData[product].map(d => ({ ...d, isCumulative: true }));
            }

            // 计算成本(单位)、毛利率
            // 注意：价格和单位成本优先使用从PDF直接提取的数据
            data.forEach(item => {
                // 如果没有从PDF提取到unitCost，则通过成本和销量计算
                if (!item.unitCost) {
                    if (product === 'oil') {
                        // 石油：成本(美元/桶) = 成本(亿元) / 销量(百万桶) × 100
                        if (item.cost && item.sales && item.sales > 0) {
                            item.unitCost = (item.cost / item.sales) * 100;
                        } else {
                            item.unitCost = null;
                        }
                    } else {
                        // 天然气：成本(美元/千立方英尺) = 成本(亿元) / 销量(十亿立方英尺) × 1000
                        if (item.cost && item.sales && item.sales > 0) {
                            item.unitCost = (item.cost / item.sales) * 1000;
                        } else {
                            item.unitCost = null;
                        }
                    }
                }

                if (item.price !== null && item.unitCost !== null && item.price > 0) {
                    item.grossMargin = ((item.price - item.unitCost) / item.price * 100).toFixed(2);
                } else {
                    item.grossMargin = null;
                }
            });

            return data.sort((a, b) => {
                if (a.year !== b.year) return a.year - b.year;
                return (a.month || 0) - (b.month || 0);
            });
        }

        // 格式化数字
        function formatValue(value) {
            if (value === null || value === undefined || isNaN(value)) {
                return '<span class="no-data">-</span>';
            }
            const numValue = typeof value === 'string' ? parseFloat(value) : value;
            if (isNaN(numValue)) {
                return '<span class="no-data">-</span>';
            }
            // 如果值为0，也显示为空（因为0通常表示数据缺失）
            if (numValue === 0) {
                return '<span class="no-data">-</span>';
            }
            return numValue.toFixed(2);
        }

        // 计算变化百分比
        function calculateChange(current, previous) {
            // 如果当前值或前一个值为null、undefined或0，返回null
            if (current === null || current === undefined || current === 0 ||
                previous === null || previous === undefined || previous === 0) {
                return null;
            }
            return ((current - previous) / previous * 100).toFixed(2);
        }

        // 格式化变化百分比
        function formatChange(change) {
            if (change === null) {
                return '<span class="no-data">-</span>';
            }
            const num = parseFloat(change);
            const className = num > 0 ? 'positive' : (num < 0 ? 'negative' : 'neutral');
            const sign = num > 0 ? '+' : '';
            return `<span class="change ${className}">${sign}${change}%</span>`;
        }

        // 查找同比数据
        function findYoYData(currentItem, dataArray) {
            let periodType = '';
            if (currentItem.period.includes('Q1')) periodType = 'Q1';
            else if (currentItem.period.includes('Q2')) periodType = 'Q2';
            else if (currentItem.period.includes('Q3')) periodType = 'Q3';
            else if (currentItem.period.includes('Q4')) periodType = 'Q4';
            else if (currentItem.period.includes('1-3月')) periodType = '1-3月';
            else if (currentItem.period.includes('上半年')) periodType = '上半年';
            else if (currentItem.period.includes('1-9月')) periodType = '1-9月';
            else if (currentItem.period.includes('全年')) periodType = '全年';

            const samePeriod = dataArray.find(item =>
                item.year === currentItem.year - 1 &&
                item.period.includes(periodType)
            );
            return samePeriod;
        }

        // 查找环比数据
        function findQoQData(currentItem, dataArray, currentIndex) {
            if (currentIndex > 0) {
                return dataArray[currentIndex - 1];
            }
            return null;
        }

        // 渲染表头（根据视图类型动态调整）
        function renderTableHeader(viewType, product) {
            const tableId = product === 'oil' ? 'oilTable' : 'gasTable';
            const thead = document.querySelector(`#${tableId} thead`);
            const isCumulative = viewType === 'cumulative';
            
            // 定义所有列
            // 去掉成本列，天然气去掉完全成本和毛利率
            const allColumns = [
                { key: 'revenue', name: '营收', unit: product === 'oil' ? '亿元' : '亿元' },
                { key: 'cost', name: '成本', unit: product === 'oil' ? '亿元' : '亿元' },
                { key: 'production', name: '产量', unit: product === 'oil' ? '百万桶' : '十亿立方英尺' },
                { key: 'sales', name: '销量', unit: product === 'oil' ? '百万桶' : '十亿立方英尺' },
                { key: 'price', name: '实现价格', unit: product === 'oil' ? '美元/桶' : '美元/千立方英尺' },
                { key: 'unitCost', name: '完全成本', unit: product === 'oil' ? '美元/桶' : '美元/千立方英尺' },
                { key: 'grossMargin', name: '毛利率', unit: '%' }
            ];
            
            // 过滤列：
            // 1. 去掉成本列
            // 2. 单季度视图（非累积）去掉销量、实现价格、完全成本、毛利率
            const columns = allColumns.filter(col => {
                if (col.key === 'cost') return false; // 去掉成本列
                if (!isCumulative && (col.key === 'sales' || col.key === 'price' || col.key === 'unitCost' || col.key === 'grossMargin')) {
                    return false; // 单季度视图去掉销量、实现价格、完全成本、毛利率
                }
                return true;
            });
            
            // 构建表头HTML
            let headerRow1 = '<tr><th rowspan="2">报告期</th>';
            let headerRow2 = '<tr>';
            
            columns.forEach(col => {
                // 累计视图显示2列（数值、同比），单季度视图显示3列（数值、同比、环比）
                const colspan = isCumulative ? 2 : 3;
                headerRow1 += `<th colspan="${colspan}" class="selectable" data-column="${col.key}" data-name="${col.name}" data-unit="${col.unit}" data-product="${product}" onclick="selectColumn('${col.key}', '${col.name}', '${col.unit}', '${product}', event)">${col.name}<br><span style="font-size:10px;font-weight:normal">(${col.unit})</span></th>`;
                
                headerRow2 += '<th>数值</th><th>同比</th>';
                if (!isCumulative) {
                    headerRow2 += '<th>环比</th>';
                }
            });
            
            headerRow1 += '</tr>';
            headerRow2 += '</tr>';
            
            thead.innerHTML = headerRow1 + headerRow2;
        }

        // 渲染合并油气表格
        function renderOilGasTable(viewType) {
            const thead = document.querySelector('#oilGasTable thead');
            const tbody = document.getElementById('oilGasTableBody');
            const isCumulative = viewType === 'cumulative';
            
            // 定义列
            const columns = [
                { key: 'operatingRevenue', name: '营业收入', unit: '亿元' },
                { key: 'revenue', name: '油气销售收入', unit: '亿元' },
                { key: 'totalProduction', name: '油气总产量', unit: '百万桶油当量' },
                { key: 'totalSales', name: '油气总销量', unit: '百万桶油当量' },
                { key: 'cost', name: '营业成本', unit: '亿元' },
                { key: 'grossMargin', name: '毛利率', unit: '%' },
                { key: 'netProfit', name: '归母净利润', unit: '亿元' }
            ];
            
            // 构建表头
            let headerRow1 = '<tr><th rowspan="2">报告期</th>';
            let headerRow2 = '<tr>';
            
            columns.forEach(col => {
                const colspan = isCumulative ? 2 : 3;
                headerRow1 += `<th colspan="${colspan}" class="selectable" data-column="${col.key}" data-name="${col.name}" data-unit="${col.unit}" data-product="oilGas" onclick="selectColumn('${col.key}', '${col.name}', '${col.unit}', 'oilGas', event)">${col.name}<br><span style="font-size:10px;font-weight:normal">(${col.unit})</span></th>`;
                headerRow2 += '<th>数值</th><th>同比</th>';
                if (!isCumulative) {
                    headerRow2 += '<th>环比</th>';
                }
            });
            
            headerRow1 += '</tr>';
            headerRow2 += '</tr>';
            thead.innerHTML = headerRow1 + headerRow2;
            
            // 渲染数据
            tbody.innerHTML = '';
            const allData = rawData.oilGas || [];
            const columnCount = columns.length;
            const totalCols = isCumulative ? (1 + columnCount * 2) : (1 + columnCount * 3);
            let lastYear = null;
            
            allData.forEach((item, index) => {
                if (lastYear !== item.year) {
                    if (lastYear !== null) {
                        const separatorRow = document.createElement('tr');
                        separatorRow.innerHTML = `<td colspan="${totalCols}" style="height: 5px; background: #f5f5f5;"></td>`;
                        tbody.appendChild(separatorRow);
                    }
                    lastYear = item.year;
                }
                
                const row = document.createElement('tr');
                row.innerHTML += `<td class="period">${item.period}</td>`;
                
                const baseYoY = allData.find(d => d.year === item.year - 1 && d.month === item.month);
                const baseQoQ = index > 0 ? allData[index - 1] : null;
                
                // 营业收入
                const operatingRevenueYoYChange = baseYoY && baseYoY.operatingRevenue !== null && item.operatingRevenue !== null ? calculateChange(item.operatingRevenue, baseYoY.operatingRevenue) : null;
                const operatingRevenueQoQChange = !isCumulative && baseQoQ && baseQoQ.operatingRevenue !== null && item.operatingRevenue !== null ? calculateChange(item.operatingRevenue, baseQoQ.operatingRevenue) : null;
                row.innerHTML += `<td class="value">${formatValue(item.operatingRevenue)}</td>`;
                row.innerHTML += `<td>${formatChange(operatingRevenueYoYChange)}</td>`;
                if (!isCumulative) {
                    row.innerHTML += `<td>${formatChange(operatingRevenueQoQChange)}</td>`;
                }
                
                // 油气销售收入
                const revenueYoYChange = baseYoY && baseYoY.revenue !== null && item.revenue !== null ? calculateChange(item.revenue, baseYoY.revenue) : null;
                const revenueQoQChange = !isCumulative && baseQoQ && baseQoQ.revenue !== null && item.revenue !== null ? calculateChange(item.revenue, baseQoQ.revenue) : null;
                row.innerHTML += `<td class="value">${formatValue(item.revenue)}</td>`;
                row.innerHTML += `<td>${formatChange(revenueYoYChange)}</td>`;
                if (!isCumulative) {
                    row.innerHTML += `<td>${formatChange(revenueQoQChange)}</td>`;
                }
                
                // 油气总产量（百万桶油当量）
                const totalProductionYoYChange = baseYoY && baseYoY.totalProduction !== null && item.totalProduction !== null ? calculateChange(item.totalProduction, baseYoY.totalProduction) : null;
                const totalProductionQoQChange = !isCumulative && baseQoQ && baseQoQ.totalProduction !== null && item.totalProduction !== null ? calculateChange(item.totalProduction, baseQoQ.totalProduction) : null;
                row.innerHTML += `<td class="value">${formatValue(item.totalProduction)}</td>`;
                row.innerHTML += `<td>${formatChange(totalProductionYoYChange)}</td>`;
                if (!isCumulative) {
                    row.innerHTML += `<td>${formatChange(totalProductionQoQChange)}</td>`;
                }
                
                // 油气总销量（百万桶油当量）
                const totalSalesYoYChange = baseYoY && baseYoY.totalSales !== null && item.totalSales !== null ? calculateChange(item.totalSales, baseYoY.totalSales) : null;
                const totalSalesQoQChange = !isCumulative && baseQoQ && baseQoQ.totalSales !== null && item.totalSales !== null ? calculateChange(item.totalSales, baseQoQ.totalSales) : null;
                row.innerHTML += `<td class="value">${formatValue(item.totalSales)}</td>`;
                row.innerHTML += `<td>${formatChange(totalSalesYoYChange)}</td>`;
                if (!isCumulative) {
                    row.innerHTML += `<td>${formatChange(totalSalesQoQChange)}</td>`;
                }
                
                // 营业成本
                const costYoYChange = baseYoY && baseYoY.cost !== null && item.cost !== null ? calculateChange(item.cost, baseYoY.cost) : null;
                const costQoQChange = !isCumulative && baseQoQ && baseQoQ.cost !== null && item.cost !== null ? calculateChange(item.cost, baseQoQ.cost) : null;
                row.innerHTML += `<td class="value">${formatValue(item.cost)}</td>`;
                row.innerHTML += `<td>${formatChange(costYoYChange)}</td>`;
                if (!isCumulative) {
                    row.innerHTML += `<td>${formatChange(costQoQChange)}</td>`;
                }
                
                // 毛利率
                const grossMarginYoYChange = baseYoY && baseYoY.grossMargin !== null && item.grossMargin !== null ? calculateChange(parseFloat(item.grossMargin), parseFloat(baseYoY.grossMargin)) : null;
                const grossMarginQoQChange = !isCumulative && baseQoQ && baseQoQ.grossMargin !== null && item.grossMargin !== null ? calculateChange(parseFloat(item.grossMargin), parseFloat(baseQoQ.grossMargin)) : null;
                const grossMarginValue = item.grossMargin !== null && item.grossMargin !== undefined && !isNaN(item.grossMargin) ? parseFloat(item.grossMargin) : null;
                row.innerHTML += `<td class="value">${grossMarginValue !== null ? grossMarginValue.toFixed(2) + '%' : '<span class="no-data">-</span>'}</td>`;
                row.innerHTML += `<td>${formatChange(grossMarginYoYChange)}</td>`;
                if (!isCumulative) {
                    row.innerHTML += `<td>${formatChange(grossMarginQoQChange)}</td>`;
                }
                
                // 归母净利润
                const netProfitYoYChange = baseYoY && baseYoY.netProfit !== null && item.netProfit !== null ? calculateChange(item.netProfit, baseYoY.netProfit) : null;
                const netProfitQoQChange = !isCumulative && baseQoQ && baseQoQ.netProfit !== null && item.netProfit !== null ? calculateChange(item.netProfit, baseQoQ.netProfit) : null;
                row.innerHTML += `<td class="value">${formatValue(item.netProfit)}</td>`;
                row.innerHTML += `<td>${formatChange(netProfitYoYChange)}</td>`;
                if (!isCumulative) {
                    row.innerHTML += `<td>${formatChange(netProfitQoQChange)}</td>`;
                }
                
                tbody.appendChild(row);
            });
        }

        // 渲染表格
        function renderTable(viewType, product) {
            const tableId = product === 'oil' ? 'oilTable' : 'gasTable';
            const tbodyId = product === 'oil' ? 'oilTableBody' : 'gasTableBody';
            
            // 先渲染表头
            renderTableHeader(viewType, product);
            
            const tbody = document.getElementById(tbodyId);
            tbody.innerHTML = '';

            const allData = getAllData(viewType, product);
            const isCumulative = viewType === 'cumulative';
            let lastYear = null;
            
            // 计算总列数（用于分隔行的colspan）
            // 根据实际显示的列数计算
            // 累积视图：石油和天然气都有：营收、产量、销量、实现价格、完全成本、毛利率 = 6列
            // 单季度视图：营收、产量 = 2列
            const columnCount = isCumulative ? 6 : 2;
            const totalCols = isCumulative ? (1 + columnCount * 2) : (1 + columnCount * 3);

            allData.forEach((item, index) => {
                if (lastYear !== item.year) {
                    if (lastYear !== null) {
                        const separatorRow = document.createElement('tr');
                        separatorRow.innerHTML = `<td colspan="${totalCols}" style="height: 5px; background: #f5f5f5;"></td>`;
                        tbody.appendChild(separatorRow);
                    }
                    lastYear = item.year;
                }

                const row = document.createElement('tr');
                if (item.isCumulative) {
                    row.classList.add('year-group');
                }

                row.innerHTML += `<td class="period">${item.period}</td>`;

                const baseYoY = findYoYData(item, allData);
                const baseQoQ = findQoQData(item, allData, index);

                // 营收
                const revenueYoYChange = baseYoY && baseYoY.revenue !== null ? calculateChange(item.revenue, baseYoY.revenue) : null;
                const revenueQoQChange = !isCumulative && baseQoQ && baseQoQ.revenue !== null ? calculateChange(item.revenue, baseQoQ.revenue) : null;
                row.innerHTML += `<td class="value">${formatValue(item.revenue)}</td>`;
                row.innerHTML += `<td>${formatChange(revenueYoYChange)}</td>`;
                if (!isCumulative) {
                    row.innerHTML += `<td>${formatChange(revenueQoQChange)}</td>`;
                }

                // 产量
                const productionYoYChange = baseYoY && baseYoY.production !== null ? calculateChange(item.production, baseYoY.production) : null;
                const productionQoQChange = !isCumulative && baseQoQ && baseQoQ.production !== null ? calculateChange(item.production, baseQoQ.production) : null;
                row.innerHTML += `<td class="value">${formatValue(item.production)}</td>`;
                row.innerHTML += `<td>${formatChange(productionYoYChange)}</td>`;
                if (!isCumulative) {
                    row.innerHTML += `<td>${formatChange(productionQoQChange)}</td>`;
                }

                // 销量（仅累积视图显示）
                if (isCumulative) {
                    const salesYoYChange = baseYoY && baseYoY.sales !== null ? calculateChange(item.sales, baseYoY.sales) : null;
                    row.innerHTML += `<td class="value">${formatValue(item.sales)}</td>`;
                    row.innerHTML += `<td>${formatChange(salesYoYChange)}</td>`;
                }

                // 实现价格（仅累积视图显示）
                if (isCumulative) {
                    const priceYoYChange = baseYoY && baseYoY.price !== null && item.price !== null ? calculateChange(item.price, baseYoY.price) : null;
                    row.innerHTML += `<td class="value">${formatValue(item.price)}</td>`;
                    row.innerHTML += `<td>${formatChange(priceYoYChange)}</td>`;
                }

                // 完全成本（仅累积视图显示）
                if (isCumulative) {
                    const unitCostYoYChange = baseYoY && baseYoY.unitCost !== null && item.unitCost !== null ? calculateChange(item.unitCost, baseYoY.unitCost) : null;
                    row.innerHTML += `<td class="value">${formatValue(item.unitCost)}</td>`;
                    row.innerHTML += `<td>${formatChange(unitCostYoYChange)}</td>`;
                }

                // 毛利率（仅累积视图显示）
                if (isCumulative) {
                    const grossMarginYoYChange = baseYoY && baseYoY.grossMargin !== null && item.grossMargin !== null ? calculateChange(parseFloat(item.grossMargin), parseFloat(baseYoY.grossMargin)) : null;
                    const grossMarginValue = item.grossMargin !== null && item.grossMargin !== undefined && !isNaN(item.grossMargin) ? parseFloat(item.grossMargin) : null;
                    row.innerHTML += `<td class="value">${grossMarginValue !== null ? grossMarginValue.toFixed(2) + '%' : '<span class="no-data">-</span>'}</td>`;
                    row.innerHTML += `<td>${formatChange(grossMarginYoYChange)}</td>`;
                }

                tbody.appendChild(row);
            });
        }

        // 切换视图
        function switchView(viewType, event) {
            document.querySelectorAll('.btn').forEach(btn => {
                btn.classList.remove('active');
            });
            if (event && event.target) {
                event.target.classList.add('active');
            } else {
                const buttons = document.querySelectorAll('.btn');
                buttons.forEach(btn => {
                    if ((viewType === 'quarterly' && btn.textContent.includes('单季度')) ||
                        (viewType === 'cumulative' && btn.textContent.includes('累计'))) {
                        btn.classList.add('active');
                    }
                });
            }

            currentViewType = viewType;
            closeChartModal();
            currentSelectedColumn = null;

            // 重新渲染表头和表格
            renderOilGasTable(viewType);
            renderTable(viewType, 'oil');
            renderTable(viewType, 'gas');
        }

        // 初始化
        async function initialize() {
            await loadData();

            if (rawData.oil.length === 0 && rawData.gas.length === 0) {
                console.error('数据加载失败或数据为空');
                return;
            }

            console.log('数据加载完成，准备渲染表格');

            // 初始化时渲染表头和表格（默认单季度视图）
            renderOilGasTable('quarterly');
            renderTable('quarterly', 'oil');
            renderTable('quarterly', 'gas');
        }

        // 页面加载完成后初始化
        window.addEventListener('DOMContentLoaded', initialize);
    </script>
</body>

</html>
